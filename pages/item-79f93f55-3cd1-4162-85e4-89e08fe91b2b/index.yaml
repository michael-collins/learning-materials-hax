content: >-
  <p>A character's left and right sides are the same, so you only need to model
  one of them. In this part you'll cut the base mesh in half and add a
  <em>Mirror</em> modifier, which shows the other half as a live copy.
  Everything you add to one side from now on, edge loops included, appears on
  the other side too. You'll need the base mesh from the last part, at a scale
  of 1. The video uses Blender 2.90.</p>


  <oer-video id="video-vX7hPXzRSAw"
  src="https://www.youtube.com/watch?v=vX7hPXzRSAw" title="Rigging Part 02 -
  Mirror Modifier" credit="Michael Collins"
  credit-url="https://www.youtube.com/channel/UCp1cLW7rry_NKRhcH8bPfGg"></oer-video>


  <h2>Why not the mesh's own mirror option?</h2>

  <ol>
    <li>
      <p><strong>Try the mirror option in Edit Mode.</strong> <page-anchor target="#video-vX7hPXzRSAw" value="0">0:00</page-anchor> Select the mesh and press <kbd>Tab</kbd> to go into <em>Edit Mode</em>. At the top right of the viewport there are mirror buttons for each axis (X, Y and Z, beside a butterfly icon). Turn on <em>X</em> and whatever you select or move on one side is done on the other side too.</p>
    </li>
    <li>
      <p><strong>See where it falls short.</strong> <page-anchor target="#video-vX7hPXzRSAw" value="21">0:21</page-anchor> It doesn't work for every operation. Press <kbd>Ctrl</kbd> <kbd>R</kbd> to add an edge loop and it's only added on one side. A <em>Mirror</em> modifier works better. Turn the X mirror option off again <page-anchor target="#video-vX7hPXzRSAw" value="42">0:42</page-anchor>.</p>
      <figure><img src="files/setting-up-a-mirror-modifier-t0032.0.jpg" alt="The base mesh in Edit Mode in the Front Orthographic view, with the X mirror button highlighted at the top right of the viewport. A new edge loop crosses the arm on the right of the picture, but there's no matching loop on the other arm. The Loop Cut and Slide panel is open at the bottom left."><figcaption><p>With the X mirror option on, a loop cut still goes on one side only.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Cut the mesh in half</h2>

  <ol>
    <li>
      <p><strong>Select one half's faces.</strong> <page-anchor target="#video-vX7hPXzRSAw" value="42">0:42</page-anchor> Press <kbd>3</kbd> for face select mode and drag a box across the left half of the mesh.</p>
    </li>
    <li>
      <p><strong>Delete them.</strong> <page-anchor target="#video-vX7hPXzRSAw" value="50">0:50</page-anchor> Press <kbd>X</kbd> and choose <em>Faces</em>. Orbit around and the character is cut down the middle, leaving one arm and one leg.</p>
      <figure><img src="files/setting-up-a-mirror-modifier-t0052.4.jpg" alt="In the Front Orthographic view, the left half of the character's faces are selected in orange, up to the middle line. The Delete menu is open, listing Vertices, Edges, Faces, Only Edges and Faces, Only Faces, the Dissolve options, Limited Dissolve, Collapse Edges and Faces, and Edge Loops."><figcaption><p>The left half selected, with the Delete menu open.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Clear the blue edges, if you like.</strong> <page-anchor target="#video-vX7hPXzRSAw" value="66">1:06</page-anchor> Some edges show in blue. That's information about those edges (they're marked as sharp) that came in with the FBX. It doesn't matter, but if it's distracting, select everything and choose <em>Edge → Clear Sharp</em>.</p>
      <figure><img src="files/setting-up-a-mirror-modifier-t0084.8.jpg" alt="The half mesh in Edit Mode, all of it selected in orange. The Edge menu is open, with Clear Sharp highlighted between Mark Sharp and Mark Sharp from Vertices."><figcaption><p>Edge → Clear Sharp removes the blue sharp-edge marks.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Add the Mirror modifier</h2>

  <ol>
    <li>
      <p><strong>Check the origin.</strong> <page-anchor target="#video-vX7hPXzRSAw" value="94">1:34</page-anchor> The object's origin needs to be right in the middle of the character, where the two halves meet. Here it already is. Press <kbd>Tab</kbd> to go back to <em>Object Mode</em>.</p>
    </li>
    <li>
      <p><strong>Add a Mirror modifier.</strong> <page-anchor target="#video-vX7hPXzRSAw" value="105">1:45</page-anchor> In the <em>Modifier Properties</em> (the wrench tab), choose <em>Add Modifier → Mirror</em>, in the <em>Generate</em> column. Because the origin is in the middle, the other half appears in exactly the right place. If yours shows up on the wrong side, try another <em>Axis</em> until the mirrored half is where it should be. Here the default, X, is right.</p>
      <figure><img src="files/setting-up-a-mirror-modifier-t0122.8.jpg" alt="The whole character in wireframe again, both arms and both legs, in Object Mode. The Mirror modifier's panel is open at the right, with Axis X turned on, Bisect and Flip off, Clipping off and Merge on at 0.001 m."><figcaption><p>The Mirror modifier fills in the missing half, mirrored across X.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Keep Merge turned on.</strong> <page-anchor target="#video-vX7hPXzRSAw" value="139">2:19</page-anchor> Shade the mesh smooth and check the middle of the character: there should be no gaps. That's what the modifier's <em>Merge</em> option does: it joins the vertices where the two halves meet, so the mesh behaves as one solid piece. Turn Merge off and the shading breaks along the middle, because each side is treated as a separate piece <page-anchor target="#video-vX7hPXzRSAw" value="156">2:36</page-anchor>. It doesn't matter much yet, but you'll need Merge on if you apply the modifier later.</p>
      <figure><img src="files/setting-up-a-mirror-modifier-t0148.4.jpg" alt="A close view of the smooth-shaded chest and arms with the Mirror modifier's Merge checkbox turned off. A dark line runs down the middle of the body where the two halves meet."><figcaption><p>With Merge off, a seam shows where the two halves meet.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Know where Apply is.</strong> <page-anchor target="#video-vX7hPXzRSAw" value="186">3:06</page-anchor> Don't apply the modifier yet. When you do, in Blender 2.90 and later, <em>Apply</em> is in the dropdown menu at the top of the modifier's panel (in 2.8 versions it was a button).</p>
      <figure><img src="files/setting-up-a-mirror-modifier-t0190.8.jpg" alt="The smooth-shaded character in Object Mode. The dropdown arrow on the Mirror modifier's header is open, showing Apply at the top, with the tooltip Apply modifier and remove from the stack."><figcaption><p>Apply is in the modifier's dropdown menu. Leave it for now.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Wrap-up</h2>

  <p>The base mesh is now half a character with a Mirror modifier showing the
  other half, merged down the middle. From here on you only work on one side,
  and the modifier keeps the other side matching as you add the geometry the
  character needs to bend.</p>

