content: >-
  <p>A production report is a comprehensive update about what progress has been
  made for of planning, research, and production — at times, all three. A report
  can consist of any visual documentation and text description including
  screenshot images, photographs of prototypes, video of working functionality,
  code snippets, production artwork, concept maps, research findings, work
  inspiration, storyboards and scripts, etc.</p>

  <p><strong>Each blog post should be a minimum of 500 words long, and include
  images or other media.</strong></p>

  <p>Reports will be due regularly throughout the course to document your
  progress.</p>

  <h2>What to include:</h2>

  <h3>Timesheet</h3>

  <p>Include an approximate breakdown of how much time you spent on your
  classwork. This is good practice for tracking your time in professional
  settings and helps your instructor assess your work. Aim for 8 hours each
  week, for example:</p>

  <ul>

  <li>Researching website platforms: 1 hour</li>

  <li>Writing content outline: 1 hour</li>

  <li>Collecting visual design inspiration: 1 hour</li>

  <li>Figma mockup: 3 hours</li>

  <li>Writing blog post: 1 hour</li>

  </ul>

  <p>You can get more specific if you want. Free apps like <a
  href="https://toggl.com/track/automated-time-tracker/">Toggl</a> let you set
  timers on your computer and generate timesheets.</p>

  <h3>Reply to Feedback</h3>

  <p>Write a short response to recent feedback you received from your
  instructor, advisor, or classmates. (Aprox. 100 words)</p>

  <h3>Open-ended writing</h3>

  <p>Describe your research, process, goals, and so on for the bulk of the post.
  Include images and screenshots to document the state of your project.</p>

  <p>Make sure to include links to any online files or websites you've created.
  The more you share the better!</p>

  <h2>Platforms</h2>

  <p>The production blog can be hosted anywhere. If you already have a blog
  created, you may use your existing blog to track progress for this
  project.</p>

  <p>Recommended blog platforms:</p>

  <ul>

  <li><a href="https://sites.psu.edu">sites.psu.edu</a></li>

  <li><a href="https://notion.so">Notion</a> (a nice option to <a
  href="https://www.notion.com/help/guides/build-a-website-with-notion-in-seconds-no-coding-required">create
  a public blog</a> alongside private notes)</li>

  <li><a href="https://spark.adobe.com/">Adobe Spark</a></li>

  </ul>

  <h2>Submission details</h2>

  <p>Post a link to the relevant blog post in each week's Canvas discussion.</p>
