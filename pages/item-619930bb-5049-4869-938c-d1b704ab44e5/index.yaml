  <h4>Formatting requirements:</h4>

  <ol>

  <li>PDF document in US Letter size.</li>

  <li>Please see <a
  href="/articles/dmd300-documentation-resources">documentation resources</a>
  for guidance.</li>

  <li>Proofread and spellcheck</li>

  </ol>

  <h4>Submission details:</h4>

  <ol>

  <li>Upload the PDF document to the canvas assignment by the deadline.</li>

  <li>Upload PDF to production blog by the deadline.</li>

