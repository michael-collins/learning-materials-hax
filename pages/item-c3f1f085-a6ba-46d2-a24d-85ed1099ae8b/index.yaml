content: >
  <p>In this exercise, you will practice polygonal modeling fundamentals and
  using reference images to create a chess piece</p>

  <oer-iframe
  src="https://youtube.com/embed/videoseries?list=PLcAjW37cz5QlafOnfBirWwtx83ZQ-6K4t"
  title="Modeling a Chavet 121 series no 6 Knight Tutorial"></oer-iframe>

  <h2>Learning Objectives</h2>

  <ol>

  <li>Practice working from reference images</li>

  <li>Practice using 3D software interface and terminology.</li>

  <li>Use modeling workflows to create high quality topology and edge flow.</li>

  <li>Familiarize yourself with a cumulative number of hotkeys and operations
  (it's a good idea to keep a personal log of hotkeys and operators that you
  will likely use again, as you go).</li>

  </ol>

  <h2>Instructions</h2>

  <p>Use the attached reference Image by The One Called Michael, courtesy of
  Chess.com of a Knight from the <strong>Chavet 121 series no 6</strong>.

  &lt;BR&gt;<br>

  The image I used was originally found at this link:
  https://images.chesscomfiles.com/uploads/v1/images_users/tiny_mce/TheOneCalledMichael/phpKothXC.jpeg</p>

  <h2>Grading Rubric</h2>

