content: >
  <p>For this project, you will produce 3D rendered poster series of objects
  that you encounter every day, but augmented in such a way changing their
  nature including material qualities, operation or use, or the system or
  environmental context.</p>

  <p>To explore these concepts, we delve into the philosophical realm of objects
  and their existence, considering how we interact with them in both a
  functional and perceptual sense. <a
  href="https://www.merriam-webster.com/dictionary/ontology"><em><strong>Ontology</strong></em></a>,
  the study of being, invites us to question not just what objects <em>are</em>
  but <em>how</em> they are—how they exist independently of human utility and
  purpose. By distorting or modifying the object, you are encouraged to explore
  the essence of its being outside of the roles assigned to it by human need or
  desire.</p>

  <p>We will also touch on the concept of hyper-objects—entities that transcend
  our immediate comprehension and experience, such as climate change or the
  internet. These phenomena challenge our usual boundaries of time, space, and
  perception. As you alter your chosen object, consider whether it can become
  something more than a mere item of daily use. Can its altered form push it
  into a new realm of being, perhaps even taking on characteristics of a
  hyper-object that defies easy understanding?</p>

  <p><strong>Further reading:</strong></p>

  <ol>

  <li><a
  href="http://ezaccess.libraries.psu.edu/login?url=https://search.ebscohost.com/login.aspx?direct=true&amp;db=nlebk&amp;AN=672907&amp;site=ehost-live&amp;scope=site&amp;ebv=EB&amp;ppid=pp_Cover"><strong>Anthony
  Dunne &amp; Fiona Raby - <em>Speculative Everything: Design, Fiction, and
  Social Dreaming</em></strong></a> <strong>(2013):</strong> Dunne and Raby
  explore the use of speculative design as a tool for reimagining objects and
  systems. This book will help you think critically about how design can
  question the status quo and offer alternative realities, which aligns with the
  idea of augmenting objects to alter their utility and context.</li>

  <li><a
  href="http://ezaccess.libraries.psu.edu/login?url=https://search.ebscohost.com/login.aspx?direct=true&amp;db=nlebk&amp;AN=2332813&amp;site=ehost-live&amp;scope=site&amp;ebv=EB&amp;ppid=pp_15"><strong>Joseph
  Bedford - Is There an Object Oriented Architecture? : Engaging Graham
  Harman</strong></a> <strong>(2020):</strong> Harman's work is central to
  Object-Oriented Ontology (OOO), a branch of metaphysics that explores the
  independence of objects from human perception. This book provides a
  foundational understanding of how objects interact with one another outside of
  human intervention.</li>

  <li><a
  href="https://ebookcentral.proquest.com/lib/pensu/detail.action?docID=1477347"><strong>Timothy
  Morton - <em>Hyperobjects: Philosophy and Ecology after the End of the
  World</em></strong></a> <strong>(2013):</strong> Morton introduces the concept
  of hyper-objects, entities that are massively distributed in time and space.
  His work helps us understand how objects might exist beyond immediate human
  comprehension, providing insight into the philosophical underpinnings of your
  project.</li>

  <li><a
  href="https://www-jstor-org.ezaccess.libraries.psu.edu/stable/j.ctv111jh6w.2"><strong>Jane
  Bennett - <em>Vibrant Matter: A Political Ecology of Things</em></strong></a>
  <strong>(2010):</strong> Bennett’s work on new materialism discusses the
  vitality of objects and their ability to act independently of human agency.
  This text expands on the idea that objects possess their own agency and
  liveliness.</li>

  <li><a href="https://carbonfarm.us/555/bogost-ontography.pdf"><strong>Ian
  Bogost - <em>Alien Phenomenology, or What It’s Like to Be a
  Thing</em></strong></a> <strong>(2012):</strong> This book explores the
  speculative philosophy of objects and offers a more accessible take on
  object-oriented thought, pushing you to think about objects beyond
  human-centered perspectives.</li>

  </ol>

  <h2>Learning Objectives</h2>

  <ol>

  <li>Demonstrate understanding of modeling, texturing, lighting and rendering
  using 3D software.</li>

  <li>Practice creative problem solving and visual storytelling skills.</li>

  <li>Explore ideas of material, form, and ontology through creative image
  production.</li>

  <li>Engage with conceptual questions related to the 'object' through a short
  work statement. (Your writing should be specific to your work, and not be
  generated via AI tools)</li>

  </ol>

  <h2>Instructions</h2>

  <ol>

  <li><strong>Read</strong> the project description and identify at least one of
  the listed readings to aid in the pre-viz research.</li>

  <li>Review the project <strong>requirements.</strong></li>

  <li><strong>Review links</strong> in Associated Material to see how artists
  and designers engage with related themes to the project.</li>

  <li>Go through the <strong>project development process</strong> (<em>See
  downloads for diagram image</em>):

  <ol>

  <li>Pre-viz (references, sketch, research)</li>

  <li>Concept development proposals</li>

  <li>Production steps (model, texture, light, render) and post-production
  (compositing, color grade, export)</li>

  <li>Work Statement</li>

  </ol>

  </li>

  <li>You will engage in an online feedback and discussion with your peers.</li>

  </ol>

  <h2>Requirements</h2>

  <p><strong>Pre-viz:</strong></p>

  <ol>

  <li><strong>Sketches (.jpg or .png):</strong> label, and write ideas in
  physical/digital sketchbook.

  <ul>

  <li>Fill 3 to 5 pages of your sketchbook with project ideas. You may also work
  digitally if you prefer an all digital workflow, in which case, sketch the
  equivalent of 3 to 5 pages of a paper sketchbook.</li>

  <li>Upload&nbsp;<code>jpg</code>&nbsp;or&nbsp;<code>png</code>&nbsp;images of
  sketchbook pages.</li>

  <li>Must be clearly scanned or photographed. This should look professional, do
  not upload blurry, rotated, poorly cropped images.</li>

  </ul>

  </li>

  <li><strong>Reference sheet (.jpg or .png):</strong>&nbsp;Find reference
  images and put them into a large image canvas.&nbsp;<a
  href="https://3.bp.blogspot.com/-4Yut0Kf3RvM/VsMZtsN8XaI/AAAAAAAABLs/vHE3iQ7FtLw/s1600/Roman_Times_Moodboard_.jpg">See
  example</a>&nbsp;of mood board. Save as a single image.

  <ul>

  <li>You can use <a href="https://www.pureref.com/">PureRef</a>,
  Photoshop,&nbsp;<a href="https://www.mural.co/">Mural.co</a>, or similar
  tools.</li>

  <li>Submit references as a combined image as
  a&nbsp;<code>png</code>&nbsp;or&nbsp;<code>jpg</code></li>

  </ul>

  </li>

  <li><strong>Work intent (.doc):</strong>&nbsp;Describe what you will be doing.

  <ul>

  <li>Include name and date</li>

  <li>Short one sentence description of what you intend to make.</li>

  <li>Upload this in an MS Word&nbsp;<code>doc</code>&nbsp;format.</li>

  </ul>

  </li>

  </ol>

  <p><strong>Production updates (.jpg or .png):</strong></p>

  <ol>

  <li>Submit screenshots from software showing significant progress to
  the&nbsp;<strong>Project updates</strong>&nbsp;discussion thread.</li>

  <li>Write a reflection about your creative process, technical process, and if
  AI tools are being used. If AI tools are used, which ones, how are they being
  used, and how did they impact your work, process, and outcomes.</li>

  <li>Meet with instructor if needed.</li>

  </ol>

  <p><strong>Work Statement (.doc):</strong></p>

  <p>A work statement is a clear articulation about what you’ve made. This is
  not a journal entry, where you might feel compelled to complain about problems
  you’ve had with software, or that it didn’t turn out how you wanted. Instead,
  imagine this is being printed in a magazine, or put on the side of a gallery.
  What do you want your viewers to come away with?<br>

  <br>

  <strong>Upload work (.zip):</strong></p>

  <ol>

  <li>Four rendered images total. Three posters and one render with the posters
  in a scene arranged on a wall.

  <ol>

  <li>The posters should be 2400px × 3600px in portrait orientation (tall).</li>

  <li>The rendered poster scene should be 1920px x 1080px landscape orientation
  (wide).</li>

  </ol>

  </li>

  <li>Upload final materials as
  a&nbsp;<code>LASTNAME-project1-files.zip</code>&nbsp;file

  <ol>

  <li>Include final work statement

  <ul>

  <li>MS Word .doc format</li>

  <li>150 words minimum</li>

  <li>file name:&nbsp;<code>LASTNAME-project1-statement.doc</code></li>

  </ul>

  </li>

  <li>Include the media you created</li>

  </ol>

  </li>

  <li>Post your render(s) to the&nbsp;<strong>Project
  discussion</strong>&nbsp;discussion thread.</li>

  <li>Participate in work critique with peers.</li>

  </ol>

