content: >-
  <p>Design a kit of no more than three part types that press-fit into at least
  two different structures. Slots must be parameterized to your measured kerf.
  No glue.</p><h2>What to hand in</h2><ul><li>The kit (≥ 12 parts) and two
  assemblies, photographed</li><li>Source file with the slot parameter
  exposed</li></ul><h2>What you'll practise</h2><ul><li>Design tolerance for a
  friction fit</li><li>Parameterize a slot</li></ul><p>Time: 1 week</p>
