  <p>Design as Tragedy: The Rise and Fall of the Twin Towers (p. 34-45) in
  <em>Design and Truth</em> by Robert Grudin</p>

  <h2>Prompt</h2>

  <p>In this chapter, Grudin talks about how economic tradeoffs and cultural
  appropriation may have contributed to great tragedy. What are other tragedies
  (large or small) related to design that you know of from current or historical
  events?</p>

  <p>How might designers be trained or regulated to avoid causing harm?</p>

  <p>Should designers be held accountable when their work causes trauma or
  destruction?</p>

