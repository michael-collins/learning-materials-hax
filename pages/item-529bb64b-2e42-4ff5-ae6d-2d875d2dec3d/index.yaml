content: >
  <p>In this exercise, you will apply Image textures to a Chess board and
  pieces</p>

  <h2>Learning Objectives</h2>

  <ol>

  <li>Practice rendering images for submissions</li>

  </ol>

  <h2>Instructions</h2>

  <p><strong>For this assignment,&nbsp;you will submit 3 total images.</strong>

  &lt;br&gt;<br>

  Develop and refine a single chess set based on observation over time, peer and
  instructor feedback.

  &lt;br&gt;<br>

  <strong>Submit three renders of <em>this individual</em> set to both
  <em>Canvas</em> <em>and the corresponding discussion thread for
  review</em>.</strong>&nbsp;

  &lt;br&gt;  Make sure that your assignment is titled in the following format:

  <strong>Last name, First name,</strong>&nbsp;the
  word&nbsp;<strong>"Lesson"</strong>&nbsp;followed by the&nbsp;<strong>Lesson
  number,</strong>&nbsp;and the&nbsp;<strong>word
  "Assignment"</strong>&nbsp;followed by the&nbsp;<strong>Assignment
  number.</strong>

  &lt;br&gt;<br>

  <strong>Example:</strong>&nbsp;Brill Ian Lesson x Assignment x</p>

  <h2>Grading Rubric</h2>

