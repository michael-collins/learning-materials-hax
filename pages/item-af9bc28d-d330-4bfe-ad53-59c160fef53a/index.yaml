content: >
  <p>In this exercise, you will practice polygonal modeling fundamentals and
  using reference images to create a chess piece</p>

  <oer-iframe
  src="https://youtube.com/embed/videoseries?list=PLcAjW37cz5QkyyjlPgk2ZmvzQih_Yk8Dx"
  title="Modeling a Pawn Tutorial"></oer-iframe>

  <h2>Learning Objectives</h2>

  <ol>

  <li>Practice working from reference images</li>

  <li>Practice using 3D software interface and terminology.</li>

  <li>Use modeling workflows to create high quality topology and edge flow.</li>

  <li>Familiarize yourself with a cumulative number of hotkeys and operations
  (it's a good idea to keep a personal log of hotkeys and operators that you
  will likely use again, as you go).</li>

  </ol>

  <h2>Instructions</h2>

  <p>Using the two shared reference images, recreate the steps
  in&nbsp;the&nbsp;<strong>Demonstration</strong>&nbsp;and <strong>submit three
  renders to both <em>Canvas</em> <em>and the corresponding discussion thread
  for review</em></strong>.&nbsp;

  <br>

  <br>

  Make sure that your assignment is titled in the following format:

  <strong>Last name, First name,</strong>&nbsp;the
  word&nbsp;<strong>"Lesson"</strong>&nbsp;followed by the&nbsp;<strong>Lesson
  number,</strong>&nbsp;and the&nbsp;<strong>word
  "Assignment"</strong>&nbsp;followed by the&nbsp;<strong>Assignment
  number.</strong>

  <strong>Example:</strong>&nbsp;Brill Ian Lesson x Assignment x</p>

