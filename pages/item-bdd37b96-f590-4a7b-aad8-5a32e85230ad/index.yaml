content: >-
  <p>Each student presents one artist, designer, or studio and one specific work
  made with digital fabrication: how it was made (process, machine, material),
  why that process, and what it argues. Five minutes, three slides, sources on
  the last slide. Sign up for a week that matches the process being
  introduced.</p><h2>What to hand in</h2><ul><li>3-slide presentation with
  sources</li><li>One paragraph added to the shared precedent
  list</li></ul><h2>What you'll practise</h2><ul><li>Read a fabricated work
  technically</li><li>Build the class's shared precedent bank</li></ul><p>Time:
  5 min, rotating weeks 3–13</p>
