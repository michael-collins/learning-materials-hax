content: >
  <p>A proof of ability is a small demonstration of a skill or capability that
  is indicative of your ability to complete a larger work using the same tools
  and techniques. If you struggle to complete a proof of ability for your
  intended project, you may need to rethink the scope of your work, or reduce
  the need for complex technical skills. You can still convey a compelling
  project idea by being resourceful and adaptable in the production approach
  when faced with insurmountable technical obstacles.</p>

  <p>The proof itself depends on the type of project and media being used.
  However, there are standard ways of showing competency in a given craft. For
  specific recommendations for the project proof of ability, see the proof of
  concept sections at the bottom of the <em><strong><a
  href="https://dmd-program.github.io/art-design-course-resources/">project
  categories</a></strong></em> pages.</p>

  <h2>Submission details</h2>

  <p>You will be creating and submitting a <strong>PDF presentation</strong>
  document which can be exported from either MS Word or PowerPoint, or the
  equivalent Google products with the following:</p>

  <ol>

  <li>Include an example of <strong>past work</strong> that is related to your
  project.

  <ul>

  <li>Include a paragraph describing what you have learned since producing this
  work, and/or what you hope to improve upon for the upcoming project.</li>

  </ul>

  </li>

  <li>Include <strong>new work</strong> that is representative of the skills and
  knowledge needed to complete the project.

  <ul>

  <li>Include a paragraph describing what you already feel comfortable
  producing, and what knowledge of skills will need to be acquired to produce
  the capstone project as it is proposed.</li>

  <li>The new work should address the newest, most relevant, least familiar, or
  most difficult aspect of the project to demonstrate that you will be able to
  have success in completing the capstone project.</li>

  <li><strong>Examples:</strong> See <em><strong><a
  href="https://dmd-program.github.io/art-design-course-resources/">project
  categories</a></strong></em> pages <strong>Proof of Concept</strong>
  sections.</li>

  </ul>

  </li>

  <li>Name the document <strong><em>lastname</em>-proof-of-ability.pdf</strong>
  and include images, screenshots, and paragraph descriptions from step 1 and 2
  by the due dates indicated on Canvas.

  <ul>

  <li><strong>Note:</strong> Do not submit a ZIP file with multiple files,
  rather compile your work into a single PDF presentation. You can include a
  screenshot and link to a single video reel compiling the work you wish to show
  if the work is time based, or screenshots and links to multiple videos. If
  your work is interactive, create a screenrecording video to document the
  function of the interaction with accompanying screenshot and link. All links
  should be accompanied by screenshots or images that act as a preview of the
  work.</li>

  </ul>

  </li>

  </ol>
