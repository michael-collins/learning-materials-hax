content: >
  <oer-draft note="Suggested questions, written from the week's objectives.
  Check them, then Publish.">

  <p>Check your understanding of 3D printing. Your answers aren't recorded.</p>

  <multiple-choice question="A printed bracket snaps cleanly along a layer line.
  What is the best design fix?" single-option="" randomize="">
    <input type="checkbox" value="Reorient the print so the load runs along the layers, not across them" data-correct="true">
    <input type="checkbox" value="Print it faster">
    <input type="checkbox" value="Use a smaller nozzle">
    <input type="checkbox" value="Turn supports off">
  </multiple-choice>

  <multiple-choice question="Why does a slicer need a watertight (manifold)
  mesh?" single-option="" randomize="">
    <input type="checkbox" value="It needs a closed surface to tell inside from outside when it computes each layer" data-correct="true">
    <input type="checkbox" value="Open meshes print too fast">
    <input type="checkbox" value="Watertight meshes never need supports">
    <input type="checkbox" value="STL files can't store open meshes">
  </multiple-choice>

  <true-false-question question="In FDM printing, overhangs steeper than about
  45 degrees from vertical usually need support.">
    <input type="checkbox" value="True" data-correct="true">
    <input type="checkbox" value="False">
  </true-false-question>

  <self-check title="Think it through">
    <p slot="question">Two printed parts should slide together. Why can't you model them at exactly the same size?</p>
    <p>Printed parts come out slightly larger or smaller than the model, and layer lines add roughness, so a fit needs clearance. Find the right gap for your printer and material with a small test print before printing the real parts.</p>
  </self-check>

  </oer-draft>
