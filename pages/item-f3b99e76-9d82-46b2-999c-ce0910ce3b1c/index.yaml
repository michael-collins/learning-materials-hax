content: >-

  <p>This series follows the Modeling and Texturing the Airline Chair series:
  with Kem Weber's chair modeled and textured, you'll light it and make a
  finished render. You'll build a curved studio backdrop, light the chair with a
  key light, a fill light and a rim light, and render it in Cycles, balancing
  the sampling level against noise and render time. Then you'll soften the
  shadows, add a sun, and give the leather roughness and normal maps so it
  catches the light like real leather. The last part sets the camera's focal
  length and composition, renders the chair on a transparent background with a
  shadow catcher, and finishes the image in Photoshop with a background and a
  boost in saturation.</p>

  <p>You'll need your textured Airline Chair, the reference photos of the chair,
  Blender, and Photoshop or another image editor with layers. The videos use
  Blender 2.83 and Photoshop 2020, so some menus and settings look different in
  newer versions.</p>

