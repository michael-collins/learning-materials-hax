  <p>Face to Face with Design (p. 62-82) in Design and Truth by Robert
  Grudin</p>

  <h2>Writing prompt</h2>

  <p>In this chapter, Grudin talks about fixing and designing material objects
  which had some meaning in his life. Now think of a time that you designed or
  fixed something when you had a meaningful connection with. Describe the
  specific design choices you made and what they reveal about you and the
  experience. What specifically created a strong connection with this object or
  subject?</p>

  <h2>Writing guidelines</h2>

  <ol>

  <li>Length: (150-300 words)</li>

  <li>Reference the chapter content whenever possible</li>

  <li>Cite sources where applicable.</li>

  <li>Check for spelling and grammar.</li>

  <li>Avoid generalizing language. Choose clear and concise wording.</li>

  </ol>

