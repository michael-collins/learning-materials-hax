  <h3>Artist Statements</h3>

  <p>The Work Statement is specifically about this project, but artist
  statements are a helpful analog. These are short, pithy statements that
  summarize an artist's entire body of work. Good ones minimize "artspeak"
  (above) in favor of intimate and provocative accompaniments to their work.</p>

  <ul>

  <li><a
  href="https://thecreativeindependent.com/guides/how-to-write-an-artist-statement/">How
  to Write an Artist Statement</a></li>

  <li><a href="https://www.gyst-ink.com/sample-artist-statements">Sample Artist
  Statements</a></li>

  <li><a
  href="https://www.theartleague.org/blog/2015/08/24/8-artist-statements-we-love/">Artist
  Statements We Love</a></li>

  </ul>

