  <h2>AI-Assisted Revision</h2>

  <p>As you explore the use of AI in design, it's worth seeing how AI can help
  us with writing too.</p>

  <p>Algorithms are not very interesting; they don't know what you know, and
  they don't care about anything. But they are really good at regurgitating the
  writing style of other people into a sort of average result. And you can
  iterate and guide an AI to give you more interesting results, possibly editing
  its suggestions into your own writing. This can be help align your writing
  with the conventions and language of a particular industry.</p>

  <p>For one draft of your Work Statement, you should use an AI assistant to
  revise the text or generate feedback.</p>

  <p>Use one of the AI resources listed under the Text section of the <a
  href="/projects/dmd300-design-project-2-project-2-project-description">Resources
  page</a>.</p>

  <p>You can paste your entire statement into one of the tools, and say
  something like:</p>

  <ul>

  <li>"Give me feedback on this design statement, considering writing style,
  clarity of ideas, and professional context."</li>

  <li>"Rewrite the following text in the style of a UX case study."</li>

  </ul>

  <p>Or you can start from scratch to see what it generates; this will produce
  something super generic and lacking important details about <em>your</em>
  work, but the language and structure may be useful reference:</p>

  <ul>

  <li>"Write an artist statement for someone who makes digital photo-collages of
  body parts."</li>

  </ul>

  <p>👉 <strong>Remember:</strong> You are the primary author! Your voice and
  ideas are paramount, and the AI is here as your editor. You shouldn't submit
  the AI-generated text without editing it somewhat yourself, or integrating its
  suggestions into your original draft.</p>

  <h2>Submission details:</h2>

  <ul>

  <li>Upload the work statement as an MS Word Document to Canvas as indicated
  deadlines.</li>

  <li>For the AI-Assisted Draft:

  <ul>

  <li>Identify which AI program you used</li>

  <li>Include your prompts</li>

  <li>Include a brief reflection on the use of AI, such as describing its
  strengths and weaknesses, or what percentage of the writing is yours vs. the
  AI's.</li>

  </ul>

  </li>

  </ul>
