content: >
  <p>Develop a 150–500 word work statement that thoughtfully employs relevant
  and critical art and design language. This statement should be developed with
  feedback from your instructor to adjust tone, terminology, and structure. You
  will use MS Word tracked changes to refine and edit the statement over the
  duration of the project.</p>

  <p>The statement's use of language should seek a balance of accurate technical
  terminology, concise statements about the work, and language that is
  accessible to a diverse audience and is wholly descriptive. It is easy for
  artists and designers to adopt opaque language when attempting to describe
  abstract works. Developing playful language can be a fun exercise, but has the
  tendency to confuse or shut out those with-out a strong grasp of obscure and
  creatively applied vocabulary. There are really no rules with how language is
  used, but ultimately the goal in a work statement is that the artist or
  designer can clearly communicate their ideas, processes, and outcomes to a
  wide audience.</p>

  <p>👉 Write your statement in the <strong>past tense</strong>, as if the
  project is complete. Imagine it as the plaque on the museum wall or a
  published portfolio blurb.</p>

  <h2>Structure of the work statement</h2>

  <p>Please write the statement using proper grammar, sentence structure, and
  with complete paragraphs. Do not include the requirements as sections, the
  writing should flow as a single description of your project.</p>

  <ol>

  <li>Include your name, project title, semester and year (IE – Fall 2022).</li>

  <li>Explain what the project is and how it works.

  <ul>

  <li>E.g. "This project is an online game for children that teaches players
  living in war-torn countries how to avoid landmines."</li>

  </ul>

  </li>

  <li>Describe the type of media used and why that choice is effective or
  interesting.</li>

  <li>Describe the design challenge that your work addresses (the provocation,
  or existing problem you hope to tackle). Do not write about challenges <em>you
  personally had</em> in producing the work.</li>

  <li>Describe the process or how you approached solving for the design
  challenge.</li>

  <li>Describe the impact the work might have, the context in which it sits, why
  it's interesting, etc.</li>

  </ol>

