content: >
  <p><img src="files/dd-process-develop-1200px@2x.png" alt="Double Diamond
  Develop Phase graphic"></p>

  <p>Now that you have described the various aspects of the ritual, you will
  create interactive wireframes for a mobile app.</p>

  <p><strong>The app should aid in the performance of your ritual</strong>. The
  app does not need to solve your subject's problems all by itself; it should
  act as a guide, instructional manual, supplemental tool, or other component of
  the ritual. The ritual can involve physical actions that take place outside of
  the app, in the real world, with other people, or in the user's mind.</p>

  <p>Wireframes are informal sketches that help designers test their ideas so
  they can quickly iterate the design and gather feedback.</p>

  <p>This process is important because it helps product designers make decisions
  before wasting resources on a final product that solves the wrong problem.
  Your wireframes should <em>not</em> include aesthetic decoration, complex
  color palettes, or final typography — those concerns of visual design would
  happen in the next phase of an app’s development, a high-fidelity mockup that
  finalizes the exact appearance before being given to developers to code the
  actual app.</p>

  <p>You will create simple app screens using paper templates or simple digital
  designs. The sequence or collection of screen designs will then be placed into
  a digital tool to make them interactive — letting us click buttons and
  interact with the prototype as if it were a real app. The purpose of these
  wireframes is to quickly communicate to your peers how you intend to use a
  mobile device application to facilitate, generate, or expand upon a
  ritual.</p>

  <h2>Tools and Materials</h2>

  <ol>

  <li>Pen or marker</li>

  <li>Assorted paper</li>

  <li>Scissors</li>

  <li>Ruler</li>

  <li>Cellphone Camera</li>

  <li><a href="https://www.figma.com/education/">Figma Education account</a>
  (free)</li>

  <li>Paper Prototyping PDF:&nbsp;<a
  href="https://media.aanda.psu.edu/sites/media/aa/files/documents/ritual-project-appprototyping.pdf">PDF
  Download</a></li>

  </ol>

  <h2>Technical resources</h2>

  <h3>Cropping images</h3>

  <p>You will be able to crop and adjust the color of your images in Figma
  (which you’ll use anyway for assembling your prototype), but you may wish to
  prepare your images beforehand. Here are some quick tutorials for cropping
  images.</p>

  <ul>

  <li><a
  href="http://www.tech-recipes.com/rx/56624/how-to-rotate-crop-photos-in-windows-10/">Windows</a></li>

  <li><a
  href="https://support.apple.com/guide/preview/crop-resize-or-rotate-an-image-prvw2015/mac">Mac
  OS</a></li>

  </ul>

  <p>💁&nbsp;Figma tutorials are provided on the next page.</p>

  <h2>Instructions</h2>

  <h3>A. Creating wireframes</h3>

  <ol>

  <li>In your journal, you can list the parts of the storyboard that can
  translate into mobile application functions. For instance, if the ritual has a
  timer component, you can make a note that you'll need a visual (or audio) cue
  for the timer.</li>

  <li>Look at wireframing inspiration:

  <ol>

  <li><a
  href="https://support.apple.com/guide/preview/crop-resize-or-rotate-an-image-prvw2015/mac">Gallery
  of sketched wireframe images</a></li>

  <li><a href="https://pageflows.com/">PageFlows</a> (documentation of real app
  interaction flows)</li>

  <li><a href="https://laudableapps.com/">Laudable Apps</a> (curated iOS app
  images)</li>

  <li><a href="https://dribbble.com/">Dribbble</a> (search for “wireframe” or
  “mobile app”)</li>

  </ol>

  </li>

  <li>Create the app's interface screens using either of the following options:

  <ol>

  <li>Method 1: Paper

  <ol>

  <li>If you prefer to use pencil and paper, you can either draw the wireframes
  or download and print the Paper Prototyping PDF.</li>

  <li>Draw and cut out interface elements including buttons, images, icons,
  navigation, text, and other elements needed to prototype your app
  interface.</li>

  <li>Cut out reusable interface elements so they can be rearranged for each
  application screen.</li>

  <li>Arrange the components for each screen and take a picture with your
  phone's camera.</li>

  </ol>

  </li>

  <li>Method 2: Digital designs

  <ol>

  <li>Alternatively, you may create your screen designs digitally. Since the
  visual design is not complex, you could use any number of apps for this, but
  since we’ll be using Figma to add interactivity to the screens, I recommend
  simply using that, as Figma is a popular and capable UI design tool. Guidance
  on this will be provided on the next page.</li>

  <li>Note that digital designs should be mostly or entirely grayscale. They are
  still wireframes and should not feature aesthetic decoration.</li>

  </ol>

  </li>

  </ol>

  </li>

  <li>Crop any photographs to the crop marks.</li>

  </ol>

  <h3>B. Making an interactive prototype</h3>

  <p>Once you have your screen images prepared, download them onto your computer
  in a dedicated folder. Backup to cloud storage for extra security, such as
  your <a href="https://office365.psu.edu/">PSU OneDrive storage.</a></p>

  <p>👉&nbsp;<strong>Continue to the next page</strong> for guidance on using
  Figma to make your images interactive.</p>

  <h2>Submissions</h2>

  <h3>Prototype Description</h3>

  <ul>

  <li>Start your description with the following: "<strong>This is a prototype
  for an app that...</strong>" To complete the sentence, synthesize your
  brainstorming and storyboard ideas.</li>

  <li>Describe the ritual in detail and how the prototype app is intended to
  work. How does it support the ritual?</li>

  <li>Write clearly, and check for grammar and spelling&nbsp;<a
  href="https://dmd-program.github.io/dmd-100-master/GLOSSARY.html#errors">errors</a>.</li>

  </ul>

  <h3>Instructions</h3>

  <ol>

  <li>Create interactive wireframes using the prototyping instructions on the
  next page.</li>

  <li>Open the Presentation View of your app and click Share to get a public
  sharable link. Do not use the share-link for your main design file.</li>

  <li>Write a prototype description according to the requirements and include
  your public share link. (Check the link in a private-browsing window to ensure
  it works for other people.)</li>

  </ol>
