content: >-

  <p>An animated texture is an image sequence that plays on the surface of a
  model. In these two parts you'll model an old TV set on a table in Blender,
  then put a three-second, 72-frame animation on its screen and make the screen
  glow and light the room. You'll render the scene from Blender's EEVEE as an
  image sequence, set it to 24 frames per second in After Effects with Interpret
  Footage, and export an H.264 MP4 with Media Encoder's Vimeo preset.</p>

  <p>You'll need Blender, After Effects and Media Encoder. The image sequence
  for the screen is available to download, so you don't have to make your own in
  After Effects.</p>

