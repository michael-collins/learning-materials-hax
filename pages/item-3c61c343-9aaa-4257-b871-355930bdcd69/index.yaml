content: >
  <oer-draft note="Week 3 from the DART 413 course plan. Revise it, then Publish
  to show it to readers.">

  <p>Getting 3D from 2D sheets: stacked sections, waffle/egg-crate, slotted
  assemblies, press-fit, living hinges, scoring and folding.</p>

  <h2>Ideas</h2>

  <p>Sectioning, contouring, folding, tessellating (Iwamoto); tolerance and fit;
  friction fit vs. adhesives; material thickness as a design parameter; the
  parametric slot.</p>

  <h2>In class</h2>

  <ul><li>Lecture (30)</li><li>tolerance test kit demo (20)</li><li>press-fit
  exercise work session (90)</li></ul>

