content: >
  <p>As you develop your independent project, this essay will serve as an
  opportunity to discover relevant practitioners and creative work that can
  inform your own project. Researching, organizing your thoughts, and
  articulating them in writing are absolutely essential skills for any
  designer.</p>

  <p>Of a group of applicants for a job or project, the best writer will have a
  serious advantage. Plus spending time thinking critically about your work and
  life is always valuable to do.</p>

  <h2>Prompt</h2>

  <h3>The title of your essay should be a question</h3>

  <p>What questions do you have about the ideas, feasibility, or historical
  context of your own work? What unexpected connections can you make? What is
  missing? What is confusing? The title of your essay should end in a question
  mark and should seek to discover a specific answer (or possible answers) to
  this question or explore its context.</p>

  <h3>Analyze a specific work by an artist, designer, filmmaker, or studio</h3>

  <p>Incorporate a focused discussion of one creative work or project into your
  essay. This should somehow relate to your project, research topics, and/or the
  media you are interested in. Resources for discovering interesting work can be
  found at the bottom of this page.</p>

  <ul>

  <li>You are encouraged to look for new, obscure, historical, or otherwise
  thought-provoking creators — not just mainstream pop culture.</li>

  <li><strong>Include a thorough and detailed description of the work's
  design</strong>&nbsp;— Assume your reader has not seen the work before.
  Describe formal qualities such as, colors, shapes, movement, structure, and so
  on. Use descriptive adjectives to help the reader picture the work.</li>

  <li><strong>Include the work title, date, medium, and location (as
  relevant)</strong></li>

  <li>Describe pertinent historical context for the work.</li>

  <li>Include credible scholarly sources to support claims and information.</li>

  </ul>

  <h3>Include 1–2 related works</h3>

  <p>These secondary works should not be a primary focus of the essay, but can
  offer additional context or comparisons to the primary work under discussion.
  These could be contemporary works by peers or historical precedents; they
  could be similar or antithetical (in opposition to) to the primary work.</p>

  <h3>Not sure where to begin?</h3>

  <ol>

  <li>You could start with an artist or designer, and pose a question that
  intrigues you about their work, or suggests a possible connection to your
  project.</li>

  <li>Consider the historical precedents or themes of your current or past
  projects, and find writing and creative work that lies in a similar
  orbit.</li>

  <li>This writing should be though of as art or design criticism (a critical
  and reasoned examination of a cultural object). Consider your unique
  point-of-view and identity; choose a subject that you are passionate
  about.</li>

  <li>Imagine someone else was writing a serious essay about your work, what
  connections or questions would they include?</li>

  <li>Use a chatbot like ChatGPT to think through your ideas or discover
  practitioners or writing related to your investigation. You can even tell it
  to <em>ask you questions</em>, if you're feeling stuck, to provoke
  introspection or curiosity.</li>

  </ol>

  <h2>Visual Outline</h2>

  <p>To begin this project, create a virtual whiteboard using <a
  href="https://www.figma.com/figjam/">FigJam</a>, <a
  href="https://miro.com/?adgroupid=140324301065&amp;matchtype=e&amp;device=c&amp;location=9052639&amp;gad_source=1">Miro</a>,
  <a href="https://www.mural.co/">Mural</a>, or something comparable.</p>

  <p>Use this as a brain-storming and note-taking hub for your project, similar
  to the beginning of Project 1 in this class.</p>

  <ul>

  <li>Brainstorm possible “topic questions” for the essay.</li>

  <li>List possible artists or designers and their specific works.</li>

  <li>Add images, links, and quotes to collect resources for the essay.</li>

  </ul>

  <p>FigJam includes a <a
  href="https://help.figma.com/hc/en-us/articles/18917944627095-Create-mindmaps-in-FigJam">Mind
  map</a> feature that is very helpful in exploring related ideas from a central
  topic and generating possible research topics.</p>

  <p>As you collect ideas and resources, begin to <strong>organize them into
  essay sections</strong>. Use text headings and spatial organization to
  indicate the “story” you will tell in the essay. For example, you might have
  sections like “Introduction” or “Historical influences” and list what you will
  write about in each section (much like a written outline and bibliography, but
  with pictures).</p>

  <p>Search for articles and ebooks at the&nbsp;<a
  href="https://libraries.psu.edu/">Penn State Library</a>&nbsp;or&nbsp;<a
  href="https://scholar.google.com/">Google Scholar</a></p>

  <p>📥&nbsp;<strong>Submission:</strong> The Visual Outline will be due as a
  preliminary assignment ahead of the main essay.</p>

  <h2>Writing the essay</h2>

  <p>Your essay should include discrete paragraphs that give structure to your
  writing, including an introduction and conclusion. This essay is a substantial
  part of the class and should demonstrate college-level writing and your
  ability to research appropriate sources.</p>

  <p>See syllabus for your instructor’s policy on the use of generative AI.</p>

  <h3>Requirements</h3>

  <ul>

  <li>800–1200 words</li>

  <li>Bibliography including 3 or more professional sources (Chicago, APA, or
  MLA format)</li>

  <li><a
  href="https://www.scribbr.com/citing-sources/parenthetical-citation/">Parenthetical</a>
  or <a href="https://www.scribbr.com/chicago-style/footnotes/">footnote</a>
  citations in the body of your essay to support facts and cite quotes.</li>

  </ul>

  <p>📥&nbsp;<strong>Submission:</strong> DOC or DOCX file</p>

  <h2>Rubric</h2>

  <ul>

  <li>Meets requirements: 10%</li>

  <li>Topic question: 10%

  <ul>

  <li>Is the title question specific, relevant, and worthwhile? Does the author
  answer the question?</li>

  </ul>

  </li>

  <li>Relevance to Independent Project: 10%

  <ul>

  <li>Is the essay relevant to the author’s own work?</li>

  </ul>

  </li>

  <li>Writing ability: 30%

  <ul>

  <li>Is the writing free of typos and confusing sentences?</li>

  <li>Does the author use <a
  href="https://learn.leighcotnoir.com/artspeak/art-vocabulary/">vocabulary</a>
  and concepts appropriate to their professional field?</li>

  </ul>

  </li>

  <li>Critical depth: 40%

  <ul>

  <li>Does the author analyze the meaning, design, or form of the work in a
  thoughtful way? Do they grapple with related issues in art, culture,
  technology, and/or economics?</li>

  </ul>

  </li>

  </ul>

  <h2>Resources for Discovering Artists and Designers</h2>

  <ul>

  <li><a href="https://www.fastcompany.com/co-design">Fast Company</a>: An
  essential design publication; features mainstream design and weird creative
  stuff.</li>

  <li><a href="https://we-make-money-not-art.com/">We Make Money Not Art</a>: A
  quirky blog of new media art; search for keywords to browse years of
  material.</li>

  <li><a href="https://dribbble.com/">Dribble</a>: A social media platform for
  designers (mostly UI and graphic design)</li>

  <li><a href="https://www.creativebloq.com/">Creative Bloqq</a>: A very pop-y
  blog of creative tech stuff.</li>

  <li><a href="https://www.surfacemag.com/">Surface Magazine</a>: A high-brow
  publication on "architecture, art, design, fashion, and travel."</li>

  <li><a href="https://99percentinvisible.org/">99% Invisible</a>: Every
  designer's favorite podcast; browse years of stories on design of all
  kinds.</li>

  <li><a href="https://www.netflix.com/title/80057883">Abstract</a>: The Art of
  Design: A Netflix series about innovative designers.</li>

  <li><a href="https://art21.org/">Art21</a>: A great video series on artists of
  all kinds.</li>

  <li><a href="https://www.ted.com/talks">TED Talks</a>: You know what they are;
  search for designers, artists, and practioners.</li>

  <li>ChatGPT: Ask an AI chatbot for “examples of contemporary artists working
  with 3D modeling” or “graphic designers who use hand-drawn elements.” (Look
  them up on your own afterwards, but this is a great way to discover new work
  and writing.)</li>

  <li><strong>The world around you</strong>: look through your books, albums,
  video games, or other design work that you love and find out who made it.</li>

  </ul>
