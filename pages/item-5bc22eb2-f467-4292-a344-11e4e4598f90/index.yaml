content: >
  <p>Now that you have documented at least one object each day for two weeks,
  it's time to talk about it, shown-and-tell style.</p>

  <h2>Prompt</h2>

  <ol>

  <li>From the 14 objects that you sketched, which are your favorite objects?
  Why?</li>

  <li>Select one object from your list. What role does this object play in your
  life? What would be the result if you did not have it anymore?</li>

  <li>Do you generally take these objects for granted or are they special?</li>

  </ol>

  <h2>Instructions</h2>

  <ol>

  <li>Respond to the prompt questions in Canvas.</li>

  <li>Upload all 14 of your sketches in JPG format.

  <ul>

  <li><strong>Please either use a scanner or take clear and well lit
  photographs.</strong></li>

  </ul>

  </li>

  <li>Write your responses to the prompt questions at the end of the two
  weeks.</li>

  </ol>
