content: >
  <p>Produce a <em><strong>short</strong></em> video presentation that documents
  and explains the project process and outcomes for a general audience
  unfamiliar with the work (~2-3 minutes).</p>

  <h2>Example of excellent explainer videos</h2>

  <ul>

  <li><a href="https://www.youtube.com/watch?v=8qZdaVe8h2U">A world of our own
  by Grace Brown</a></li>

  </ul>

  <h2>Structuring the presentation</h2>

  <p>There are different approaches to documentation video. A typical
  documentation video consists of the following:</p>

  <ol>

  <li>Project title and name screen</li>

  <li><strong>Concept:</strong> Short overview statement, typically white, bold
  text on a black background. Ensure that it is visible on screen long enough to
  be read by the viewer.</li>

  <li><strong>Research:</strong> Photographs, images or video clips showing the
  research or key aspects that you developed to make the project
  successful.</li>

  <li><strong>Production process:</strong> Photographs, images or video clips
  showing the production of the project at various stages of development. You
  can photograph yourself or others participating in the experience or show
  relevant digital images that give the audience context of your narration.

  <ul>

  <li>Figure out the best way to communicate the things you are making. This can
  be screen captured videos or images, photographs of in-progress work,
  diagrams, etc.</li>

  </ul>

  </li>

  <li><strong>Project outcomes:</strong> Include any of the following — Results
  of the project, insights, lessons learned, and plans for the future.</li>

  </ol>

  <p>You can overlay text on top of the images and video to describe the
  project's development and outcomes along with voice narration to describe the
  project. Do not leave the images and video up to interpretation.</p>

  <h2>Creating and exporting the video (recommended)</h2>

  <ol>

  <li>Create a presentation folder on your computer and save everything to this
  folder.</li>

  <li>Create a PowerPoint or Google Slides presentation in widescreen aspect
  ratio</li>

  <li>Export the slides as images</li>

  <li>Record a voice narration for each slide (quicktime recording recommended)
  (should be about 1-3 minutes of audio)

  <ul>

  <li><strong>Note:</strong> Do NOT put a soundtrack or music behind the voice
  narration.</li>

  </ul>

  </li>

  <li>Import the images and audio into premiere pro or aftereffects</li>

  <li>Edit and export using H.264 format. This should be a small file size.</li>

  </ol>

  <h2>Additional software tutorials</h2>

