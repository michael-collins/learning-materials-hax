  <h3>Exporting Your Video</h3>

  <p>Videos should be exported as a <code>.mp4</code> file with an h.264 codec.
  This is most common format for distributing videos on the web.</p>

  <p>1920px x 1080px is standard HD video size, so that's a great target to make
  your video, but if you have a conceptual or technical reason you need to size
  your video differently, other sizes may be acceptable.</p>

  <ul>

  <li><a
  href="https://www.evscicats.com/tutorials/export-mp4-video-for-youtube-vimeo/">How
  to export in H.264 format with Adobe Premiere</a></li>

  </ul>

  <p>Videos should be smaller than 500MB. To decrease your file size, you can
  try the following:</p>

  <ul>

  <li>Ensure you are using the h.264 codec when exporting. Use the share feature
  in quicktime to export a large video.</li>

  <li>Decrease your video's bitrate in the export settings (for reference check
  out the <a
  href="https://support.google.com/youtube/answer/1722171?hl=en">recommended
  bitrate settings</a> for YouTube). Bitrate is basically how much detail goes
  into each frame of your video.</li>

  <li>If you aren't happy with the results from that you can always decrease the
  overall size of your video to 1280px by 720px or something similar.</li>

  </ul>

  <h2>Submission details</h2>

  <p>Submit this video as part of the documentation step.</p>
