content: >
  <oer-pathway layout="matrix"></oer-pathway>

  <p>This pathway is designed for aspiring animation and VFX artists who want to
  create high-quality animated short films with professional-grade visual
  effects. Students will progress from foundational CGI skills through advanced
  animation and simulation techniques, culminating in the ability to produce
  complete animated narratives with integrated VFX elements.</p>

  <h2>Who This Is For</h2>

  <p>This pathway is ideal for students aiming to work in:</p>

  <ul>

  <li>Animation studios</li>

  <li>VFX houses</li>

  <li>Film production companies</li>

  <li>Independent animation projects</li>

  <li>Post-production facilities</li>

  </ul>

  <h2>Career Outcomes</h2>

  <p>Graduates will be prepared for roles including:</p>

  <ul>

  <li>Character Animator</li>

  <li>VFX Artist</li>

  <li>Compositor</li>

  <li>Technical Director</li>

  <li>Animation Generalist</li>

  </ul>
