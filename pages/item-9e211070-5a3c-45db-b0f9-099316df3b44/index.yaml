content: >-
  <p>The Airline Chair has two identical sides, with the seat cushions between
  them. Instead of modeling the second side, you'll mirror the side, the brace
  and the brackets across the chair's center line with <em>Mirror</em>
  modifiers. For a mirror to land in the right place, each object's origin has
  to be on the center line, and its rotation and scale have to be applied.
  You'll need the side, brace and brackets from Parts 2 and 3. The video uses
  Blender 2.83.</p>


  <oer-video id="video-r5iSQNviDJg"
  src="https://www.youtube.com/watch?v=r5iSQNviDJg" title="Modeling the Airline
  Chair – Part 4: Mirroring" credit="Michael Collins"
  credit-url="https://www.youtube.com/channel/UCp1cLW7rry_NKRhcH8bPfGg"></oer-video>


  <h2>Mirror the side</h2>

  <ol>
    <li>
      <p><strong>Move the side out from the center.</strong> <page-anchor target="#video-r5iSQNviDJg" value="0">0:00</page-anchor> The reference shows two cushions, one for the back and one for the seat, between the sides. Move the side roughly to where it should be, to one side of the Y axis <page-anchor target="#video-r5iSQNviDJg" value="15">0:15</page-anchor>. Imagine the Y axis as the chair's center: mirrored, the other side will be exactly the same distance away on the other side of it.</p>
    </li>
    <li>
      <p><strong>Snap the origin onto the center line.</strong> <page-anchor target="#video-r5iSQNviDJg" value="30">0:30</page-anchor> The mirror happens around the object's origin, so the origin has to be on that axis. Open <em>Options</em> in the header and tick <em>Origins</em> under <em>Affect Only</em>, as in Part 3. Turn on snapping, set it to <em>Increment</em> and tick <em>Absolute Grid Snap</em> <page-anchor target="#video-r5iSQNviDJg" value="50">0:50</page-anchor>. Now move the origin along X: it snaps to the grid, onto the center line. Then untick <em>Origins</em> <page-anchor target="#video-r5iSQNviDJg" value="58">0:58</page-anchor>.</p>
      <figure><img src="files/mirroring-the-side-t0050.7.jpg" alt="The snapping menu open in the header with Snap to set to Increment and the Absolute Grid Snap checkbox ticked. Below it, the side piece stands in the 3D view with its origin and move gizmo beside it."><figcaption><p>Snapping set to Increment, with Absolute Grid Snap.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Add a Mirror modifier.</strong> <page-anchor target="#video-r5iSQNviDJg" value="60">1:00</page-anchor> In the <em>Modifier Properties</em>, choose <em>Add Modifier → Mirror</em>.</p>
      <figure><img src="files/mirroring-the-side-t0068.0.jpg" alt="The Add Modifier menu open in the Properties editor, in four columns: Modify, Generate, Deform and Simulate. Mirror is highlighted in the Generate column. The side piece is selected in the viewport."><figcaption><p>Add Modifier → Mirror, in the Generate column.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Fix the axis by applying the rotation.</strong> <page-anchor target="#video-r5iSQNviDJg" value="68">1:08</page-anchor> At first it mirrors in the wrong direction: on <em>X</em>, the copy folds back onto the side. <em>Y</em> doesn't work either, and it's <em>Z</em> that puts the copy beside it <page-anchor target="#video-r5iSQNviDJg" value="82">1:22</page-anchor>. That's because the side started as a plane rotated 90 degrees in Part 2, so its own axes don't match the world's.</p>
      <figure><img src="files/mirroring-the-side-t0075.4.jpg" alt="The side piece with its Mirror modifier set to the Y axis: the copy is folded onto the side itself, making a closed loop, instead of standing beside it. The Mirror modifier's Axis has only Y ticked."><figcaption><p>Mirrored on the wrong axis: the copy folds back onto the side.</p></figcaption></figure>
      <p>Press <kbd>Ctrl</kbd>+<kbd>A</kbd> and choose <em>Rotation</em> <page-anchor target="#video-r5iSQNviDJg" value="88">1:28</page-anchor>. Before, the sidebar shows the rotation as 90 degrees; after, it's 0. Applying it doesn't turn the object back: it treats its current rotation as its original one. Now mirroring on <em>X</em>, which is what you want, puts the copy in the right place <page-anchor target="#video-r5iSQNviDJg" value="108">1:48</page-anchor>.</p>
      <figure><img src="files/mirroring-the-side-t0092.8.jpg" alt="The Apply menu (Ctrl+A) open in the 3D view, with Rotation highlighted among Location, Rotation, Scale, All Transforms and Rotation &amp; Scale. The Mirror modifier is in the stack on the right."><figcaption><p><kbd>Ctrl</kbd>+<kbd>A</kbd> → Rotation.</p></figcaption></figure>
      <figure><img src="files/mirroring-the-side-t0112.8.jpg" alt="Two mirrored side pieces facing each other across the center of the scene, with the brace on one of them. The sidebar shows the side's rotation as 0, 0, 0, and the Mirror modifier's Axis has X ticked."><figcaption><p>After applying the rotation, the mirror on X makes the other side.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Mirror the brace</h2>

  <ol>
    <li>
      <p><strong>Apply the rotation and scale.</strong> <page-anchor target="#video-r5iSQNviDJg" value="118">1:58</page-anchor> Do the same for the other pieces: press <kbd>Ctrl</kbd>+<kbd>A</kbd> and choose <em>Rotation &amp; Scale</em>, which also sets the scale back to 1. On a bracket it won't work: it's a multi-user object, an instance made with <kbd>Alt</kbd>+<kbd>D</kbd> <page-anchor target="#video-r5iSQNviDJg" value="132">2:12</page-anchor>. To reset its scale, delete the copy, apply it on the original, then make the copy again with <kbd>Alt</kbd>+<kbd>D</kbd>, move it along <kbd>X</kbd> and put it in place <page-anchor target="#video-r5iSQNviDJg" value="142">2:22</page-anchor>. It doesn't have to be perfect.</p>
      <figure><img src="files/mirroring-the-side-t0142.4.jpg" alt="The bracket selected on the end of the brace, with scale X 0.015, Y 0.129, Z 0.129 in the sidebar. The status bar shows a red warning: Cannot apply to a multi user: Object Cube.002, Mesh Cube.002, aborting."><figcaption><p>An instance can't have its scale applied.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Snap the brace's origin to the center.</strong> <page-anchor target="#video-r5iSQNviDJg" value="168">2:48</page-anchor> The brace's origin needs to be on the center line too. Turn on snapping and move the brace so its origin snaps to the center. The brace itself is now in the wrong place, so press <kbd>Tab</kbd>, turn on X-ray so you get all its vertices, and move its geometry back into place, here in the <em>Front Orthographic</em> view <page-anchor target="#video-r5iSQNviDJg" value="181">3:01</page-anchor>. Moving geometry in Edit Mode doesn't move the origin: it stays where it is <page-anchor target="#video-r5iSQNviDJg" value="203">3:23</page-anchor>. It's a different route from the side's, but it does the same thing.</p>
      <figure><img src="files/mirroring-the-side-t0210.8.jpg" alt="Front Orthographic view in Edit Mode on the brace, named Cube: all its geometry is selected, in orange, and being moved over the side piece, which runs down the view. The header reads D: -0.02313 m global."><figcaption><p>Moving the brace's geometry back, with its origin left on the center line.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Add the Mirror modifier.</strong> <page-anchor target="#video-r5iSQNviDJg" value="229">3:49</page-anchor> Add a <em>Mirror</em> modifier to the brace: <em>X</em> is already ticked, and the copy appears in the right place.</p>
      <figure><img src="files/mirroring-the-side-t0245.0.jpg" alt="Both side pieces in the 3D view, each with a brace running along it: the brace's Mirror modifier, with X ticked, has made the second one."><figcaption><p>The brace mirrored onto the other side.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Mirror the brackets</h2>

  <ol>
    <li>
      <p><strong>Don't use instances for the brackets.</strong> <page-anchor target="#video-r5iSQNviDJg" value="250">4:10</page-anchor> The brackets are different: each needs its own origin on the center line, so they can't be instances sharing one mesh. Work on one bracket first: move it into position, scaling it a little if it needs it <page-anchor target="#video-r5iSQNviDJg" value="271">4:31</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Center its origin and mirror it.</strong> <page-anchor target="#video-r5iSQNviDJg" value="301">5:01</page-anchor> Move the bracket's origin onto the center line with snapping, as before. There are other ways: for example, you could snap the origin to the 3D cursor, which is already in the middle of the scene <page-anchor target="#video-r5iSQNviDJg" value="310">5:10</page-anchor>. Any way that gets the origin there is fine. Then add a <em>Mirror</em> modifier <page-anchor target="#video-r5iSQNviDJg" value="328">5:28</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Duplicate it for the other bracket.</strong> <page-anchor target="#video-r5iSQNviDJg" value="338">5:38</page-anchor> Press <kbd>Shift</kbd>+<kbd>D</kbd> to duplicate it (a full copy, not an instance). If you press <kbd>Esc</kbd> while moving it, the copy isn't undone: it stays where it was, on top of the original. Be careful not to make extra copies like this without noticing <page-anchor target="#video-r5iSQNviDJg" value="352">5:52</page-anchor>. Move the copy to the other side of the brace, then fix its origin with snapping <page-anchor target="#video-r5iSQNviDJg" value="384">6:24</page-anchor>. It's a copy of an object that already had the modifier, so it's mirrored already.</p>
    </li>
  </ol>


  <h2>Wrap-up</h2>

  <figure><img src="files/mirroring-the-side-t0400.0.jpg" alt="The chair's frame
  in the 3D view: two side pieces facing each other, each with its brace and
  brackets. A Cmd+S key press shows at the bottom, and the status bar confirms
  the file was saved."><figcaption><p>Both sides of the chair, mirrored. Save
  your file.</p></figcaption></figure>

  <p>You've used Mirror modifiers to make the other side of the chair. Each
  mirror works around its object's origin and axes, so put the origin on the
  center line (with snapping, Affect Only Origins or the 3D cursor) and apply
  rotation and scale first; instances share one mesh and can't be applied or
  given separate origins. Save your file <page-anchor
  target="#video-r5iSQNviDJg" value="391">6:31</page-anchor>. Next you'll start
  on the cushions, from a cube.</p>

