  <h2>Uploading to the exhibition</h2>

  <p><strong>Selected DMD exhibition project examples:</strong></p>

  <ul>

  <li><a
  href="https://dmd.psu.edu/exhibition-19fa-dmd400/projects/cerka-carolyne/">UX/UI
  example from Fall 2019</a></li>

  <li><a
  href="https://dmd.psu.edu/exhibition-20fa-dmd400/projects/grill-aviv/">Branding
  example from Fall 2020</a></li>

  <li><a
  href="https://sites.psu.edu/dmdexhibitions/dmd-400-capstone-spring-2023/entry/35/">Physical
  exhibition from Spring 2023</a></li>

  <li><a
  href="https://sites.psu.edu/dmdexhibitions/dmd-400-capstone-spring-2023/entry/44/">Interactive
  storytelling from Spring 2023</a></li>

  <li><a
  href="https://sites.psu.edu/dmdexhibition22fa/2023/01/20/rachel-brunner/">Documentary
  filmmaking from Fall 2022</a></li>

  <li><a
  href="https://sites.psu.edu/dmdexhibition22fa/2023/01/15/carly-mojica/">Web
  design from Fall 2022</a></li>

  </ul>

  <p>There is an exhibition media upload form listed in Canvas. You will use
  this form to upload your work to the exhibition website.</p>

  <p><strong>The exhibition form supports the following information and
  media:</strong></p>

  <ul>

  <li>Your name and other information. Emails are not displayed on the
  website.</li>

  <li>Image upload for your exhibition index card</li>

  <li>Explainer video from Youtube or Vimeo.

  <ul>

  <li>Do not use the full URL, only the video ID. Remove any video ID URL
  modifiers such as '&amp;T=3s'.</li>

  </ul>

  </li>

  <li>A link to your production blog</li>

  <li>Work/project statement</li>

  <li>Other project links (IE - app prototypes, live project websites)</li>

  <li>Upload for your PDF documentation</li>

  <li>Youtube and Vimeo videos

  <ul>

  <li>Do not use the full URL, only the video ID. Remove any video ID URL
  modifiers such as '&amp;T=3s'.</li>

  </ul>

  </li>

  <li>A gallery of images (minimum of 3, maximum of 15)</li>

  <li>iframe embed code if you would like to embed something from an online
  platform (IE - sketchfab.com 3D objects, codepen.io code, processing,
  etc.)</li>

  <li>File downloads (IE - game executables) (Note: 42 MB max file size.)</li>

  <li>Others upon request (request other media well in advance)</li>

  </ul>

  <h2>Media</h2>

  <p>When you have finished your project, you will need to submit media files
  for display on the exhibition website. Media files will vary from project to
  project, however, it is typical to have gallery images to highlight your
  project.</p>

  <p>The exhibition website uses a site generator, and is sensitive to file
  names. Please use the exact filename structures listed for each item
  below.</p>

  <h3>Instructions:</h3>

  <p><strong>Download Media template files (5.9MB) (Click the download button on
  this page):</strong> <a
  href="https://github.com/dmd-program/dmd-course-graphics/blob/master/media-templates.zip">https://github.com/dmd-program/dmd-course-graphics/blob/master/media-templates.zip</a></p>

  <p>The templates are not editable. They simply demonstrate the required sizes
  of videos and card images for the exhibition website.</p>

  <p>Unless you are using a pseudonym, replace <strong>last-name</strong> in the
  file with your last name and <strong>first-name</strong> with your first
  name.</p>

  <p>If you ARE using a pseudonym, please use it in place of
  <strong>last-name_first-name</strong>.</p>

  <h4>Exhibition card (index) image (required)</h4>

  <p>The exhibition card image will be displayed on the exhibition projects
  index page, the listing of everyone's work. The project name and student name
  will be displayed under the card image, so there is no need for you to put
  your name and project title on the card.</p>

  <ul>

  <li>Keep text to a minimum.</li>

  <li>Do not include the name of the project unless it is part of a logo or
  branding.</li>

  </ul>

  <p><strong>File name:</strong>
  <code>last-name_first-name-exhibition-card-image-1200x600.jpg</code></p>

  <p><img src="files/exhibition-card-image-example.jpg" alt="exhibition card
  example image"></p>

  <h4>Gallery images</h4>

  <p>Gallery images are shown on your project's profile page. Try to include
  between 3 to 12 images. Images can be close up views of details, documentation
  of process, etc. Do not include images larger than 2000px in any dimension.
  Use Photoshop to export <code>.jpg</code> images for display on the web at a
  compressed file size.</p>

  <p>See image compression tutorial here:
  https://www.youtube.com/watch?v=sKmlptbrL4s</p>

  <p><strong>File naming:</strong></p>

  <ol>

  <li><code>last-name_first-name-gallery-image-01.jpg</code></li>

  <li><code>last-name_first-name-gallery-image-02.jpg</code></li>

  <li><code>last-name_first-name-gallery-image-03.jpg</code></li>

  <li><code>last-name_first-name-gallery-image-##.jpg</code></li>

  </ol>

  <h4>Video files</h4>

  <p>Upload any videos to YouTube or Vimeo.</p>

  <p>You can set it to "unlisted" if you don't want it fully accessible within
  YouTube. (The video will still be visible on the exhibition site.)</p>

  <p>Enter only the video ID on the exhibition form. See examples below.</p>

  <p><img src="files/youtube-id.jpg" alt="Youtube video id"></p>

  <p><img src="files/vimeo-id.jpg" alt="Vimeo video id"></p>

  <h4>Interactive elements</h4>

  <p>If you are using an embedded interactive element, please include the embed
  code in a <code>.txt</code> file when submitting to canvas. If your
  interactive elements require many files to operate, please include a
  <code>.zip</code> file of those files.</p>

  <p><strong>File name:</strong></p>

  <p><code>last-name_first-name-embed-01.txt</code> <strong>or</strong>
  <code>last-name_first-name-files-01.zip</code></p>

  <h4>Audio</h4>

  <p>Convert audio files to <code>.mp3</code> so they may be playable from a web
  browser.</p>

  <p><strong>Example audio files:</strong>
  <code>last-name_first-name-audio.mp3</code></p>

  <h2>Submission details</h2>

  <p><em><strong>IMPORTANT:</strong></em> Follow the file naming conventions
  above.</p>

  <ol>

  <li>Submit the final project media to Canvas by the indicated date in a
  <code>.zip</code> file.</li>

  </ol>

  <ul>

  <li>Canvas does not have a file size limitation, the 42MB limit is for
  exhibition website uploads.</li>

  </ul>

  <ol start="2">

  <li>Upload your media and exhibition project information using the exhibition
  form listed in Canvas.</li>

  </ol>

  <ul>

  <li>42 MB is the maximum file size for any one file.</li>

  </ul>
