content: >-
  <p>You'll model an old TV set sitting on a small table in Blender, starting
  from the default cube. The screen is a separate, slightly curved object, so in
  Part 2 it can take an animated texture: an image sequence that plays on the
  screen. You'll need Blender (the video uses Blender 2.90) and a reference
  picture of a TV to guide the shape. You can model any TV you like; what
  matters is a screen to put the image sequence on.</p>


  <oer-video id="video-BYVjyBiVZG8"
  src="https://www.youtube.com/watch?v=BYVjyBiVZG8" title="Animated Textures —
  Part 1" credit="Michael Collins"
  credit-url="https://www.youtube.com/channel/UCp1cLW7rry_NKRhcH8bPfGg"></oer-video>


  <h2>See what you're making</h2>

  <ol>
    <li>
      <p><strong>Look at the finished animation.</strong> <page-anchor target="#video-BYVjyBiVZG8" value="2">0:02</page-anchor> The TV's screen is an animated texture. Over three seconds it switches on, then a squiggly line moves across it from left to right. After this part, the series puts an image sequence made in After Effects on the screen, renders the animation from Blender as an image sequence, and brings that back into After Effects for post-production and a streaming video for a site like YouTube or Vimeo <page-anchor target="#video-BYVjyBiVZG8" value="37">0:37</page-anchor>.</p>
      <figure><img src="files/modeling-a-tv-and-its-table-t0055.0.jpg" alt="The finished render: a dark brown TV set with a white screen, and a grey knob on a panel to the right of the screen, on a wooden table with four tapered legs against a green background. A black squiggly line is coming onto the screen from the left. QuickTime's playback controls show 1 second into a 3-second video."><figcaption><p>Where the series ends up: the screen animation playing on the model.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Use a reference.</strong> <page-anchor target="#video-BYVjyBiVZG8" value="65">1:05</page-anchor> A reference picture of an old TV guides the main features. The model here changes some things: the TV in the reference has legs of its own, while this one sits on a separate piece of furniture. It keeps a rectangular panel with a knob beside the screen, and a screen that's wider than it is tall, though less so than in the reference <page-anchor target="#video-BYVjyBiVZG8" value="99">1:39</page-anchor>. How closely you follow your reference is up to you <page-anchor target="#video-BYVjyBiVZG8" value="258">4:18</page-anchor>.</p>
    </li>
  </ol>


  <h2>Shape the TV's body</h2>

  <ol>
    <li>
      <p><strong>Inset the front face for the screen.</strong> <page-anchor target="#video-BYVjyBiVZG8" value="112">1:52</page-anchor> Select the default cube and press <kbd>Tab</kbd> for <em>Edit Mode</em>. Switch to face select and select the front face. Press <kbd>E</kbd> to extrude and, while extruding, press <kbd>S</kbd> to scale the new face in. The <em>Inset Faces</em> tool in the toolbar does much the same <page-anchor target="#video-BYVjyBiVZG8" value="142">2:22</page-anchor>. Then move the new face back into the cube to make a sloped bezel <page-anchor target="#video-BYVjyBiVZG8" value="155">2:35</page-anchor>.</p>
      <figure><img src="files/modeling-a-tv-and-its-table-t0160.8.jpg" alt="Edit Mode in face select: the cube from the front, with its front face inset and moved back into the cube so that a sloped frame surrounds it. The inset face is selected, with the move gizmo on it."><figcaption><p>The front face inset and pushed back: the start of the bezel.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Change the proportions.</strong> <page-anchor target="#video-BYVjyBiVZG8" value="164">2:44</page-anchor> The screen shouldn't be a perfect square. Go to the front view <page-anchor target="#video-BYVjyBiVZG8" value="178">2:58</page-anchor> and turn on <em>X-ray</em>, so you can select the vertices at the back as well. Select everything and scale it vertically to make the TV wider than it is tall. Then select the vertices on the right side and move them out <page-anchor target="#video-BYVjyBiVZG8" value="201">3:21</page-anchor> to make room beside the screen for a control panel.</p>
    </li>
    <li>
      <p><strong>Slope the back.</strong> <page-anchor target="#video-BYVjyBiVZG8" value="213">3:33</page-anchor> Add an edge loop around the middle of the body, then scale and move the back of the body in, so that the top slopes down from the loop to the back.</p>
      <figure><img src="files/modeling-a-tv-and-its-table-t0230.0.jpg" alt="Edit Mode, looking at the TV body from the side: an edge loop runs around the middle of the box, and the edges of the back face are selected and have been moved, so the top of the box slopes down from the loop toward the back."><figcaption><p>An edge loop around the middle lets the back slope down.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Exaggerate the bezel.</strong> <page-anchor target="#video-BYVjyBiVZG8" value="246">4:06</page-anchor> In face select, select the face at the back of the screen opening and scale it down to make the bezel's slope steeper.</p>
    </li>
  </ol>


  <h2>Add the control panel and knob</h2>

  <ol>
    <li>
      <p><strong>Add a panel.</strong> <page-anchor target="#video-BYVjyBiVZG8" value="283">4:43</page-anchor> Rather than modeling everything as one object, add another cube. Scale it into a tall rectangle and place it to the right of the screen, sticking out of the front slightly <page-anchor target="#video-BYVjyBiVZG8" value="316">5:16</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Add a knob.</strong> <page-anchor target="#video-BYVjyBiVZG8" value="326">5:26</page-anchor> Add a cylinder, rotate it 90 degrees on the X axis and scale it down. Go to the side view to place it on the panel.</p>
    </li>
    <li>
      <p><strong>Separate the pieces if you added them in Edit Mode.</strong> <page-anchor target="#video-BYVjyBiVZG8" value="345">5:45</page-anchor> If you were in <em>Edit Mode</em> when you added the panel and knob (as in the video), they're part of the TV's mesh. Press <kbd>A</kbd> to select everything, right-click and choose <em>Separate → By Loose Parts</em>: now there are three separate objects <page-anchor target="#video-BYVjyBiVZG8" value="365">6:05</page-anchor>. It's an easy mistake to fix. Setting each new object's origin to its geometry <page-anchor target="#video-BYVjyBiVZG8" value="383">6:23</page-anchor> doesn't change anything, but it's tidier.</p>
      <figure><img src="files/modeling-a-tv-and-its-table-t0400.0.jpg" alt="Front Orthographic view in Object Mode: the TV body with its sloped bezel around the screen opening on the left, and a tall panel on the right with a round knob near its bottom. The Outliner lists Cube, Cube.001 and Cube.002, and the properties show Cube.001, the panel."><figcaption><p>Body, panel and knob as three objects.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Make the screen a separate, curved piece</h2>

  <ol>
    <li>
      <p><strong>Separate the screen.</strong> <page-anchor target="#video-BYVjyBiVZG8" value="391">6:31</page-anchor> As its own object, the screen is easier to shape and to give its own material. In <em>Edit Mode</em> on the body, select the face at the back of the screen opening. Press <kbd>P</kbd> (or right-click and choose <em>Separate</em>) and choose <em>Selection</em> <page-anchor target="#video-BYVjyBiVZG8" value="428">7:08</page-anchor>. Then select the new screen object and press <kbd>S</kbd> to scale it up slightly, so that it overlaps the bezel <page-anchor target="#video-BYVjyBiVZG8" value="437">7:17</page-anchor>.</p>
      <figure><img src="files/modeling-a-tv-and-its-table-t0420.0.jpg" alt="Front Orthographic view in Edit Mode on the body, Cube: the face at the back of the screen opening is selected, shown in light orange."><figcaption><p>The face that becomes the screen.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Give it more geometry.</strong> <page-anchor target="#video-BYVjyBiVZG8" value="450">7:30</page-anchor> Add a <em>Subdivision Surface</em> modifier with 2 levels, set to <em>Simple</em> so it doesn't round off the screen's outline <page-anchor target="#video-BYVjyBiVZG8" value="456">7:36</page-anchor>. Press <kbd>Tab</kbd> to go back to <em>Object Mode</em> and click <em>Apply</em>: you can't apply a modifier while you're in <em>Edit Mode</em>.</p>
      <figure><img src="files/modeling-a-tv-and-its-table-t0462.0.jpg" alt="The screen object, Cube.003, selected in front of the TV body. Its Subdivision Surface modifier is set to Simple, with Levels Viewport and Render both at 2."><figcaption><p>Simple subdivision adds faces without rounding the screen's edges.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Curve it with proportional editing.</strong> <page-anchor target="#video-BYVjyBiVZG8" value="477">7:57</page-anchor> Switch to wireframe to see the new subdivisions. In <em>Edit Mode</em>, select the vertex in the middle of the screen and turn on <em>Proportional Editing</em> in the header <page-anchor target="#video-BYVjyBiVZG8" value="482">8:02</page-anchor>. Press <kbd>G</kbd> then <kbd>Y</kbd> to move the vertex forward along Y <page-anchor target="#video-BYVjyBiVZG8" value="499">8:19</page-anchor>. Because you aren't holding a mouse button, you can turn the scroll wheel as you move it to change how much of the screen moves with it, and so the curve. With the <em>Move</em> tool you'd have to hold the mouse button down and scroll at the same time <page-anchor target="#video-BYVjyBiVZG8" value="521">8:41</page-anchor>. Keep the curve slight, and check that the screen still meets the bezel all the way round <page-anchor target="#video-BYVjyBiVZG8" value="535">8:55</page-anchor>.</p>
      <figure><img src="files/modeling-a-tv-and-its-table-t0520.0.jpg" alt="Wireframe view in Edit Mode: the screen's middle vertex is being moved along global Y with proportional editing on. A large grey circle shows the area it affects, and the header reads Proportional size: 1.21."><figcaption><p>The circle shows how far the move reaches: scroll to change it.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Smooth the TV and add bevels</h2>

  <ol>
    <li>
      <p><strong>Shade the screen smooth.</strong> <page-anchor target="#video-BYVjyBiVZG8" value="543">9:03</page-anchor> Right-click the screen and choose <em>Shade Smooth</em> so its polygons don't show.</p>
    </li>
    <li>
      <p><strong>Bevel the edge around the screen opening.</strong> <page-anchor target="#video-BYVjyBiVZG8" value="561">9:21</page-anchor> On the body, go into <em>Edit Mode</em>, press <kbd>2</kbd> for edge select and select the edge loop around the screen opening. Add a bevel, and before you confirm it, open its options and set <em>Segments</em> to 3 <page-anchor target="#video-BYVjyBiVZG8" value="581">9:41</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Smooth it by angle.</strong> <page-anchor target="#video-BYVjyBiVZG8" value="590">9:50</page-anchor> <em>Shade Smooth</em> on its own smooths everything, which looks wrong on a boxy shape. In the <em>Object Data Properties</em>, open <em>Normals</em> and tick <em>Auto Smooth</em> <page-anchor target="#video-BYVjyBiVZG8" value="606">10:06</page-anchor>: it smooths only where faces meet at less than its angle (30° here), so the sharp corners stay sharp.</p>
      <figure><img src="files/modeling-a-tv-and-its-table-t0620.8.jpg" alt="The TV body in Edit Mode with the bevelled edges around the screen opening selected. In the Object Data Properties, Normals is open, with Auto Smooth ticked and its angle at 30°."><figcaption><p>Auto Smooth keeps the corners crisp while the bevels shade smoothly.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Add a second bevel for highlights.</strong> <page-anchor target="#video-BYVjyBiVZG8" value="621">10:21</page-anchor> Press <kbd>Alt</kbd>+<kbd>A</kbd> (<kbd>Option</kbd>+<kbd>A</kbd> on a Mac) to deselect, then <kbd>Alt</kbd>+<kbd>Shift</kbd>+click to select another edge loop, and bevel it too: bevels catch highlights. In the front view, move it to match the size of the other bevels. If moving it drags other vertices along, turn off <em>Proportional Editing</em> first <page-anchor target="#video-BYVjyBiVZG8" value="645">10:45</page-anchor>.</p>
    </li>
  </ol>


  <h2>Build the table</h2>

  <ol>
    <li>
      <p><strong>Make the tabletop.</strong> <page-anchor target="#video-BYVjyBiVZG8" value="652">10:52</page-anchor> Add another cube. With <em>X-ray</em> on so you can select all its vertices, flatten it into a tabletop under the TV, then adjust its size to suit the set <page-anchor target="#video-BYVjyBiVZG8" value="703">11:43</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Add a leg.</strong> <page-anchor target="#video-BYVjyBiVZG8" value="713">11:53</page-anchor> Add a cylinder and, in the <em>Add Cylinder</em> panel, give it 16 vertices instead of 32 <page-anchor target="#video-BYVjyBiVZG8" value="735">12:15</page-anchor>. Scale it into a leg, then in <em>Edit Mode</em> select the bottom and scale it in to taper it <page-anchor target="#video-BYVjyBiVZG8" value="747">12:27</page-anchor>. Place it at one corner under the tabletop.</p>
    </li>
    <li>
      <p><strong>Mirror it into four legs.</strong> <page-anchor target="#video-BYVjyBiVZG8" value="785">13:05</page-anchor> Add a <em>Mirror</em> modifier to the leg and set <em>Mirror Object</em> to the tabletop, with the X and Y axes on: the leg is mirrored to all four corners around the tabletop's center. Shorten the table if it needs it <page-anchor target="#video-BYVjyBiVZG8" value="807">13:27</page-anchor>.</p>
      <figure><img src="files/modeling-a-tv-and-its-table-t0800.4.jpg" alt="Four tapered legs under the tabletop, all from one cylinder. Its Mirror modifier has Axis X and Y on and Mirror Object set to Cube.004, the tabletop."><figcaption><p>One leg, mirrored across the tabletop's center on X and Y.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Round the tabletop's edges.</strong> <page-anchor target="#video-BYVjyBiVZG8" value="822">13:42</page-anchor> Add a <em>Bevel</em> modifier to the tabletop with 3 segments. The rounding comes out large and uneven because the cube was stretched without applying its scale. Press <kbd>Ctrl</kbd>+<kbd>A</kbd> and apply <em>Scale</em>: the bevel evens out on every edge <page-anchor target="#video-BYVjyBiVZG8" value="865">14:25</page-anchor>. Then set the bevel's <em>Amount</em> to about 0.01 <page-anchor target="#video-BYVjyBiVZG8" value="873">14:33</page-anchor> and shade the tabletop smooth. Shade the legs smooth too.</p>
      <figure><img src="files/modeling-a-tv-and-its-table-t0872.0.jpg" alt="A close-up of the tabletop with a Bevel modifier (Edges, Amount 0.02 m, Segments 3). The Apply Object Transform panel at the bottom left has Scale ticked, and the tabletop's edges are evenly rounded."><figcaption><p>With the scale applied, the bevel is even on every edge.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Add a floor</h2>

  <ol>
    <li>
      <p><strong>Add a ground plane.</strong> <page-anchor target="#video-BYVjyBiVZG8" value="889">14:49</page-anchor> Add a plane, scale it up and move it down under the table's legs, so that it catches shadows.</p>
      <figure><img src="files/modeling-a-tv-and-its-table-t0925.4.jpg" alt="The finished model in solid shading: the TV body with its panel, knob and screen, on a tabletop with four tapered legs, standing on a large ground plane. The Outliner lists Camera, Cube to Cube.004, Cylinder, Light and Plane."><figcaption><p>The finished model, ready for the animated texture.</p></figcaption></figure>
    </li>
  </ol>


  <h2>What's next</h2>

  <p>You've modeled a TV set from the default cube, with a sloped bezel, a panel
  and knob, a separate curved screen, bevels for highlights, and a table with
  mirrored legs on a floor. Part 2 puts an image sequence on the screen as an
  animated texture, lights and renders the scene, and turns the render into a
  video in After Effects and Media Encoder.</p>

