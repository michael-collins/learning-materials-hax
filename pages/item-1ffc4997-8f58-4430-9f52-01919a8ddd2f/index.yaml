title: Modeling a TV and its table
description: >-
  Model an old TV set on a small table in Blender, starting from the default
  cube: a sloped bezel, a control panel and knob, a separate curved screen ready
  for an animated texture, bevels that catch highlights, and a table with
  mirrored legs.
