content: >
  <p>How to Make a Chess Board</p>

  <oer-iframe
  src="https://youtube.com/embed/videoseries?list=PLcAjW37cz5QksJy4ZnxgWrbVFklAoOFvU"
  title="Modeling a Chessboard Tutorial"></oer-iframe>

  <h2>Learning Objectives</h2>

  <ol>

  <li>Practice using 3D software interface and terminology.</li>

  <li>Use modeling workflows to create high quality topology and edge flow.</li>

  <li>Familiarize yourself with a cumulative number of hotkeys and operations
  (it's a good idea to keep a personal log of hotkeys and operators that you
  will likely use again, as you go).</li>

  </ol>

  <h2>Instructions</h2>

  <p><strong>How to Make a Chess Board</strong>

  <br>

  <br>

  The Play list consists of two demonstrations. The First is a more recent and
  involved demonstration. It is expected that your assignment will at the very
  least look contain the elements and organization of the board in the earlier
  demonstration. That said you are encouraged to expand upon the design, thus
  the inclusion of both demonstrations.&nbsp;

  <br>

  <br>

  For this assignment, recreate the steps in the Demonstration and submit your
  images of your model to Canvas for review. Make sure that your assignment is
  titled in the following format:

  <br>

  <br>  Last name, First name, the word "Lesson" followed by the Lesson number,
  and the word "Assignment" followed by the Assignment number.

  <br>

  <br>  Example:

  Brill Ian Lesson x Assignment x

  <br>

  <br>  Be sure to provide screen grabs or renders from 3 angles and the
  original blender file. Be sure to upload each file independently to facilitate
  ease of grading (so that the reviewer only need to download files when
  necessary).</p>

  <h2>Grading Rubric</h2>

  <oer-rubric rubric-id="exercise"></oer-rubric>
