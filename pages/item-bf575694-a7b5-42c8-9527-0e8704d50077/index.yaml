content: >
  <oer-draft note="Week 11 from the DART 413 course plan. Revise it, then
  Publish to show it to readers.">

  <p>Combining processes: molds and casting from printed or cut masters; vacuum
  forming; vinyl cutting for graphics; finishing (sanding, priming, paint,
  sealing); embedding hardware and light (optional).</p>

  <h2>Ideas</h2>

  <p>Formative processes; the master and the copy; finishing as the difference
  between prototype and object; material sustainability (PLA, acrylic, MDF
  waste).</p>

  <h2>In class</h2>

  <ul><li>Demo rotation (60)</li><li>finishing workshop
  (60)</li><li>final-project ideation (50)</li></ul>

