content: >-
  <p>Before you model the Airline Chair, designed by Kem Weber in the 1930s, you
  need a picture of it to model from. In this short part you'll bring a side
  photo of the chair into Blender as a background image, lined up with the side
  view, and stop it being selectable so you can't move it by accident while you
  work. You'll need Blender (the video uses Blender 2.83) and the side reference
  image linked in the exercise.</p>


  <oer-video id="video-qlVWEhwTxU0"
  src="https://www.youtube.com/watch?v=qlVWEhwTxU0" title="Modeling the Airline
  Chair – Part 1: Reference Plane" credit="Michael Collins"
  credit-url="https://www.youtube.com/channel/UCp1cLW7rry_NKRhcH8bPfGg"></oer-video>


  <h2>Add the reference image</h2>

  <ol>
    <li>
      <p><strong>Start with an empty scene.</strong> <page-anchor target="#video-qlVWEhwTxU0" value="0">0:00</page-anchor> The reference is a photo of the chair from the side, slightly turned, with the whole frame visible: arms, back, seat and runners. In a new Blender file, select the default cube and press <kbd>X</kbd> to delete it <page-anchor target="#video-qlVWEhwTxU0" value="32">0:32</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Switch to the side view.</strong> <page-anchor target="#video-qlVWEhwTxU0" value="45">0:45</page-anchor> Before adding the image, look straight along the X axis: click the <em>X</em> on the navigation gizmo at the top right of the viewport (its shortcut is <kbd>Numpad 3</kbd>). The viewport's label changes to <em>Right Orthographic</em>. The image is added facing the view you're in, so this matters.</p>
    </li>
    <li>
      <p><strong>Add it as a background image.</strong> <page-anchor target="#video-qlVWEhwTxU0" value="50">0:50</page-anchor> Choose <em>Add → Image → Background</em>.</p>
      <figure><img src="files/setting-up-the-reference-image-t0053.0.jpg" alt="Blender's Add menu open in the Right Orthographic view, with Image highlighted and its submenu showing Reference, Background and Images as Planes; the pointer is on Background."><figcaption><p>Add → Image → Background, in the Right Orthographic view.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Choose the photo.</strong> <page-anchor target="#video-qlVWEhwTxU0" value="55">0:55</page-anchor> In the file browser, find the reference image and click <em>Load Background Image</em>. To get to its folder quickly, you can drag the file from the Finder into the file browser <page-anchor target="#video-qlVWEhwTxU0" value="56">0:56</page-anchor>.</p>
      <figure><img src="files/setting-up-the-reference-image-t0058.0.jpg" alt="Blender's file browser open at a references folder holding two JPEG photos, with the second, 244191_5cd7e8666b5a9bfe_b.jpg, in the file name field and the Load Background Image button at the bottom right. A Finder window beside it shows the same folder."><figcaption><p>Load the side photo from wherever you saved it.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Lock the reference</h2>

  <ol>
    <li>
      <p><strong>Show the selectable toggle in the Outliner.</strong> <page-anchor target="#video-qlVWEhwTxU0" value="60">1:00</page-anchor> The image is an object like any other, so it's easy to click and move it by accident while you model. Open the <em>Filter</em> menu at the top of the Outliner and, under <em>Restriction Toggles</em>, turn on the arrow icon, which controls whether an object can be selected <page-anchor target="#video-qlVWEhwTxU0" value="66">1:06</page-anchor>.</p>
      <figure><img src="files/setting-up-the-reference-image-t0068.8.jpg" alt="The chair photo sits small in the middle of the Right Orthographic view. At the top right, the Outliner's Filter menu is open; under Restriction Toggles, the arrow icon for selecting is turned on next to the eye."><figcaption><p>The Outliner's Filter menu, with the selectable (arrow) toggle turned on.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Make the image unselectable and name it.</strong> <page-anchor target="#video-qlVWEhwTxU0" value="70">1:10</page-anchor> In the Outliner, click the image's arrow icon to turn it off. Rename it, from Empty to ref, so you know what it is later <page-anchor target="#video-qlVWEhwTxU0" value="73">1:13</page-anchor>. Now clicking the image in the viewport doesn't select it.</p>
      <figure><img src="files/setting-up-the-reference-image-t0076.4.jpg" alt="The Outliner lists Camera, Light and ref. Camera and Light have a white arrow and an eye beside them; ref's arrow is greyed out. The Object Properties show ref at location 0, 0, 0 with rotation X 90 degrees and Z 90 degrees."><figcaption><p>The reference renamed ref, with its arrow turned off so it can't be selected.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>See it only from the side.</strong> <page-anchor target="#video-qlVWEhwTxU0" value="87">1:27</page-anchor> Orbit away from the side view and the image disappears; go back to <em>Right Orthographic</em> and it's there again <page-anchor target="#video-qlVWEhwTxU0" value="93">1:33</page-anchor>. That's helpful: the photo only shows where it lines up with the model, and stays out of the way when you look at the chair from other angles. Zoom in so the photo fills the view, ready to model over.</p>
      <figure><img src="files/setting-up-the-reference-image-t0100.4.jpg" alt="Back in the Right Orthographic view, zoomed in so the side photo of the Airline Chair fills most of the viewport, with the Y axis running through the arms and the Z axis down the middle of the seat."><figcaption><p>Ready to model: the reference lined up with the side view.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Wrap-up</h2>

  <p>The chair's side photo is now in your scene as a background image, facing
  the side view, named ref and locked against selection. It only shows when you
  look along the X axis, which is the view you'll model the side of the chair in
  next.</p>

