content: >-
  <p>Posing a leg by rotating the thigh, then the shin, then the foot is slow.
  Inverse kinematics (IK) works the other way: you move a target bone where you
  want the foot to be, and Blender bends the leg to reach it. In this part
  you'll add IK constraints to both legs and both arms, each with a target and a
  pole target that points the knee or elbow, make the feet and hands turn with
  their targets, and use them to pose the character sitting on a simple block.
  You'll need the character bound to its armature from the last part. The video
  uses Blender 2.90.</p>


  <oer-video id="video-flBsgjlDYfk"
  src="https://www.youtube.com/watch?v=flBsgjlDYfk" title="Rigging Part 07 -
  Posing with IK Bone Constraints" credit="Michael Collins"
  credit-url="https://www.youtube.com/channel/UCp1cLW7rry_NKRhcH8bPfGg"></oer-video>


  <h2>Forward and inverse kinematics</h2>

  <ol>
    <li>
      <p><strong>Know the difference.</strong> <page-anchor target="#video-flBsgjlDYfk" value="0">0:00</page-anchor> By default, posing is forward kinematics: in Pose Mode, rotate a bone and the bones below it in the chain follow <page-anchor target="#video-flBsgjlDYfk" value="14">0:14</page-anchor>. Inverse kinematics passes the rotations back up the chain: put the foot somewhere and the leg follows. It needs a constraint, which you'll set up now.</p>
    </li>
  </ol>


  <h2>Add IK to the left leg</h2>

  <ol>
    <li>
      <p><strong>Extrude a foot target and a knee target.</strong> <page-anchor target="#video-flBsgjlDYfk" value="39">0:39</page-anchor> In <em>Edit Mode</em>, turn on X-axis mirror (the <em>X</em> button at the top right of the viewport) so new bones are made on both sides. Select the heel joint, press <kbd>E</kbd> to extrude a bone and click the middle mouse button to keep it straight: this will be the IK target. Do the same at the knee <page-anchor target="#video-flBsgjlDYfk" value="66">1:06</page-anchor>.</p>
      <figure><img src="files/posing-with-ik-constraints-t0082.0.jpg" alt="Edit Mode, looking at the lower legs from the side. Two new bones stick straight out from the backs of the heels, both selected, and two more point the other way from the knees. The X mirror button is on at the top right of the viewport."><figcaption><p>New bones extruded from the heels (and the knees), made on both sides by X-axis mirror.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Clear their parents.</strong> <page-anchor target="#video-flBsgjlDYfk" value="77">1:17</page-anchor> The new bones are still attached to the leg. Select them, press <kbd>Alt</kbd> <kbd>P</kbd> (<kbd>Option</kbd> <kbd>P</kbd> on a Mac) and choose <em>Clear Parent</em>. Move the knee bones forward, in front of the knees, so they're not touching the leg <page-anchor target="#video-flBsgjlDYfk" value="89">1:29</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Add an IK constraint to the shin.</strong> <page-anchor target="#video-flBsgjlDYfk" value="110">1:50</page-anchor> Go to <em>Pose Mode</em> (constraints on bones are added there), select the lower leg bone, and in the <em>Bone Constraint Properties</em> choose <em>Add Bone Constraint → Inverse Kinematics</em> <page-anchor target="#video-flBsgjlDYfk" value="125">2:05</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Set the chain length to 2.</strong> <page-anchor target="#video-flBsgjlDYfk" value="135">2:15</page-anchor> That limits the IK to two bones, the shin and the thigh. A dotted line now runs from the base of the shin up to the top of the leg.</p>
      <figure><img src="files/posing-with-ik-constraints-t0142.8.jpg" alt="Pose Mode with the lower leg bone selected. The new IK constraint in the Bone Constraint Properties has empty Target and Pole Target fields, Iterations 500 and Chain Length 2, with Use Tail and Stretch on."><figcaption><p>The IK constraint on the lower leg, with Chain Length 2.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Name the targets.</strong> <page-anchor target="#video-flBsgjlDYfk" value="156">2:36</page-anchor> Named bones are easier to find in the constraint's lists. In Edit Mode, rename the heel bone footIK.L (.L because it's the left one), and later the knee bone kneePoleTarget.L <page-anchor target="#video-flBsgjlDYfk" value="230">3:50</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Pick the target.</strong> <page-anchor target="#video-flBsgjlDYfk" value="183">3:03</page-anchor> Back in Pose Mode, with the shin selected, set the IK's <em>Target</em> to the armature, then choose footIK.L from the <em>Bone</em> list <page-anchor target="#video-flBsgjlDYfk" value="197">3:17</page-anchor>. You can also use the eyedropper <page-anchor target="#video-flBsgjlDYfk" value="149">2:29</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Pick the pole target.</strong> <page-anchor target="#video-flBsgjlDYfk" value="213">3:33</page-anchor> A pole target sets which way the knee points. Set <em>Pole Target</em> to the armature and its bone to kneePoleTarget.L <page-anchor target="#video-flBsgjlDYfk" value="250">4:10</page-anchor>. The leg twists when you do, so set <em>Pole Angle</em> to 90° or −90°, whichever points the knee forward. Here it's 90° <page-anchor target="#video-flBsgjlDYfk" value="255">4:15</page-anchor>.</p>
      <figure><img src="files/posing-with-ik-constraints-t0268.0.jpg" alt="Pose Mode with the lower leg bone highlighted. The IK constraint now has Target Armature with Bone footIK.L, Pole Target Armature with Bone kneePoleTarget.L, Pole Angle 90 degrees, Iterations 500 and Chain Length 2."><figcaption><p>The finished leg IK: target footIK.L, pole target kneePoleTarget.L, pole angle 90°.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Test it.</strong> <page-anchor target="#video-flBsgjlDYfk" value="273">4:33</page-anchor> In Pose Mode, grab the heel target with <kbd>G</kbd> and move it around: the leg bends to follow. You could animate just this bone's location and the leg would follow. Press <kbd>Alt</kbd> <kbd>G</kbd> to clear the move <page-anchor target="#video-flBsgjlDYfk" value="292">4:52</page-anchor>.</p>
      <figure><img src="files/posing-with-ik-constraints-t0284.4.jpg" alt="Pose Mode from the side: the footIK.L bone, highlighted, has been moved up, and the shin and thigh bend at the knee to keep the heel on it. The header shows the distance moved."><figcaption><p>Moving the IK target bends the leg to follow.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Make the foot turn with its target</h2>

  <ol>
    <li>
      <p><strong>Add a Copy Rotation constraint to the foot.</strong> <page-anchor target="#video-flBsgjlDYfk" value="301">5:01</page-anchor> So that rotating the target also turns the foot (to point the toes down, say), select the foot bone and choose <em>Add Bone Constraint → Copy Rotation</em> <page-anchor target="#video-flBsgjlDYfk" value="313">5:13</page-anchor>. Set both <em>Target</em> and <em>Owner</em> spaces to <em>Local Space</em> <page-anchor target="#video-flBsgjlDYfk" value="320">5:20</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Target the IK bone.</strong> <page-anchor target="#video-flBsgjlDYfk" value="336">5:36</page-anchor> Set its target to the armature. Nothing happens until you also choose the bone, footIK.L <page-anchor target="#video-flBsgjlDYfk" value="348">5:48</page-anchor>. Now rotating the target turns the foot.</p>
      <figure><img src="files/posing-with-ik-constraints-t0332.8.jpg" alt="Pose Mode close on the left foot, with the foot bone highlighted. A Copy Rotation constraint is open with Axis X, Y and Z on, Invert X, Y and Z off, Mix Replace, Target Local Space and Owner Local Space; its target isn't chosen yet."><figcaption><p>Copy Rotation on the foot, with both spaces set to Local Space.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Fix the directions.</strong> <page-anchor target="#video-flBsgjlDYfk" value="361">6:01</page-anchor> If the foot turns the opposite way, turn on <em>Invert</em> for that axis. In the video it's Z first <page-anchor target="#video-flBsgjlDYfk" value="374">6:14</page-anchor>; yours may differ. Then select the foot and turn off <em>Inherit Rotation</em> in its <em>Bone Properties</em> under <em>Relations</em>, in Edit Mode <page-anchor target="#video-flBsgjlDYfk" value="399">6:39</page-anchor>. Test each axis: here Y also turns the wrong way, so invert Y as well <page-anchor target="#video-flBsgjlDYfk" value="446">7:26</page-anchor>. Clear the test with <kbd>Alt</kbd> <kbd>R</kbd> and <kbd>Alt</kbd> <kbd>G</kbd> <page-anchor target="#video-flBsgjlDYfk" value="481">8:01</page-anchor>.</p>
      <figure><img src="files/posing-with-ik-constraints-t0423.4.jpg" alt="Edit Mode with the foot.L bone selected. In the Bone Properties, Relations shows Parent lowerleg.L with Connected on and Inherit Rotation turned off."><figcaption><p>Inherit Rotation turned off on the foot bone.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Make the knee follow the foot.</strong> <page-anchor target="#video-flBsgjlDYfk" value="515">8:35</page-anchor> In Edit Mode, select the knee pole target, then <kbd>Shift</kbd>-click the foot target, press <kbd>Ctrl</kbd> <kbd>P</kbd> (<kbd>Cmd</kbd> <kbd>P</kbd> on a Mac) and choose <em>Keep Offset</em>. Now in Pose Mode, moving the foot target moves the pole target too, and rotating it turns the knee <page-anchor target="#video-flBsgjlDYfk" value="554">9:14</page-anchor>: one bone controls the whole leg. To control the knee on its own, you can still keyframe the pole target <page-anchor target="#video-flBsgjlDYfk" value="592">9:52</page-anchor>.</p>
    </li>
  </ol>


  <h2>Set up the right leg</h2>

  <ol>
    <li>
      <p><strong>Repeat it on the other side.</strong> <page-anchor target="#video-flBsgjlDYfk" value="608">10:08</page-anchor> Add an IK constraint with a chain length of 2 to the right shin. Rename the right-side bones footIK.R and kneePoleTarget.R <page-anchor target="#video-flBsgjlDYfk" value="644">10:44</page-anchor>, set them as the target and pole target <page-anchor target="#video-flBsgjlDYfk" value="674">11:14</page-anchor>, and set the pole angle to 90° <page-anchor target="#video-flBsgjlDYfk" value="696">11:36</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Copy the rotation to the right foot.</strong> <page-anchor target="#video-flBsgjlDYfk" value="705">11:45</page-anchor> Add a Copy Rotation constraint to the right foot with Invert Y and Z on, both spaces set to Local Space and footIK.R as its target <page-anchor target="#video-flBsgjlDYfk" value="726">12:06</page-anchor>.</p>
      <figure><img src="files/posing-with-ik-constraints-t0724.0.jpg" alt="Pose Mode with the foot.R bone highlighted. Its Copy Rotation constraint has Invert Y and Z turned on; Target and Owner still read World Space, before they're changed to Local Space."><figcaption><p>The right foot's Copy Rotation, with Y and Z inverted.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>If both feet move together, turn off mirroring.</strong> <page-anchor target="#video-flBsgjlDYfk" value="752">12:32</page-anchor> X-axis mirror is also on in Pose Mode, so moving one foot moves the other. Turn it off at the top right of the viewport, and each foot moves on its own <page-anchor target="#video-flBsgjlDYfk" value="766">12:46</page-anchor>. Test the feet and legs from a few views <page-anchor target="#video-flBsgjlDYfk" value="784">13:04</page-anchor>.</p>
    </li>
  </ol>


  <h2>Add IK to the arms</h2>

  <ol>
    <li>
      <p><strong>Make the elbow pole targets.</strong> <page-anchor target="#video-flBsgjlDYfk" value="797">13:17</page-anchor> The arms get the same system. In Edit Mode with mirroring on, select the elbow joint, extrude a bone, clear its parent with <kbd>Alt</kbd> <kbd>P</kbd> and move it back behind the elbow <page-anchor target="#video-flBsgjlDYfk" value="853">14:13</page-anchor>. Name them elbowPoleTarget.R and elbowPoleTarget.L <page-anchor target="#video-flBsgjlDYfk" value="880">14:40</page-anchor>.</p>
      <figure><img src="files/posing-with-ik-constraints-t0890.0.jpg" alt="Edit Mode, the character seen from the side. A new bone, selected, floats on its own away from the arm, and its name is being typed as elbowPole in the Bone Properties name field. Its Relations show no parent."><figcaption><p>Naming the new elbow pole target.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Make the hand targets.</strong> <page-anchor target="#video-flBsgjlDYfk" value="907">15:07</page-anchor> Clear any test pose first (<kbd>Alt</kbd> <kbd>G</kbd>, <kbd>Alt</kbd> <kbd>R</kbd>). You could use the hand bone itself as the target, but a separate bone is used here: in Edit Mode, select the wrist, extrude a bone on both sides <page-anchor target="#video-flBsgjlDYfk" value="935">15:35</page-anchor> and clear its parent <page-anchor target="#video-flBsgjlDYfk" value="948">15:48</page-anchor>. Name them handIK.R and handIK.L <page-anchor target="#video-flBsgjlDYfk" value="963">16:03</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Add IK to the forearm.</strong> <page-anchor target="#video-flBsgjlDYfk" value="988">16:28</page-anchor> In Pose Mode, add an IK constraint to the forearm with a chain length of 2, target handIK.R and pole target elbowPoleTarget.R <page-anchor target="#video-flBsgjlDYfk" value="1019">16:59</page-anchor>. Set the pole angle to −90° to fix the rotation <page-anchor target="#video-flBsgjlDYfk" value="1024">17:04</page-anchor>.</p>
      <figure><img src="files/posing-with-ik-constraints-t1028.0.jpg" alt="Pose Mode with the right forearm highlighted. Its IK constraint has Target Armature with Bone handIK.R, Pole Target Armature with Bone elbowPoleTarget.R, and Pole Angle being set to −90, with Chain Length 2."><figcaption><p>The arm's IK: handIK.R as target, elbowPoleTarget.R as pole, −90°.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Copy the rotation to the hand.</strong> <page-anchor target="#video-flBsgjlDYfk" value="1033">17:13</page-anchor> Like the foot, give the hand a Copy Rotation constraint targeting handIK.R, with the same settings <page-anchor target="#video-flBsgjlDYfk" value="1045">17:25</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Repeat for the left arm.</strong> <page-anchor target="#video-flBsgjlDYfk" value="1074">17:54</page-anchor> IK on the left forearm with a chain length of 2, target handIK.L, pole target elbowPoleTarget.L and pole angle −90° <page-anchor target="#video-flBsgjlDYfk" value="1094">18:14</page-anchor>, and a Copy Rotation on the left hand with Invert Y and Z, both spaces in Local Space and handIK.L as its target <page-anchor target="#video-flBsgjlDYfk" value="1119">18:39</page-anchor>.</p>
    </li>
  </ol>


  <h2>Pose the character sitting</h2>

  <ol>
    <li>
      <p><strong>Add something to sit on.</strong> <page-anchor target="#video-flBsgjlDYfk" value="1160">19:20</page-anchor> In Object Mode, press <kbd>Shift</kbd> <kbd>A</kbd> and add a cube. In the side view, move it down and scale it up to make a seat <page-anchor target="#video-flBsgjlDYfk" value="1177">19:37</page-anchor>.</p>
      <figure><img src="files/posing-with-ik-constraints-t1185.4.jpg" alt="The Right Orthographic side view in Object Mode: the character stands in its T-pose with a large cube behind it, scaled to 2.674 on each axis, its top a little below the hips."><figcaption><p>A scaled cube as a seat.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Pose the legs with their targets.</strong> <page-anchor target="#video-flBsgjlDYfk" value="1193">19:53</page-anchor> In Pose Mode, move the foot targets to sit the character down. If a leg won't behave, check its IK: in the video, the right leg's pole target had never been set, so it's set now, at 90° <page-anchor target="#video-flBsgjlDYfk" value="1236">20:36</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Add a rest for the arm.</strong> <page-anchor target="#video-flBsgjlDYfk" value="1316">21:56</page-anchor> In Object Mode, duplicate the cube with <kbd>Shift</kbd> <kbd>D</kbd> and shape it into a taller block beside the seat <page-anchor target="#video-flBsgjlDYfk" value="1332">22:12</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Pose the arms.</strong> <page-anchor target="#video-flBsgjlDYfk" value="1341">22:21</page-anchor> Select the armature and press <kbd>Ctrl</kbd> <kbd>Tab</kbd> to go into Pose Mode. Raise the elbow by moving its pole target up, and lower the hand target so the arm rests on the block <page-anchor target="#video-flBsgjlDYfk" value="1357">22:37</page-anchor>, then fine-tune the pose by rotating bones <page-anchor target="#video-flBsgjlDYfk" value="1393">23:13</page-anchor>.</p>
      <figure><img src="files/posing-with-ik-constraints-t1430.4.jpg" alt="Pose Mode in solid shading: the character sits on the cube with one arm resting on the taller block beside it while the handIK.R target is moved. The other hand rests at the edge of the seat."><figcaption><p>Moving the hand target lays the arm on the block.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Check the deformation.</strong> <page-anchor target="#video-flBsgjlDYfk" value="1442">24:02</page-anchor> Some areas bend a bit oddly. For a production rig, you'd select the mesh, go into <em>Weight Paint</em> mode and adjust each bone's weights <page-anchor target="#video-flBsgjlDYfk" value="1455">24:15</page-anchor>; here it's good enough.</p>
      <figure><img src="files/posing-with-ik-constraints-t1436.8.jpg" alt="Object Mode: the finished pose, with the character sitting on the cube, legs bent at the hips and knees, one arm hanging down beside the seat and the other resting on the taller block beside it."><figcaption><p>The finished sitting pose.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Go further, if you like.</strong> <page-anchor target="#video-flBsgjlDYfk" value="1473">24:33</page-anchor> You could also add IK to the back or the head, with its own target. The video adds an IK constraint to the head as an example but doesn't finish it <page-anchor target="#video-flBsgjlDYfk" value="1502">25:02</page-anchor>.</p>
    </li>
  </ol>


  <h2>Wrap-up</h2>

  <p>The character now has a full rig: an armature with named bones, the mesh
  bound to it, and IK targets for the feet and hands, with pole targets for the
  knees and elbows. You can pose it by moving a handful of control bones, as in
  the sitting pose here.</p>

