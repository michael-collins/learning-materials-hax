  just choose that knee pole target l okay you can see it
  kind</p><p><page-anchor target="#video-flBsgjlDYfk"
  value="255">4:15</page-anchor> of rotates so we have we have to correct that
  here in the ik property so we're going to choose negative 90 or in this case
  it's going to be 90. It'll be one of those two depending on which direction
  it's rotated. So it looks like 90 degrees pointed it in the correct direction.
  Okay so what that means now is in pose mode I should be able to just grab this
  heel target and then just kind of move that around. You can see that that leg
  is just kind of following around and I can just kind of move that and then you
  can see the potential here I could just maybe animate the location of this and
