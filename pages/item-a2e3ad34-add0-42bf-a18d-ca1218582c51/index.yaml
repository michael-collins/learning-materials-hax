  slot="content"><p><em>From speech to text.</em></p><p><page-anchor
  target="#video-flBsgjlDYfk" value="0">0:00</page-anchor> Now we can add some
  inverse kinematics, or IK chains as they're called. Essentially what that
  enables you to do is to take, for instance, the foot and place it and have all
  of those rotations automatically calculated here. Forward kinematics is sort
  of what happens by default. You grab a bone and then as you rotate it, oops,
  we need to be in Pose Mode, as you rotate it, it's actually going to rotate
  all the way down there. forward, if you will. So inverse is sort of like those
  rotations are getting inherited backwards, but we have to set up a special
  modifier or a constraint system for that. So what we're going to do is go
  ahead and select the heel there. And if we actually turn on this mirror X.
  This should enable us to extrude out in edit mode a bone from both. I'm going
  to middle mouse click to constrain that. And this is going to be our target
  for the IK. And so we're going to also do one on the knee. So I'm going to do
  E to extrude, middle mouse click to make those go straightforward. And we want
  to actually</p><p><page-anchor target="#video-flBsgjlDYfk"
  value="77">1:17</page-anchor> disconnect the parents. So if we go ahead and
  select this and do option P, we can clear the parent for each of these. Okay,
  and we're actually going to take these and move them forward so they're not
  touching. And then we're going to go ahead and set up our IK constraint here
  on this lower leg bone that we created. So I'm going to go ahead and come down
  to well before we do that we have to go into pose mode which is where we add
  our IK bone constraint. So now we have this selected in pose mode go to add
  bone constraint here and we can choose inverse kinematics.</p><p><page-anchor
  target="#video-flBsgjlDYfk" value="135">2:15</page-anchor> And so we want to
  increase the chain length to 2, and you can see that there's a dotted line
  that connects the base of the heel, the foot, all the way up to the top of the
  leg. And now what we want to do is designate a target. So with this selected,
  we can choose the eyedropper and just choose this heel, or this IK target
  here. You could go ahead and actually, in edit mode, rename this. So let's go
  and rename that now. We're going to call this foot IK, and I'm just going to
  do period L so we can make sure that we know this is the left one. Okay, so
  let's go back here to pose mode.</p><p><page-anchor
  target="#video-flBsgjlDYfk" value="178">2:58</page-anchor> Now that this is
  properly named, it's just going to be a little bit easier to pick it out from
