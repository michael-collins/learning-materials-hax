          - header: Getting Started
            indent: 1
          - as: text
            title: Welcome to DMD 400
            html: >-
              <p>Hello! Welcome to the DMD 400, the capstone course for the DMD
              program. My name is Michael Collins, and I'm an Associate Teaching
              Professor for the Penn State Digital Multimedia Design program. I
              was a founding faculty member for the program and will be working
              with you this semester to realize your capstone projects.</p>

              <p>My professional and academic background is in illustration,
              interactive media, graphic design, photography and video
              production, 3D animation, web, product design, digital
              fabrication, and New Media exhibition art. My professional network
              extends into pretty much every creative field touching creative
              digital production, so if I don't know the answer to a question, I
              can point you to someone who does. I'm also a long time committee
              member for ACM SIGGRAPH, which hosts the premiere computing
              graphics conference on the planet, <a
              href="https://www.siggraph.org/current-conference">SIGGRAPH</a>
              and <a
              href="https://www.siggraph.org/current-asia-conference">SIGGRAPH
              Asia</a>. Please ask me more about this conference if you are
              looking for networking opportunities.&nbsp;</p>

              <p>The bar for the capstone is high. The course asks that you
              focus on the media or creative design fields of your interest to
              produce portfolio quality work. A successful capstone project
              demonstrates the creative capabilities and competencies you
              acquired during your time in the DMD program.</p>

              <p>This course provides a framework to help you successfully
              navigate the capstone project process, which is similar to the
              self-directed project you completed in DMD 300. While the course
              has little in the way of technical instruction, I am here to help
              you navigate and refine your skills and workflow as needed. Please
              take advantage of my office hours, feedback, and the resources I
              provide throughout the semester.</p>

              <p>I look forward to working with you! Also, connect on the
              following if you haven't already:</p>

              <p><strong>DMD Slack:</strong> <a
              href="https://dmd-program.slack.com">https://dmd-program.slack.com</a></p>

              <p><strong>DMD Alumni Group on LinkedIn:</strong> <a
              href="https://www.linkedin.com/groups/12200300/">https://www.linkedin.com/groups/12200300/</a></p>

              <p>Best,<br>Michael</p>
