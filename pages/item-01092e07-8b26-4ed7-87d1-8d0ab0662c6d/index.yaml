          - header: Communication
            indent: 0
          - as: text
            title: Communication Standards and Professional Etiquette
            html: >-
              <p><strong>Emailing your professor or industry
              professionals:</strong></p>

              <p>I've been called a lot of things in emails. "Yo", "bud", " Dr.
              Collins," and "Dr. Michael" (I do not have a PhD). Often, I am not
              addressed by name, sometimes all I get is a "hello." While I
              personally tend to communicate fairly informally, communications
              are always professional. So please address me as Mike, Michael,
              Mr. Collins or Professor Collins. I typically go by Michael when
              corresponding with email, and so I tend to address students by
              their first names as well.</p>

              <p>When addressing someone via email that you don't typically
              communicate with, the best rule of thumb is to start formally (IE
              - with most respect), and match the tone and formality of the
              email response you get. For those who are unsure, an email
              contains three parts. The salutation (with accompanying name), the
              body, and the closing/signature. For example, you could write:</p>


              <p>Hello Michael,</p>

              <p>I have a question about [here you will provide specific
              information about he purpose of the communication].</p>

              <p>Thank you,<br>Your Name</p>


              <p>If you get an email, and someone (myself included) calls you
              the wrong name, you should diplomatically correct them. After all,
              it's your name. In this course, your online communication will
              likely take the form of emails, journal posts, and video. As these
              online communications are considered part of a college course,
              your writing style should conform to the rules of Standard
              English.</p>

              <p>Accordingly, you should:</p>

              <ul>

              <li>use the spell check feature prior to sending an email or
              post</li>

              <li>refrain from using emoticons, slang, or instant texting
              terms</li>

              <li>never resort to using vulgar language&nbsp;</li>

              <li>Don’t use all capital letters as it gives the impression
              you’re SHOUTING!</li>

              <li>Be professional and respectful — treating someone in a
              courteous and respectful manner encourages them to respond to you
              in a similar way.</li>

              </ul>

              <p><strong>Communicating with industry professionals, project
              clients, and other professors</strong></p>

              <p>All projects require a project advisor. This is often an
              industry professional or other faculty members. If you are having
              trouble finding a project advisor, I will do my best to connect
              you with someone relevant to your project type that can assist you
              with feedback, direction, and sometimes technical help. Please be
              respectful, communicative, and thankful as these advisors are not
              paid and are donating their time to help your project be as
              successful as possible. Some are good friends and most are
              professional acquaintances from my network. As such, your actions
              reflect directly on me.<strong></strong></p>

              <p>If you are doing a client-based project and will be interacting
              with a small business owner, please keep in mind that you are
              representing Penn State University during this process. You may
              experience clients that provide vague information, vague feedback,
              or are challenging to work with in some other way. It is your job
              as the designer (a current or aspiring professional) to handle
              these situations appropriately and diplomatically as they are
              common to most client-based work.</p>

              <p><strong>Here are some suggestions for contributing to online
              discussions:</strong></p>

              <ul>

              <li><strong>Good Attitude!</strong> Operate from the perspective
              that everyone in the discussion is participating with the goal to
              create a lively, interesting conversation.</li>

              <li><strong>Be Prepared.</strong> Be prepared to participate in
              the discussions—do the readings, review media that may be assigned
              and think about the issues or questions that have been posted in
              relationship to the discussion topic.</li>

              <li><strong>Ask Nicely.</strong> If you are not certain about the
              meaning of a comment, ask the original poster to elaborate or
              clarify what they’ve written.</li>

              <li><strong>Be Respectful.</strong> Recognize and value the
              experiences, abilities, and knowledge each person brings to class.
              Acknowledge the diverse perspectives and viewpoints of class
              members.</li>

              <li><strong>Disagree with ideas, not classmates.</strong> Ideas
              are presented for discussion and that sometimes includes pointed
              disagreement. When disagreeing with the ideas of another, be sure
              that your comments are directed toward his or her ideas and not
              the actual person. Never use personal attacks to express your
              disagreement.</li>

              <li><strong>Use humor carefully.</strong> Be cautious about
              injecting humor into your comments and remember that it’s easy to
              misinterpret humor in written language. In face to face
              conversations, our body language and the inflections of our voices
              help others discern when we are being humorous.</li>

              <li><strong>Reference who you are responding to.</strong> A brief
              summary or reference quote from the comment you are responding
              will help provide a context for your comment and identify to whom
              who you are responding.</li>

              <li><strong>Don’t just jump into a long thread</strong>; review
              earlier comments and postings so that you do not simply repeat
              what others have written.</li>

              <li><strong>Post your responses under the appropriate heading or
              thread.</strong></li>

              <li><strong>Cite your References.</strong> Acknowledge the source
              of your information and provide links to online material that
              might help expand or illustrate your points.</li>

              <li><strong>Contribute enthusiastically</strong> and diligently to
              online conversations but don’t monopolize or hijack them. Since
              reading other’s comments or articles can be very time consuming,
              try to be succinct and brief.</li>

              </ul>
