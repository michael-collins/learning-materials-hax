content: >
  <p><img src="files/dd-process-discover-1200px@2x.png" alt="Double Diamond
  Discover Phase graphic"></p>

  <p>Field research is a central part of the human-centered design process. You
  will now practice field research by finding and interviewing a person who will
  become your target user.</p>

  <h2>Materials</h2>

  <ol>

  <li>Journal</li>

  <li>Pencil or pen</li>

  <li>Access to a communication device (computer or phone)</li>

  </ol>

  <h2>Instructions guide</h2>

  <h3>Step 1: Interview Setup</h3>

  <p>The purpose of this interview is to identify some ways people find, create,
  or instill happiness and delight. Set up an interview. It can be a family
  member, a friend, a colleague at work, a student, etc. However, it would be a
  more compelling inverview and project if you selected an interviewee with a
  different background or lifestyle from your own to broaden your
  perspective.</p>

  <p>Ensure that you have at least an hour of time. The interview can be
  in-person, over the phone, or via video conversation. Please do not send a
  list of questions to your interviewee, as you will need to tailor the
  interview questions during the conversation. If you intend to record the
  interview (not required) you must obtain the permission of the
  interviewee.</p>

  <h3>Step 2: Conduct the Interview</h3>

  <p>Start the interview by asking your participant about their daily routine.
  Try to find something they do or experience every day that they find calming,
  stimulating, fun, or puts them in the "flow state."</p>

  <p><strong>Interview Tip:</strong> Try to have a natural conversation. Laugh,
  joke, and don't rely solely on the example questions below. Give your subject
  plenty of time to respond, awkward pauses may result in valuable responses if
  you're patient.</p>

  <h4>Example questions</h4>

  <p><strong>Delights:</strong></p>

  <ol>

  <li>Tell me about your day today or a typical day in your life.

  <ol>

  <li>In one or two words, what does it generally feel like?</li>

  <li>Why is that?</li>

  </ol>

  </li>

  <li>What is something you currently experience every day, however small or
  insignificant, that brings a bit of delight or happiness?

  <ol>

  <li>Can you think of why it has this affect?</li>

  </ol>

  </li>

  <li>What is an activity, object, or experience you find to be special,
  important, genuine, or meaningful?</li>

  <li>Is there something that you wish you were better at doing?

  <ol>

  <li>What is it about skill that's so appealing? (this should be a specific
  thing, see <strong>Laddering - Five 'Why?'s</strong>)</li>

  </ol>

  </li>

  </ol>

  <p><strong>Challenges:</strong></p>

  <ol>

  <li>What challenges, frustrations, or frictions do you endure every day, week,
  or year?

  <ol>

  <li>Why is it challenging? ("it" should be a specific thing, see
  <strong>Laddering - Five 'Why?'s)</strong></li>

  </ol>

  </li>

  <li>If you could go back to childhood and begin your life again, what would
  you want to do as an adult?

  <ol>

  <li>Why did you choose this answer?</li>

  </ol>

  </li>

  <li>What is some advice you would tell your younger self?

  <ol>

  <li>Why this advice? ("it" should be a specific thing, see <strong>Laddering -
  Five 'Why?'s</strong>)</li>

  </ol>

  </li>

  </ol>

  <p><strong>Core Values</strong></p>

  <ol>

  <li>What is a place or type of space that has special meaning to you? (At
  home, or elsewhere)

  <ol>

  <li>What details can you recall most clearly? Describe them.</li>

  </ol>

  </li>

  <li>What is a group, culture, or "tribe" that you strongly identify with?

  <ol>

  <li>How do your participate in, or show your connection to, that group?</li>

  </ol>

  </li>

  </ol>

  <p><strong>Original Questions</strong></p>

  <p>Prepare three or more original questions that you will ask your
  subject.</p>

  <ol>

  <li>_______________________________?</li>

  <li>_______________________________?</li>

  <li>_______________________________?</li>

  </ol>

  <h4>Laddering - Five 'Why?'s</h4>

  <p>Laddering is a technique developed in the 1960s to help clinical
  psychologists uncover core values and beliefs. If your participant has many
  responses from the previous step, focus on one response. Ask your participant
  <strong>why</strong>. Asking why helps us to better understand an ambiguous
  issue and gets to a more emotional aspect of a problem. After they respond,
  ask why again. Repeat this until you have asked why five times. Asking five
  times is important because core issues will start to emerge around four or
  five levels deep. Ask about their responses specifically to avoid horizontal
  questions. For example, "Why else didn't you get your homework done?" is a
  horizontal question. "Why didn't you have enough time to complete the
  assignment?" is a deeper question.</p>

  <h3>Step 3: Recording responses</h3>

  <ul>

  <li>Record the interviewee's responses in your journal. You don't need to
  write everything they say. Try to capture the key insights.</li>

  <li>Make a note of any responses that led to a deeper understanding of what
  motivates this person?</li>

  <li>The interview is about better understanding a potential user's problems.
  Try not to make reference to the project during the questions that may lead
  the interviewee to attempt to think of solutions.</li>

  </ul>

  <h2>Instructions</h2>

  <ol>

  <li>Set up the interview</li>

  <li>Ask questions to find key issue(s)</li>

  <li>Record the interviewee's responses in your journal</li>

  </ol>

  <h2>Post work</h2>

  <p>Use the file format indicated in each step. You must obtain prior approval
  to deviate from these upload requirements. Please check that your work has
  uploaded properly.</p>

  <ol>

  <li>Submit an image of your journal notes in <code>.jpg</code> or
  <code>.png</code> format.</li>

  </ol>

