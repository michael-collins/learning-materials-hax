content: >
  <p>In this exercise, students will practice correcting a character model's
  edge-flow and set up an armature rig to pose the character in a sitting
  position.</p>

  <oer-iframe
  src="https://youtube.com/embed/videoseries?list=PL-V2nChTadrX4lOk4gv0XjdSVpB31qOtJ"
  title="Introduction to rigging Tutorial"></oer-iframe>

  <h2>Learning Objectives</h2>

  <ol>

  <li>Practice setting up Inverse Kinematics (IK) bone constraints.</li>

  <li>Practice modeling to good edge flow for deformation.</li>

  <li>Become familiarized with creating and binding a character armature.</li>

  </ol>

  <h2>Instructions</h2>

  <ol>

  <li>Watch the rigging character rigging tutorials.</li>

  <li>Download the base mesh model FBX file.</li>

  <li><strong>File</strong> → <strong>Import</strong> the FBX file into a new
  Blender scene.</li>

  <li>Scale up the model.</li>

  <li>Model the T-pose for armature deformation. Do not model the character into
  a sitting pose, it must be modeled in a T pose, and posed in a seated position
  via the armature rig.</li>

  <li>Watch the demo video series to learn how to add and create good edge flow
  for deformation. Add geometry to articulate the head, torso, legs, and
  arms.</li>

  <li><strong>Object</strong> → <strong>Apply</strong> all transforms including
  scale, rotation, and location.</li>

  <li>Create an armature with bones for the pelvis, lower back, upper back,
  lower legs, upper legs, feet, shoulders, arms, hands, neck, and head. Name and
  number them for your reference. You must put a “.L” or “.R” at the end of your
  bones for them to symmetrize properly.</li>

  <li>Parent (bind) the mesh to the armature. Do this by selecting the mesh
  first, select the armature, and then press ‘CTRL-P,’ and choose “with
  automatic weights.” If you do not see this option, you have selected in the
  reverse order.</li>

  <li>If you are getting any unwanted deformation, watch the weight paint
  tutorials and use the weight painting tool to clean up the vertex
  weights.</li>

  <li>Pose the biped to be in a sitting pose on a prop like a bench or
  chair.</li>

  <li>Save as <code>LASTNAME-rigging.blend</code> and upload to the submission
  dropbox.</li>

  <li>Double check that you’ve included all files and that your .zip file can be
  downloaded and opened.</li>

  </ol>

