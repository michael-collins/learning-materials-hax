content: >-
  <p>With the skeleton built, the mesh needs to follow it. In this short part
  you'll parent (bind) the character mesh to the armature with automatic
  weights, so each bone moves the part of the mesh around it. Then you'll switch
  to Pose Mode, rotate some bones to test the bind, and reset the pose. You'll
  need the character mesh and the named, symmetrized armature from the last
  part. The video uses Blender 2.90.</p>


  <oer-video id="video-UiBN8K89W64"
  src="https://www.youtube.com/watch?v=UiBN8K89W64" title="Rigging Part 06 -
  Parenting the Mesh" credit="Michael Collins"
  credit-url="https://www.youtube.com/channel/UCp1cLW7rry_NKRhcH8bPfGg"></oer-video>


  <h2>Bind the mesh</h2>

  <ol>
    <li>
      <p><strong>Select the mesh, then the armature.</strong> <page-anchor target="#video-UiBN8K89W64" value="1">0:01</page-anchor> In <em>Object Mode</em>, select the mesh first, then <kbd>Shift</kbd>-click the armature so it's selected second. The order matters. Selecting both can be fiddly; wireframe shading may make it easier <page-anchor target="#video-UiBN8K89W64" value="14">0:14</page-anchor>, or click them in the Outliner <page-anchor target="#video-UiBN8K89W64" value="20">0:20</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Parent with automatic weights.</strong> <page-anchor target="#video-UiBN8K89W64" value="31">0:31</page-anchor> Press <kbd>Ctrl</kbd> <kbd>P</kbd> and, under <em>Armature Deform</em>, choose <em>With Automatic Weights</em>. This parenting is called a bind.</p>
      <figure><img src="files/parenting-the-mesh-to-the-armature-t0048.0.jpg" alt="The character in wireframe with its armature inside, the mesh and the armature both selected. The Set Parent To menu is open, with Armature Deform highlighted and its options With Empty Groups, With Envelope Weights and With Automatic Weights below it."><figcaption><p>Ctrl P → Armature Deform → With Automatic Weights.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Check the bind.</strong> <page-anchor target="#video-UiBN8K89W64" value="56">0:56</page-anchor> Select the mesh (pCube1 in the video): in the Outliner it's now under the armature, and in its <em>Modifier Properties</em> there's an <em>Armature</em> modifier pointing at the armature <page-anchor target="#video-UiBN8K89W64" value="67">1:07</page-anchor>.</p>
      <figure><img src="files/parenting-the-mesh-to-the-armature-t0068.8.jpg" alt="The mesh selected in wireframe. The Outliner shows pCube1 nested under Armature, and the Modifier Properties list a Subdivision Surface modifier followed by an Armature modifier with Object set to Armature and Bind to Vertex Groups turned on."><figcaption><p>The mesh is parented to the armature and has an Armature modifier.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Test it in Pose Mode</h2>

  <ol>
    <li>
      <p><strong>Switch the armature to Pose Mode.</strong> <page-anchor target="#video-UiBN8K89W64" value="72">1:12</page-anchor> Select the armature and choose <em>Pose Mode</em> from the mode menu at the top left of the viewport (instead of Edit Mode). Pose Mode is where you pose the skeleton.</p>
    </li>
    <li>
      <p><strong>Rotate a bone.</strong> <page-anchor target="#video-UiBN8K89W64" value="82">1:22</page-anchor> Select a bone and press <kbd>R</kbd> to rotate it. Automatic weights have linked the vertices to the bones: each bone moves the vertices around it, and the bones that are its children, with their vertices, follow along <page-anchor target="#video-UiBN8K89W64" value="93">1:33</page-anchor>. You can't move bones apart the way you can in Edit Mode <page-anchor target="#video-UiBN8K89W64" value="112">1:52</page-anchor>. Undo with <kbd>Ctrl</kbd> <kbd>Z</kbd> (<kbd>Cmd</kbd> <kbd>Z</kbd> on a Mac).</p>
      <figure><img src="files/parenting-the-mesh-to-the-armature-t0090.8.jpg" alt="Pose Mode in wireframe. The lowerback bone, highlighted in blue, has been rotated, and the upper body, arms and head lean over with it while the legs stay put. The sidebar shows its rotation as a quaternion: W 0.980, X 0.033, Y 0.070, Z 0.181."><figcaption><p>Rotating the lowerback bone bends the mesh, and everything above it follows.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Zero a bone's rotation by hand.</strong> <page-anchor target="#video-UiBN8K89W64" value="117">1:57</page-anchor> To put a bone back, with it selected, open the sidebar's <em>Transform</em> and set the rotation's X, Y and Z to 0 and W back to 1 <page-anchor target="#video-UiBN8K89W64" value="130">2:10</page-anchor>. That resets it.</p>
      <figure><img src="files/parenting-the-mesh-to-the-armature-t0136.4.jpg" alt="Pose Mode with the upper body bent sideways. In the sidebar, the rotation fields X, Y and Z of the selected lowerback bone are being edited together, with W 0.851, ready to type 0."><figcaption><p>Editing the bone's rotation: X, Y and Z to 0, and W to 1.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Test a leg.</strong> <page-anchor target="#video-UiBN8K89W64" value="150">2:30</page-anchor> In solid shading, rotate a leg bone on X to bend the leg, and check that no vertices elsewhere in the mesh move with it <page-anchor target="#video-UiBN8K89W64" value="172">2:52</page-anchor>. Automatic weights do a pretty good job out of the box, but every once in a while something will be out of place.</p>
      <figure><img src="files/parenting-the-mesh-to-the-armature-t0170.8.jpg" alt="The solid-shaded character in Pose Mode with one knee raised: the thigh is bent forward and the shin hangs down, and the mesh bends smoothly at the hip and knee while the rest of the body stays still."><figcaption><p>A leg bent at the hip and knee: a quick check of the bind.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Switch modes and clear the pose</h2>

  <ol>
    <li>
      <p><strong>Use the shortcuts to switch modes.</strong> <page-anchor target="#video-UiBN8K89W64" value="192">3:12</page-anchor> With the armature selected, <kbd>Ctrl</kbd> <kbd>Tab</kbd> switches between Object Mode and Pose Mode, and <kbd>Tab</kbd> between Object Mode and Edit Mode. A pose stays on the mesh in Object Mode.</p>
    </li>
    <li>
      <p><strong>Clear rotations.</strong> <page-anchor target="#video-UiBN8K89W64" value="212">3:32</page-anchor> In Pose Mode, press <kbd>A</kbd> to select all the bones, then <kbd>Alt</kbd> <kbd>R</kbd> (<kbd>Option</kbd> <kbd>R</kbd> on a Mac) to reset their rotations.</p>
    </li>
    <li>
      <p><strong>Clear locations.</strong> <page-anchor target="#video-UiBN8K89W64" value="229">3:49</page-anchor> In Pose Mode you can grab a disconnected bone with <kbd>G</kbd> and move it, which smears the mesh. To clear any moves like that, press <kbd>Alt</kbd> <kbd>G</kbd> <page-anchor target="#video-UiBN8K89W64" value="241">4:01</page-anchor>.</p>
      <figure><img src="files/parenting-the-mesh-to-the-armature-t0242.0.jpg" alt="Pose Mode with the shoulder.R bone, highlighted in blue, being moved up and away from the body with G, stretching the arm and shoulder of the mesh with it. The header shows the distance moved."><figcaption><p>Moving a disconnected bone with G smears the mesh. Alt G clears it.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Wrap-up</h2>

  <p>The mesh is bound to the armature with automatic weights, and you can pose
  it in Pose Mode and clear the pose with <kbd>Alt</kbd> <kbd>R</kbd> and
  <kbd>Alt</kbd> <kbd>G</kbd>. Next you'll add IK constraints to make posing the
  arms and legs easier.</p>

