content: >
  <oer-draft note="Suggested questions, written from the week's objectives.
  Check them, then Publish.">

  <p>Check your understanding of laser cutting. Your answers aren't
  recorded.</p>

  <multiple-choice question="What is kerf?" single-option="" randomize="">
    <input type="checkbox" value="The width of material the laser removes along a cut" data-correct="true">
    <input type="checkbox" value="The depth of an engraved area">
    <input type="checkbox" value="A gap left between parts on purpose">
    <input type="checkbox" value="The speed setting for vector cuts">
  </multiple-choice>

  <multiple-choice question="Why is PVC (vinyl) on every laser cutter's list of
  forbidden materials?" single-option="" randomize="">
    <input type="checkbox" value="Cutting it releases chlorine gas, which harms people and corrodes the machine" data-correct="true">
    <input type="checkbox" value="It is too hard for the laser to cut">
    <input type="checkbox" value="It can't be engraved">
    <input type="checkbox" value="It warps the bed">
  </multiple-choice>

  <true-false-question question="A press-fit slot should be drawn exactly as
  wide as the material is thick.">
    <input type="checkbox" value="False" data-correct="true">
    <input type="checkbox" value="True">
  </true-false-question>

  <self-check title="Think it through">
    <p slot="question">Your file cuts some lines and engraves others. How does the laser know which is which?</p>
    <p>From the drawing's conventions: hairline strokes in the cut colour are cut, other stroke colours are scored, and filled shapes or images are engraved. The studio's handout gives its exact colours and line weight.</p>
  </self-check>

  </oer-draft>
