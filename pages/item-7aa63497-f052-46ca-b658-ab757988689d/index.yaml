  <h2>Course instructor</h2>

  <p><img src="files/collins-sm-bw@2x.jpg" alt="Michael Collins"></p>

  <p>Michael Collins

  <strong>E-Mail:</strong> msc227@psu.edu

  <strong>Twitter:</strong> @_mike_collins</p>

  <p>Michael Collins joined the Penn State School of Visual Arts in 2012 where
  he teaches 3D animation, digital design, and digital fabrication. He is the
  Lead Faculty Coordinator for the Digital Multimedia Design program and is the
  primary course author for DMD 100. His research interests in open-source
  technology and sustainable design unite around online education, where he
  works to identify and solve contemporary issues facing online teaching and
  learning. Long-term project collaborations include the ELMS Learning Network
  project and the OERSchema project. Michael has previously worked on projects
  for the NFL, BMW Guggenheim Lab in NYC, and as freelance product designer. He
  has attended, presented at, and helped organize a variety of international
  design, technology, and education conferences and has been a long-time
  SIGGRAPH subcommittee volunteer.</p>
