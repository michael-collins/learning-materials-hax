content: >
  <p>In this exercise, students will practice modeling, rigging, and animating a
  human.</p>

  <oer-iframe
  src="https://youtube.com/embed/videoseries?list=PL-V2nChTadrWPKLLkM8oVibJ1aKHivoNl"
  title="Rigging a human Tutorial"></oer-iframe>

  <h2>Learning Objectives</h2>

  <ol>

  <li>Practice setting up Inverse Kinematics (IK) bone constraints.</li>

  <li>Practice modeling to good edge flow for deformation.</li>

  <li>Become familiarized with creating and binding an armature using the Rigify
  add-on.</li>

  <li>Become familiarized with vertex weight painting workflows</li>

  <li>Practice keyframe animation</li>

  </ol>

  <h2>Instructions</h2>

  <ol>

  <li>Watch the tutorials.</li>

  <li>Create a polygonal model a human-like character from scratch (two arms,
  two legs, and a head). You may use a model you've previously created if you
  wish.</li>

  <li>Use the Rigify add-on to add a human rig.</li>

  <li>Bind the character model to the rig.</li>

  <li>Adjust and paint vertex weights to create pleasing deformation as
  needed.</li>

  <li>Create an animated walk cycle for the character. (Do not use Mixamo or
  download a pre-made animation)</li>

  <li>Set up a camera to frame the shot.</li>

  <li>To create a video of the viewport’s animation, save the file and set the
  render settings output folder to the project folder. Under <strong>File
  Format</strong>, choose <strong>FFMpeg Video</strong>, change the encoding
  format to <strong>MPEG-4</strong>.</li>

  <li>Choose <strong>View</strong> ⟶ <strong>Viewport Render Animation</strong>
  to create the animation.</li>

  <li>Save as <code>LASTNAME-human-rig-animation.zip</code> and upload to the
  submission dropbox.</li>

  <li>Double check that you’ve included all files and that your .zip file can be
  downloaded and opened. This should include:

  <ul>

  <li><code>.blend</code> file</li>

  <li><code>.mp4</code> video file</li>

  </ul>

  </li>

  </ol>

  <h2>Grading Rubric</h2>

  <oer-rubric rubric-id="exercise"></oer-rubric>
