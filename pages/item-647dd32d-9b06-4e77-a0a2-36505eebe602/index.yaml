  <p><img src="files/dd-process-deliver-1200px@2x.png" alt="Double Diamond
  Deliver Phase graphic"></p>

  <p>Let's wrap up the project with one more round of iteration to refine your
  work.</p>

  <h2>Instructions:</h2>

  <ol>

  <li>Make changes based on the peer and instructor feedback. Submit only after
  recieving feedback and iterating upon your work.</li>

  <li>Write a description of the changes made to the prototype.</li>

  </ol>

  <h2>Submission</h2>

  <p>Use the file format indicated in each step. You must obtain prior approval
  to deviate from these upload requirements. Please check that your work has
  uploaded properly.</p>

  <ol>

  <li>Post a public link to the prototype.</li>

  <li>write a change log with all changes that were made.</li>

  </ol>
