content: >-
  <p>With the sides, braces and cushions in place, the Airline Chair needs a few
  smaller parts to hold it together: a thin rod where the seat meets the back,
  an arched rail across the front of the seat, a second rod at the front, and
  small wooden hooks underneath that hold that rod. In this part you'll model
  each as its own object, use a <em>Mirror</em> modifier to keep the rail and
  hooks symmetrical, and see why the order of modifiers matters. You'll need the
  chair from Parts 2 to 5 and the reference image. The video uses Blender
  2.83.</p>


  <oer-video id="video-OMIJZKwDJkY"
  src="https://www.youtube.com/watch?v=OMIJZKwDJkY" title="Modeling the Airline
  Chair – Part 6: Details" credit="Michael Collins"
  credit-url="https://www.youtube.com/channel/UCp1cLW7rry_NKRhcH8bPfGg"></oer-video>


  <h2>The rod at the back of the seat</h2>

  <ol>
    <li>
      <p><strong>Add a six-sided cylinder.</strong> <page-anchor target="#video-OMIJZKwDJkY" value="0">0:00</page-anchor> Press <kbd>Shift</kbd>+<kbd>A</kbd> and choose <em>Mesh → Cylinder</em>. In the <em>Add Cylinder</em> panel at the bottom left, set <em>Vertices</em> to 6 <page-anchor target="#video-OMIJZKwDJkY" value="12">0:12</page-anchor>. Rotate it 90 degrees on Y (<kbd>R</kbd>, <kbd>Y</kbd>, 90) so it lies across the chair.</p>
    </li>
    <li>
      <p><strong>Place it where the cushions meet.</strong> <page-anchor target="#video-OMIJZKwDJkY" value="24">0:24</page-anchor> In the side view, with X-ray on, press <kbd>G</kbd> to move it down to the joint between the seat and the back, and <kbd>S</kbd> to scale it down. It's a thin piece, but that must be how they hook together <page-anchor target="#video-OMIJZKwDJkY" value="43">0:43</page-anchor>. Then scale it along X so it spans the chair <page-anchor target="#video-OMIJZKwDJkY" value="55">0:55</page-anchor>.</p>
      <figure><img src="files/adding-the-details-t0045.0.jpg" alt="Right Orthographic view over the reference photo: a small six-sided cylinder, seen end-on, sits at the joint where the leather seat and back cushions meet, above the wooden runner. The Resize panel shows a scale of 0.196 on all axes."><figcaption><p>The rod, end-on, where the seat and back meet.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Hold its ends with an inset.</strong> <page-anchor target="#video-OMIJZKwDJkY" value="65">1:05</page-anchor> Add a couple of edge loops near the ends (<kbd>Ctrl</kbd>+<kbd>R</kbd>, scroll up for two) and scale them apart along X <page-anchor target="#video-OMIJZKwDJkY" value="71">1:11</page-anchor>. Press <kbd>3</kbd> for face select, select both end faces and press <kbd>I</kbd>: Inset scales both of them in together <page-anchor target="#video-OMIJZKwDJkY" value="82">1:22</page-anchor>.</p>
      <figure><img src="files/adding-the-details-t0091.8.jpg" alt="Edit Mode, close on the six-sided rod with X-ray on: both end faces are selected, and the header shows the Inset tool's options (Thickness, Depth, Outset, Boundary, Individual) while it's being dragged."><figcaption><p>Insetting both end faces at once.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Split the end n-gons, if you like.</strong> <page-anchor target="#video-OMIJZKwDJkY" value="95">1:35</page-anchor> The face in the middle of each end is an n-gon (more than four sides), but because it's flat it doesn't really matter. If it bothers you, press <kbd>K</kbd> for the <em>Knife</em> tool, cut across it, and press <kbd>Enter</kbd>: now it's two quads <page-anchor target="#video-OMIJZKwDJkY" value="112">1:52</page-anchor>.</p>
      <figure><img src="files/adding-the-details-t0110.4.jpg" alt="Close on the end of the rod, a hexagon with a smaller inset hexagon in it. The K key is shown at the bottom, and the status bar lists the Knife tool's controls."><figcaption><p>The Knife tool (<kbd>K</kbd>) splitting the inset end into two quads.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Smooth it.</strong> <page-anchor target="#video-OMIJZKwDJkY" value="130">2:10</page-anchor> Add a <em>Subdivision Surface</em> modifier and set it to 3: the rod keeps its shape well.</p>
    </li>
  </ol>


  <h2>The arched front rail</h2>

  <ol>
    <li>
      <p><strong>Add a cube and model it upright.</strong> <page-anchor target="#video-OMIJZKwDJkY" value="140">2:20</page-anchor> Press <kbd>Shift</kbd>+<kbd>A</kbd> and add a cube for the arched piece that spans from one side of the chair to the other, under the front of the seat. It's tilted forward a little, but model it straight up and down first and rotate it later <page-anchor target="#video-OMIJZKwDJkY" value="154">2:34</page-anchor>. If you see odd shading, turn off the wireframe and check the pieces are lined up <page-anchor target="#video-OMIJZKwDJkY" value="167">2:47</page-anchor>.</p>
      <figure><img src="files/adding-the-details-t0160.8.jpg" alt="Right Orthographic view over the reference photo: a new cube, Cube.005, scaled down to a narrow upright block at the front of the seat, just behind the side's front leg. The Resize panel shows Y 0.363."><figcaption><p>The front rail as an upright block, before it's shaped.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Keep it a separate object.</strong> <page-anchor target="#video-OMIJZKwDJkY" value="178">2:58</page-anchor> Don't extrude it out of the side: model things the way they're built in real life, and this is a separate piece.</p>
    </li>
    <li>
      <p><strong>Shape the arch.</strong> <page-anchor target="#video-OMIJZKwDJkY" value="185">3:05</page-anchor> Add some loops across it. In the photo, it's flat at the bottom at each end. In vertex mode, move the vertices into an arch <page-anchor target="#video-OMIJZKwDJkY" value="205">3:25</page-anchor>. Back in Object Mode, add a <em>Subdivision Surface</em> modifier to see what it needs: here, a loop on each side <page-anchor target="#video-OMIJZKwDJkY" value="229">3:49</page-anchor>.</p>
      <figure><img src="files/adding-the-details-t0225.0.jpg" alt="Front Orthographic view of the front rail, outlined in orange between the chair's sides: its bottom edge rises from flat ends to a peak in the middle, an arch. The Add Modifier menu is open."><figcaption><p>The rail's bottom edge moved into an arch.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Make it symmetrical with a Mirror modifier.</strong> <page-anchor target="#video-OMIJZKwDJkY" value="235">3:55</page-anchor> To make both halves exactly the same, delete the faces of one half and add a <em>Mirror</em> modifier: every edit on one side now happens on the other too. Use this whenever something should be perfectly symmetrical <page-anchor target="#video-OMIJZKwDJkY" value="250">4:10</page-anchor>.</p>
      <figure><img src="files/adding-the-details-t0271.0.jpg" alt="The front rail in Edit Mode with only its right half as real geometry; the Mirror modifier draws the left half. In the modifier stack, Subdivision Surface is first and Mirror is below it, and a seam shows down the middle of the smoothed rail."><figcaption><p>Half the rail, mirrored. With Mirror below Subdivision Surface, there's a seam in the middle.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Move the Mirror above the Subdivision Surface.</strong> <page-anchor target="#video-OMIJZKwDJkY" value="260">4:20</page-anchor> There's a seam down the middle where it should be smooth. Modifiers run from the top of the stack down, so move the <em>Mirror</em> modifier above the <em>Subdivision Surface</em>: it merges the vertices in the middle first, and then the whole rail is smoothed as one <page-anchor target="#video-OMIJZKwDJkY" value="274">4:34</page-anchor>.</p>
      <figure><img src="files/adding-the-details-t0328.8.jpg" alt="The front rail in Edit Mode, seen from the front, with Mirror now first in the modifier stack and Subdivision Surface below it. Merge is ticked in the Mirror modifier, and the rail is smooth across the middle."><figcaption><p>Mirror first, then Subdivision Surface: no seam.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Refine and thin it.</strong> <page-anchor target="#video-OMIJZKwDJkY" value="280">4:40</page-anchor> In the side view, add an edge loop at the top, and another where it needs one. It's a much thinner piece than modeled so far, so make it thinner <page-anchor target="#video-OMIJZKwDJkY" value="305">5:05</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Rotate it and apply the mirror.</strong> <page-anchor target="#video-OMIJZKwDJkY" value="320">5:20</page-anchor> Rotate it forward into place. Then you can apply the <em>Mirror</em> modifier: the rail becomes one piece of geometry, all symmetrical <page-anchor target="#video-OMIJZKwDJkY" value="335">5:35</page-anchor>.</p>
      <figure><img src="files/adding-the-details-t0340.0.jpg" alt="The chair in X-ray from the front corner with the arched front rail under the seat. Its rotation is X 18.1 degrees in the sidebar, and the Mirror modifier is above the Subdivision Surface, ready to apply."><figcaption><p>The rail tilted forward 18.1°.</p></figcaption></figure>
    </li>
  </ol>


  <h2>The hooks underneath</h2>

  <ol>
    <li>
      <p><strong>Add a second rod.</strong> <page-anchor target="#video-OMIJZKwDJkY" value="350">5:50</page-anchor> The chair has little hooks underneath. You don't have to make them, but the video builds them quickly. Select the rod from earlier, press <kbd>Shift</kbd>+<kbd>D</kbd> to duplicate it, move it along Y to the front of the chair, then up <page-anchor target="#video-OMIJZKwDJkY" value="359">5:59</page-anchor>. To make it thicker without changing its length, scale it with <kbd>Shift</kbd>+<kbd>X</kbd>: that scales on every axis except X <page-anchor target="#video-OMIJZKwDJkY" value="385">6:25</page-anchor>.</p>
      <figure><img src="files/adding-the-details-t0390.8.jpg" alt="The duplicated rod, Cylinder.001, outlined in white as it's scaled, runs across the front of the chair under the front of the seat. The header reads Scale X 1.2795, Y 1.2795, Z 1.2795."><figcaption><p>A second rod across the front of the chair.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Start a hook from one face.</strong> <page-anchor target="#video-OMIJZKwDJkY" value="410">6:50</page-anchor> Add a cube and, in the side view, make it a small square just above the end of the new rod. Press <kbd>3</kbd> for face select: a dot marks the middle of each face, so you can see that you have only one face selected, and be confident an extrude will work properly <page-anchor target="#video-OMIJZKwDJkY" value="449">7:29</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Extrude around the rod.</strong> <page-anchor target="#video-OMIJZKwDJkY" value="455">7:35</page-anchor> Press <kbd>E</kbd> to extrude the face, then rotate it and scale it down only along Y. Extrude again, switch to vertex select to improve the shape <page-anchor target="#video-OMIJZKwDJkY" value="476">7:56</page-anchor>, then back to faces for a final extrude: a wooden hook that wraps under the rod <page-anchor target="#video-OMIJZKwDJkY" value="509">8:29</page-anchor>.</p>
      <figure><img src="files/adding-the-details-t0500.4.jpg" alt="Right Orthographic view in Edit Mode, close on the hook, Cube.006: a chain of four-sided faces extruded down and around the circular end of the rod. The Extrude Region and Move panel shows Orientation Normal."><figcaption><p>Extruding one face at a time to bend the hook around the rod.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Add supporting edges and smooth it.</strong> <page-anchor target="#video-OMIJZKwDJkY" value="509">8:29</page-anchor> Add two supporting loops, and one at the top to hold its shape. Add a <em>Subdivision Surface</em> modifier <page-anchor target="#video-OMIJZKwDJkY" value="531">8:51</page-anchor>. It should be a bit sharper, so in vertex mode, move edges closer together. Then choose <em>Shade Smooth</em> for the hook and the other new pieces <page-anchor target="#video-OMIJZKwDJkY" value="576">9:36</page-anchor>.</p>
      <figure><img src="files/adding-the-details-t0560.8.jpg" alt="The hook in Edit Mode in the 3D view: its cage of edges is outside the smoothed shape, with two edges at the bottom selected and being moved closer together. The Subdivision Surface modifier is at Viewport 3."><figcaption><p>Moving edges closer for a sharper hook.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Mirror it to the other side.</strong> <page-anchor target="#video-OMIJZKwDJkY" value="580">9:40</page-anchor> The hook's origin is at the center of the chair, so press <kbd>Tab</kbd>, turn on X-ray and move its geometry over to one side. Add a <em>Mirror</em> modifier: now there are two <page-anchor target="#video-OMIJZKwDJkY" value="602">10:02</page-anchor>. Move them in if they're too far apart. Adjust all of them together against the reference: here they moved forward, and the hook got bigger <page-anchor target="#video-OMIJZKwDJkY" value="628">10:28</page-anchor>. Then save your work.</p>
      <figure><img src="files/adding-the-details-t0670.4.jpg" alt="The finished chair in X-ray from the front corner: both sides, the back cushion and seat, the arched front rail, and the hooks below the seat. The hook object, Cube.006, has a Subdivision Surface and a Mirror modifier on X."><figcaption><p>The finished chair.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Wrap-up</h2>

  <p>The Airline Chair is modeled. In this part you inset faces, split an n-gon
  with the Knife tool, made a symmetrical part with a Mirror modifier above a
  Subdivision Surface in the stack, and built a hook by extruding a single face.
  The video doesn't claim it's exactly how the real chair is built, but with the
  reference image you have, it's a close match <page-anchor
  target="#video-OMIJZKwDJkY" value="617">10:17</page-anchor>.</p>

