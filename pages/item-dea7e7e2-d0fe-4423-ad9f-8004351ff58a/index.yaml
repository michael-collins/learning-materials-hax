content: >-
  <p>How FDM works; slicing; orientation, supports, overhangs, wall thickness,
  infill; materials (PLA/PETG); mesh hygiene (manifold, normals, STL/3MF); the
  print queue.</p><h2>Ideas</h2><p>Additive constraints as design constraints;
  the layer as material grain; anisotropy; tolerances for printed fits; the mesh
  as a representation.</p><h2>In class</h2><ul><li>Lecture (35
  min)</li><li>slicer demo (30 min)</li><li>print-iteration exercise starts (90
  min)</li></ul>
