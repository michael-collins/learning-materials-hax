content: >-
  <p>Students will document and execute a process that includes requirements,
  ideation, prototyping, and evaluation using relevant digital processes, tools,
  and techniques.</p>

  <h2>Measured by</h2>

  <ul>

  <li>A Proposal that defines scope, production pipeline, capabilities, and a
  week-by-week timeline.</li>

  <li>Documented advisor/mentor check-ins across the duration of the
  semester.</li>

  <li>Production Reports showing progress against the timeline.</li>

  <li>A Mid-production Video summarizing progress and remaining production
  tasks.</li>

  <li>A Project Document whose Production section clearly explains the methods
  and tools used.</li>

  </ul>

