content: >
  <oer-pathway layout="matrix"></oer-pathway>

  <p>This pathway is designed for aspiring animators who want to create
  narrative-driven short films using 3D animation. Students will progress from
  foundational CGI skills through character animation and compositing,
  developing the complete skillset needed to produce professional-quality
  animated shorts.</p>

  <h2>Who This Is For</h2>

  <p>This pathway is ideal for students aiming to work in:</p>

  <ul>

  <li>Animation studios</li>

  <li>Independent animation projects</li>

  <li>Film production companies</li>

  <li>Advertising and commercial animation</li>

  <li>Educational media production</li>

  </ul>

  <h2>Career Outcomes</h2>

  <p>Graduates will be prepared for roles including:</p>

  <ul>

  <li>Character Animator</li>

  <li>3D Animator</li>

  <li>Animation Director</li>

  <li>Storyboard Artist</li>

  <li>Animation Generalist</li>

  </ul>

  <h2>Examples</h2>

