  <h2>Book chapter:</h2>

  <p>Sen no Rikyu and the Paradox of Innovation, Good Design Tells the Truth (p.
  3-26) in Design and Truth by Robert Grudin</p>

  <h2>Writing prompt:</h2>

  <p>In this chapter, Grudin hypothesizes what good design is and what it should
  be. After reflecting on this reading, discuss a time where you had an
  overwhelmingly good experience or overwhelmingly negative experience with some
  aspect of design. This could include a product, service, or any other
  manifestation of design.</p>

  <h2>Writing guidelines:</h2>

  <ol>

  <li>Length: (150-300 words)</li>

  <li>Reference the chapter content whenever possible</li>

  <li>Cite sources where applicable.</li>

  <li>Check for spelling and grammar.</li>

  <li>Avoid generalizing language. Choose clear and concise wording.</li>

  </ol>
