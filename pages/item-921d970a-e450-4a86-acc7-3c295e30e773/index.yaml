content: >-
  <p>Students will conduct and synthesize research to inform the project,
  including primary and secondary research methods.</p>

  <h2>Measured by</h2>

  <ul>

  <li>A Project Document with a formal Research section and bibliography that
  situates the work, cites credible sources, and traces design
  requirements/decisions back to findings.</li>

  <li>Evidence of research activity and insight application in Production
  Reports.</li>

  <li>Alignment with course guidance on when to use primary vs. secondary
  research and on using scholarly sources for sensitive topics.</li>

  </ul>

