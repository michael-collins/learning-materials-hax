content: >
  <p>What Design and Truth Say about Each Other (p. 27-33) in <em>Design and
  Truth</em> by Robert Grudin.</p>

  <h2>Prompt</h2>

  <p>In this chapter, Grudin talks about the transition of design from close
  dialogue with natural systems to proliferating to the point of being totally
  separate from those systems. Grudin outlines 13 principles for good design to
  achieve harmony between nature and technological advancement. Do you agree
  with him?</p>

  <p>Describe specific examples of designs affirming or negating some of the
  principles.</p>

