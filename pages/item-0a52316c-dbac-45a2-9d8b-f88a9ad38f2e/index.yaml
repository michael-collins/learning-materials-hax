content: >
  <oer-pathway layout="matrix"></oer-pathway>

  <p>CGI Foundations is where every DART pathway starts. You will learn how 3D
  images are made, from polygons to pixels, and practice each stage of the
  pipeline twice: once on an airline chair and once on a room. The pathway ends
  with a project that brings modeling, texturing, lighting and rendering
  together in work of your own.</p>

  <h2>After Foundations</h2>

  <p>Foundations is the prerequisite for every other pathway. On your next run
  of DART 303, choose a pathway that fits your interests, or explore them now to
  plan ahead.</p>
