content: >-
  <p>In this part you'll animate a cube that rises and falls, a sphere that
  circles it twice, and a camera that follows it. Along the way you'll set
  keyframes, parent objects to an empty, shape curves in the Graph Editor, use
  linear interpolation so the animation loops seamlessly, and add a Track To
  constraint to the camera. You'll need Blender; the video uses Blender
  2.90.</p>


  <oer-video id="video-6MeFx1WL03Q"
  src="https://www.youtube.com/watch?v=6MeFx1WL03Q" title="Introduction to
  Animation – Part 1" credit="Michael Collins"
  credit-url="https://www.youtube.com/channel/UCp1cLW7rry_NKRhcH8bPfGg"></oer-video>


  <h2>The finished animation</h2>

  <ol>
    <li>
      <p><strong>See what you'll make.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="1">0:01</page-anchor> Play the finished scene: the camera follows the cube as it moves up and down, while the sphere circles it. The cube is keyframed at frames 1, 60 and 120 <page-anchor target="#video-6MeFx1WL03Q" value="37">0:37</page-anchor>. It's at 0, 0, 0 on frames 1 and 120, and 10 units up in Z on frame 60.</p>
      <figure><img src="files/keyframes-parenting-and-the-graph-editor-t0050.4.jpg" alt="The finished scene in Blender: the cube is selected at the centre with the sphere beside it, the cube's Location fields are yellow in the sidebar, and the Dope Sheet below shows keyframes at frames 1, 60 and 120, with End set to 120."><figcaption><p>The cube is keyframed at frames 1, 60 and 120.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>See how the sphere moves.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="68">1:08</page-anchor> The sphere is parented to an empty. Turn on X-ray to select the empty inside the cube <page-anchor target="#video-6MeFx1WL03Q" value="76">1:16</page-anchor>. The empty is keyframed at frames 1 and 120, and on frame 120 its Z rotation is 720°: two full turns <page-anchor target="#video-6MeFx1WL03Q" value="89">1:29</page-anchor>. A dashed line from the sphere to the empty shows the parent relationship <page-anchor target="#video-6MeFx1WL03Q" value="100">1:40</page-anchor>. The empty is in turn parented to the cube, so the empty, and the sphere with it, go up and down with the cube <page-anchor target="#video-6MeFx1WL03Q" value="109">1:49</page-anchor>.</p>
    </li>
  </ol>


  <h2>Set up the scene</h2>

  <ol>
    <li>
      <p><strong>Start a new file.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="131">2:11</page-anchor> Choose <em>File → New → General</em>. It starts with a cube at the centre, a camera and a light.</p>
    </li>
    <li>
      <p><strong>Add the sphere, 5 units away.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="136">2:16</page-anchor> Press <kbd>Shift</kbd>+<kbd>A</kbd> and choose <em>Mesh → UV Sphere</em>. Press <kbd>N</kbd> to open the sidebar, and in its <em>Transform</em> panel set <em>Location Y</em> to 5 <page-anchor target="#video-6MeFx1WL03Q" value="150">2:30</page-anchor>. X works just as well.</p>
      <figure><img src="files/keyframes-parenting-and-the-graph-editor-t0160.8.jpg" alt="A new scene with a camera, a cube and a UV sphere. The sphere is selected, and the sidebar's Transform panel shows its location as X 0 m, Y 5 m, Z 0 m."><figcaption><p>The sphere, 5 units along Y from the cube.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Why not move the sphere's origin?</strong> <page-anchor target="#video-6MeFx1WL03Q" value="163">2:43</page-anchor> One way to make the sphere circle the cube is to move the sphere's origin to the centre of the cube: under <em>Options</em> in the viewport's header, turn on <em>Affect Only Origins</em>, turn on snapping with <em>Absolute Grid Snap</em>, and drag the origin onto the centre grid point <page-anchor target="#video-6MeFx1WL03Q" value="178">2:58</page-anchor>. Turn <em>Origins</em> off again, and <kbd>R</kbd> rotates the sphere around the centre <page-anchor target="#video-6MeFx1WL03Q" value="195">3:15</page-anchor>. The downside is that the sphere no longer scales around its own middle <page-anchor target="#video-6MeFx1WL03Q" value="205">3:25</page-anchor>, so the video puts the origin back with <em>Object → Set Origin → Origin to Geometry</em> <page-anchor target="#video-6MeFx1WL03Q" value="217">3:37</page-anchor> and uses an empty instead.</p>
    </li>
    <li>
      <p><strong>Add an empty.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="223">3:43</page-anchor> Press <kbd>Shift</kbd>+<kbd>A</kbd> and choose <em>Empty → Plain Axes</em>. It's added at the centre of the scene, where the cube is. Any type of empty will do.</p>
      <figure><img src="files/keyframes-parenting-and-the-graph-editor-t0232.4.jpg" alt="The Add menu open in the 3D Viewport with Empty highlighted, and its submenu listing Plain Axes, Arrows, Single Arrow, Circle, Cube, Sphere, Cone and Image."><figcaption><p><em>Add → Empty → Plain Axes</em>.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Parent the sphere to the empty.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="236">3:56</page-anchor> Turn on X-ray so you can select the empty inside the cube. Click the sphere, then <kbd>Shift</kbd>+click the empty so it's selected last (the active object). Press <kbd>Ctrl</kbd>+<kbd>P</kbd> (the video uses <kbd>Cmd</kbd>+<kbd>P</kbd> on a Mac) and choose <em>Object (Keep Transform)</em>. In the Outliner, the sphere is now under the empty <page-anchor target="#video-6MeFx1WL03Q" value="251">4:11</page-anchor>.</p>
      <figure><img src="files/keyframes-parenting-and-the-graph-editor-t0252.8.jpg" alt="The cube in X-ray with the empty's orange axes at its centre and the sphere selected beside it. The Set Parent To menu is open, with Object (Keep Transform) highlighted between Object and Object (Without Inverse)."><figcaption><p>Parenting with <em>Object (Keep Transform)</em>: the object selected last becomes the parent.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Keyframe the cube</h2>

  <ol>
    <li>
      <p><strong>Set a keyframe on frame 1.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="278">4:38</page-anchor> A keyframe records where an object is at a point in time. Select the cube and, on frame 1 with the cube at 0, 0, 0, hover the pointer over its <em>Location</em> fields in the sidebar and press <kbd>I</kbd> <page-anchor target="#video-6MeFx1WL03Q" value="301">5:01</page-anchor>. The fields turn yellow.</p>
    </li>
    <li>
      <p><strong>Or choose what to keyframe.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="310">5:10</page-anchor> With the pointer in the viewport, <kbd>I</kbd> opens the <em>Insert Keyframe Menu</em>, where you choose the properties to keyframe: location, rotation, scale or a combination. The video keyframes from the sidebar, so it can see what it's doing.</p>
      <figure><img src="files/keyframes-parenting-and-the-graph-editor-t0322.4.jpg" alt="The Insert Keyframe Menu open over the 3D Viewport, listing Available, Location, Rotation, Scale, combinations such as Location, Rotation &amp; Scale, and Delta and Visual options. The Timeline below still ends at frame 250."><figcaption><p><kbd>I</kbd> in the viewport opens the <em>Insert Keyframe Menu</em>.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Make the animation 120 frames long.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="324">5:24</page-anchor> In the Timeline's header, set <em>End</em> to 120 (a new file has 250 frames).</p>
    </li>
    <li>
      <p><strong>Set a keyframe on frame 120.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="346">5:46</page-anchor> Move the playhead to frame 120 and, without moving the cube, press <kbd>I</kbd> over <em>Location</em> again. An orange bar appears between the two keyframes: nothing changes between them.</p>
    </li>
    <li>
      <p><strong>Lift the cube on frame 60.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="360">6:00</page-anchor> Go to frame 60 and type 10 in <em>Location Z</em>. The field turns orange because the value isn't keyframed: move the playhead and the cube goes back to 0 <page-anchor target="#video-6MeFx1WL03Q" value="374">6:14</page-anchor>. Press <kbd>I</kbd> over the field to keep it <page-anchor target="#video-6MeFx1WL03Q" value="390">6:30</page-anchor>. Right-clicking the field and choosing <em>Insert Keyframes</em> does the same <page-anchor target="#video-6MeFx1WL03Q" value="396">6:36</page-anchor>. Play the animation: the cube rises and comes back down.</p>
      <figure><img src="files/keyframes-parenting-and-the-graph-editor-t0400.4.jpg" alt="Frame 60: the cube is raised and its Location Z reads 10 m in an orange field. The right-click menu on the location fields is open with Insert Keyframes highlighted, and an orange bar runs between frames 1 and 120 in the Timeline."><figcaption><p>On frame 60, Z is 10 but not yet keyframed: <em>Insert Keyframes</em> keeps it.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Shape the motion in the Graph Editor</h2>

  <ol>
    <li>
      <p><strong>Open the Graph Editor.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="414">6:54</page-anchor> Change the Timeline to the <em>Graph Editor</em> (under <em>Animation</em> in the editor type menu). Frames run along the top and values up the left side. The blue curve is the cube's Z location <page-anchor target="#video-6MeFx1WL03Q" value="441">7:21</page-anchor>.</p>
      <figure><img src="files/keyframes-parenting-and-the-graph-editor-t0435.4.jpg" alt="The Graph Editor below the viewport: a blue curve rises smoothly from 0 at frame 1 to 10 at frame 60 and falls back to 0 at frame 120, with flat handles on the keyframes."><figcaption><p>The cube's Z location over time: easing out of each keyframe and into the next.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Hide the curves you won't change.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="444">7:24</page-anchor> X and Y location stay flat at 0, along the bottom. Lock them or turn off their visibility in the channel list so you don't select them by accident.</p>
    </li>
    <li>
      <p><strong>Move a handle.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="457">7:37</page-anchor> Each keyframe has a Bézier handle. Click one end of it and press <kbd>G</kbd> to move it: the curve changes shape. Never let a handle push the curve above the keyframe <page-anchor target="#video-6MeFx1WL03Q" value="470">7:50</page-anchor>. You set 10 on purpose, so Blender shouldn't decide on its own how high the cube goes.</p>
    </li>
    <li>
      <p><strong>Break the handles.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="488">8:08</page-anchor> The default curve eases out of a keyframe and eases in to the next. To move each side of a handle on its own, select the keyframe and choose <em>Key → Handle Type → Free</em>.</p>
    </li>
    <li>
      <p><strong>Try an ease out and an ease in.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="530">8:50</page-anchor> Pull a handle down and the cube barely moves until about frame 40, then shoots up: an ease out. Shaped like this, it looks as if the cube hits a ceiling and bounces back down <page-anchor target="#video-6MeFx1WL03Q" value="554">9:14</page-anchor>. Shape it the other way and the cube moves up quickly, then slows into place: an ease in, as if it explodes out of its position <page-anchor target="#video-6MeFx1WL03Q" value="577">9:37</page-anchor>.</p>
      <figure><img src="files/keyframes-parenting-and-the-graph-editor-t0570.8.jpg" alt="The Graph Editor with the X and Y Location channels locked and hidden. The Z curve now creeps up from 0, climbs steeply to a sharp point at 10 on frame 60, drops steeply and levels out, with the keyframe's two handles pulled down separately."><figcaption><p>Free handles turn the peak into a sharp point: the cube hits a ceiling and drops.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Go back to the default curve.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="655">10:55</page-anchor> You'll nearly always reshape curves to make an animation look right. For this one, undo with <kbd>Ctrl</kbd>+<kbd>Z</kbd> (<kbd>Cmd</kbd>+<kbd>Z</kbd> in the video) back to the default ease out and ease in.</p>
    </li>
  </ol>


  <h2>Make the sphere circle the cube</h2>

  <ol>
    <li>
      <p><strong>Parent the empty to the cube.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="693">11:33</page-anchor> Go back to frame 1. Click the empty, then <kbd>Shift</kbd>+click the cube so it's selected second, and press <kbd>Ctrl</kbd>+<kbd>P</kbd> → <em>Object (Keep Transform)</em>. Expand the cube in the Outliner: the empty is under it, and the sphere under the empty <page-anchor target="#video-6MeFx1WL03Q" value="715">11:55</page-anchor>. Play the animation: the sphere follows the cube up and down, but doesn't circle it yet <page-anchor target="#video-6MeFx1WL03Q" value="723">12:03</page-anchor>.</p>
      <figure><img src="files/keyframes-parenting-and-the-graph-editor-t0718.4.jpg" alt="The Outliner shows Cube with Empty under it and Sphere under Empty. In the viewport the cube is selected at frame 1, and the Make Parent panel is open at the bottom left."><figcaption><p>Cube, then empty, then sphere: each follows the one above it.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Rotate the empty, not the sphere.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="732">12:12</page-anchor> Rotating the sphere only spins it around its own origin, in its middle, and moving that origin would complicate what you can do with it later <page-anchor target="#video-6MeFx1WL03Q" value="744">12:24</page-anchor>. Rotate the empty instead: the sphere swings around with it.</p>
    </li>
    <li>
      <p><strong>Keyframe two full turns.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="758">12:38</page-anchor> Select the empty. On frame 1, press <kbd>I</kbd> over its <em>Rotation</em> fields, at 0, 0, 0. Go to frame 120, type 720 in <em>Rotation Z</em> (two turns of 360°) and press <kbd>I</kbd> <page-anchor target="#video-6MeFx1WL03Q" value="787">13:07</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Find the curve.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="810">13:30</page-anchor> Scrub the playhead and the sphere speeds up and slows down: it has the same automatic ease in and ease out as the cube. In the Graph Editor the rotation curve is hard to see because it doesn't fit in the window. Turn on <em>Normalize</em> <page-anchor target="#video-6MeFx1WL03Q" value="851">14:11</page-anchor>, or select <em>Z Euler Rotation</em> and use <em>View → Frame Selected</em> or <em>View → Frame All</em> <page-anchor target="#video-6MeFx1WL03Q" value="870">14:30</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Make it linear.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="887">14:47</page-anchor> Select both keyframes and choose <em>Key → Interpolation Mode → Linear</em> <page-anchor target="#video-6MeFx1WL03Q" value="913">15:13</page-anchor>. Blender now changes the rotation by the same amount every frame, so the sphere turns at a constant speed and loops seamlessly, without slowing down or speeding up <page-anchor target="#video-6MeFx1WL03Q" value="941">15:41</page-anchor>.</p>
      <figure><img src="files/keyframes-parenting-and-the-graph-editor-t0930.0.jpg" alt="The Graph Editor showing the empty's Z Euler Rotation as an S-shaped curve between frames 1 and 120, with Rotation Z at 720° in the sidebar. The Key menu is open at Interpolation Mode, with Linear highlighted between Constant and Bézier."><figcaption><p><em>Key → Interpolation Mode → Linear</em> turns the S-shaped curve into a straight line.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Make the camera follow the cube</h2>

  <ol>
    <li>
      <p><strong>Select the camera.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="986">16:26</page-anchor> Switch the Graph Editor back to the Timeline. Look through the camera with the camera button beside the viewport, then select the camera by clicking the frame around its view, or in the Outliner <page-anchor target="#video-6MeFx1WL03Q" value="1009">16:49</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Add a Track To constraint.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="1015">16:55</page-anchor> In the <em>Object Constraint Properties</em> tab, choose <em>Add Object Constraint → Track To</em>.</p>
      <figure><img src="files/keyframes-parenting-and-the-graph-editor-t1022.0.jpg" alt="Looking through the camera with the camera selected. In the Object Constraint Properties tab, the Add Object Constraint menu is open with Track To highlighted in its Tracking column."><figcaption><p><em>Add Object Constraint → Track To</em>.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Choose its target.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="1031">17:11</page-anchor> Set <em>Target</em> to an object, and the camera points at it as it moves. Aimed at the sphere, the camera swings around far too much <page-anchor target="#video-6MeFx1WL03Q" value="1040">17:20</page-anchor>, so the video aims it at the cube (the empty works too) <page-anchor target="#video-6MeFx1WL03Q" value="1055">17:35</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Frame the shot and play it.</strong> <page-anchor target="#video-6MeFx1WL03Q" value="1065">17:45</page-anchor> In the sidebar's <em>View</em> tab, tick <em>Lock Camera to View</em>, press <kbd>N</kbd> to close the sidebar, and zoom out to frame the scene. Play it: the camera tracks the cube as it moves up and down, and the sphere circles it, looping seamlessly <page-anchor target="#video-6MeFx1WL03Q" value="1075">17:55</page-anchor>.</p>
      <figure><img src="files/keyframes-parenting-and-the-graph-editor-t1070.0.jpg" alt="Looking through the camera at frame 97, with the sphere close in front of the cube. The camera's Track To constraint has Cube as its target, and the pointer is on Lock Camera to View in the sidebar's View tab."><figcaption><p>The camera tracks the cube; <em>Lock Camera to View</em> lets you frame the shot by zooming.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Wrap-up</h2>

  <p>You've keyframed the cube's location and shaped its curve in the Graph
  Editor, made the sphere circle the cube by rotating its parent empty with
  linear interpolation, and pointed the camera at the cube with a Track To
  constraint <page-anchor target="#video-6MeFx1WL03Q"
  value="1094">18:14</page-anchor>. Next, you'll save the animation as a
  video.</p>

  <a11y-collapse heading-button=""><p slot="heading">Transcript</p><div
  slot="content"><p><em>From speech to text.</em></p><p><page-anchor
  target="#video-6MeFx1WL03Q" value="1">0:01</page-anchor> Ok, so we are going
  to learn keyframe animation and we're going to look at doing tracking
  constraints so that we can have the camera track an object as it moves and
  we're going to look at how we can use parenting to create a relationship
  between two animated objects and so I'm going to press play here so we can
  preview what this is supposed to look like and zoom out here and what you can
  see is that the camera that exists over here if we were to click on the camera
  icon to look through it is tracking along with the movement of this cube. I
  press pause there and this cube is actually keyframed in three places at frame
  1, frame 60, and frame 120. And frame 1 and frame 120 are the same position.
  So up here under location under frame 1, 0, 0, 0, and under frame 120, 0, 0,
  0, and frame 60 we have a z location of 10 units high. And in addition to
  that, we have a sphere, and this sphere is parented to an empty object. So I'm
  going to just select that empty object.</p><p><page-anchor
  target="#video-6MeFx1WL03Q" value="76">1:16</page-anchor> Let's turn on our
  x-ray view. And so there we go. I can click and select that empty, and we can
  see that that empty is keyframed at 1 and 120. And here on 120, I have 760
  degrees, which is two full rotations. And then you can see here, there is a
  line that is connecting the sphere to the axes, and that indicates that
  there's a parent relationship. So the sphere is actually parented to the
  empty, which is parented to the cube. So as the cube moves up and down, the
  empty goes along with it, and along with the empty is the
  sphere.</p><p><page-anchor target="#video-6MeFx1WL03Q"
  value="124">2:04</page-anchor> Okay, so to set this up, I'm going to create a
  new scene here. Let's click New, General. Okay, so the first thing we can do
  is add a new sphere. So press Shift-A, mesh, UV sphere, and we need to move
  that by pressing N to open up our transform panel. In the X or Y, it doesn't
  matter. I'm going to use the Y here, and we're going to choose five units, and
  now we have our sphere in the right location. There's actually a few different
  ways to make this around this object. We could make the sphere origin point
  match the origin of this object.</p><p><page-anchor
  target="#video-6MeFx1WL03Q" value="172">2:52</page-anchor> And we could do
  that, for instance, by going up to options and modifying the origin. And if we
  want to get it exactly on this grid point, we could turn on snapping and turn
  on absolute grid snap. And now as I drag that, it will snap right into the
  middle of that grid. so if I was to now rotate this, let's turn off origins
  before we press rotate. And now if I press R to rotate, you can see it's
  rotating around that origin point. The downside here is if I go to scale that,
  it's not going to scale properly in all dimensions. And so I want to make sure
  that I have the ability to scale this separately. So I'm going to actually put
  that back where I had it. If I go to Object, Set Origin, Origin to Geometry, I
  can move that origin back to the center of the geometry. All right, so the
  third thing I need to create, Shift-A down to Empty, and just choose Plane
  Axis. It doesn't really matter which one you choose. What we can do is parent
  the sphere to that axis. I'm going to turn on X-Ray View so I can select it.
  So Shift-Select, and with that axis active, I can now parent this object to
  that one. So if I press command P, we can choose object</p><p><page-anchor
  target="#video-6MeFx1WL03Q" value="252">4:12</page-anchor> keep transform. And
  now what will happen is in the outliner, you can see the sphere is now
  underneath the empty. And one of the things that we want to do is actually
  track that empty's position to this cube. There's many ways to do that. We're
  going to use a parent method to do that. But first this cube. Okay here at
  frame one we know that we want a keyframe at zero zero zero. So a keyframe is
  essentially saying at this point in time on the on this frame in this point in
  space we want to essentially make it known that this object will be here. So I
  can just press I to insert a keyframe frame 1 at 0 0 0 and the way i do that
  is just by hovering the mouse over and pressing i the other thing i can do is
  press i here in the middle of the viewport and then i can choose which
  property i want to add a keyframe for so you can do all at once if you just
  press i and then go to location rotation and scale i prefer to just do it this
  way so i can see what</p><p><page-anchor target="#video-6MeFx1WL03Q"
  value="328">5:28</page-anchor> i'm doing the other thing to notice is that we
  actually have too many keyframes so we're supposed for this animation, so I'm
  going to type 120 here in the end, and then that will give us 120 frames.
  Okay, so if I want this object to start here at 0, 0, 0, and end at 0, 0, 0, I
  know that I can move this to frame 120, and then just press I with it in the
  same place, and you'll notice that it's keyframed, and there's an orange line
  that shows up, and basically that indicates that no movement is happening. If
  we go to frame 60 and I was to go to this wide, excuse me, the Z axis here and
  just press 10.</p><p><page-anchor target="#video-6MeFx1WL03Q"
  value="374">6:14</page-anchor> If I zoom out, you can see that this cube is
  now moved vertically 10. But if I was to move this play handle, it goes back
  to zero. And that's because it's keyframed. So if I want to preserve it at 10
