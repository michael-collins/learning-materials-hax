content: >
  <p>Jefferson's Gravestone: Metaphorical Extensions of Design (p. 117-133) in
  Design and Truth by Robert Grudin.</p>

  <h2>Writing prompt</h2>

  <p>In this chapter, Grudin takes us on a foray through literary design, social
  design, and of the qualities that make for a good designer and design leader.
  Grudin tracks the emergence of design as a concept, and various evolutions of
  what the process according to historical designers, all adding up to the
  "magical idea" of design that can be a "metaphor for creative thought in any
  area."</p>

  <p>Describe an instance in which you designed something, from conceiving a
  plan in your head through a finished product. What kind of design process did
  you engage in? Describe your motivation or any significant context, but focus
  on summarizing your design process and how it affect the end product. Did you
  work with a group or solo? How did that affect the results?</p>

  <p>Connect your example to the reading. Which of the historical or
  contemporary design approaches mention by Grudin can be related to your
  process?</p>

  <h2>Writing guidelines</h2>

  <ol>

  <li>Length: (150-300 words)</li>

  <li>Reference the chapter content whenever possible</li>

  <li>Cite sources where applicable.</li>

  <li>Check for spelling and grammar.</li>

  <li>Avoid generalizing language. Choose clear and concise wording.</li>

  </ol>

