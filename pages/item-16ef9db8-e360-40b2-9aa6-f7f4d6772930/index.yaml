content: >
  <p>The following are examples of project file types:</p>

  <ol>

  <li>High resolution images</li>

  <li>photo documentation</li>

  <li>video</li>

  <li>Pre-press PDF documents</li>

  <li>executable game or app file for download (macOS and Windows
  compatible)</li>

  <li>Zip archive of files</li>

  <li>URL of live website (not a link to a paid web service such as
  InvisionApp)</li>

  </ol>

  <p>For archival purposes, the files must be as self-contained as possible.
  (I.E.–if I were to look at them without an Internet connection, would the
  project still work? This will not always be possible given the nature of
  certain projects.)</p>

  <h2>Submission details:</h2>

  <ol>

  <li>Upload to canvas by the deadline.</li>

  </ol>
