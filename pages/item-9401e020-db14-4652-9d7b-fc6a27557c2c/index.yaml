  <h2>Brief</h2>

  <p>For this project, you will create a fictional hypertext fiction with an
  open-source application called Twine focused on building a better future
  world, set 30 years in future. The main goal of this project is to create
  <strong>plausible</strong>, civic-minded design patterns for improving the
  future. A hypertext fiction is a fictional story that is read by progressing
  through a series of story nodes containing hypertext links, with each link
  leading to another node in the story. You will follow a design process that
  will help you generate ideas, create characters and plot, incorporate
  feedback, and iterate towards a final work.</p>

  <h3>Tools and materials</h3>

  <ul>

  <li>Pencil/pen</li>

  <li>Journal</li>

  <li>Computer with Internet access</li>

  <li>Twine Desktop Application</li>

  </ul>

  <h3>Learning Resources</h3>

  <p><strong>Instructor produced:</strong></p>

  <ul>

  <li><a href="articles/twine-tutorial-getting-started-with-twine">Twine
  tutorial: Getting started with Twine</a></li>

  </ul>

  <p>You should include the bare minimum listed in this tutorial, but if you
  want to produce a more advanced hypertext narrative, see the <a
  href="http://twinery.org/wiki/twine2:guide">Twine Wiki</a> for more
  details.</p>

  <p><strong>From the Twine community:</strong></p>

  <ul>

  <li>Twine Guide: <a href="http://twinery.org/wiki/twine2:guide">Twine
  Wiki</a></li>

  <li>Advanced: <a
  href="http://www.sfwa.org/creating-interactive-fiction-guide-using-twine/">Interactive
  Fiction</a></li>

  <li>Making a game with Twine: <a
  href="http://www.auntiepixelante.com/twine/">Twine Game Tutorial</a></li>

  <li>How to add <a
  href="http://twinery.org/wiki/twine2:change_the_font_colors_or_appearance">custom
  CSS</a> to a Twine story (colors, fonts, layout, etc.)</li>

  </ul>

