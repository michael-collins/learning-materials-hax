content: >
  <p>In this exercise, you will practice polygonal modeling fundamentals and
  will use 3D software to build a polygonal model of three random objects.</p>

  <oer-iframe
  src="https://youtube.com/embed/videoseries?list=PL-V2nChTadrUtPySfHyf4j_w6PGi6AES9"
  title="Modeling random objects Tutorial"></oer-iframe>

  <h2>Learning Objectives</h2>

  <ol>

  <li>Become familiarized with 3D software terminology</li>

  <li>Practice polygonal modeling workflows</li>

  <li>Perform fundamental polygonal modeling operations including extrude,
  merge, bridge, and bevel.</li>

  </ol>

  <h2>Instructions</h2>

  <ol>

  <li>Watch the Blender Foundation videos to get a refresher on the Blender’s
  interface.</li>

  <li>Look at the learning materials to get an understanding of modeling
  theory.</li>

  <li>Create a project folder. Save all assets to the project folder.</li>

  <li>Obtain three randomly generated objects from <a
  href="http://www.randomlists.com/things">this website</a>. Include a
  screenshot of the website objects in your project folder called
  <code>YOURNAME-objects-modeling.jpg</code> (or <code>.png</code>)</li>

  <li>If you are unsure about how to proceed with modeling your first, do a
  quick search to see if someone has a tutorial for starting to model the
  object. Drawing the object on paper, and then drawing polygons over top is
  also helpful to plan your topology.</li>

  <li>Create a new file for each object and save in the project folder.

  <ul>

  <li><strong>Naming:</strong> <code>YOURNAME-modeling-object1</code>,
  <code>YOURNAME-modeling-object2</code>,
  <code>YOURNAME-modeling-object2</code></li>

  </ul>

  </li>

  <li>Create one polygonal model for each scene file from your set of randomly
  generated objects in Step 2. (You should be making three objects since you’ve
  created three scenes.)</li>

  <li>Create a base mesh for each object.

  <ul>

  <li>Focus on maintaining quads and good <a
  href="https://www.youtube.com/watch?v=Lip59doQQRk">edgeflow</a>.</li>

  </ul>

  </li>

  <li>Compress the project folder once you’ve completed the tutorial and rename
  it <code>YOURNAME-modeling-objects.zip</code>.</li>

  <li>Upload the .zip file to the assignment dropbox.</li>

  <li>Ensure you’ve included everything properly. Failure to ensure that you’ve
  uploaded the file will result in your exercise being graded according the
  grading criteria.</li>

  </ol>

  <h2>Grading Rubric</h2>

