content: >
  <p>In this exercise, you will practice modeling a character in a T-pose and
  rendering using an NPR workflow.</p>

  <oer-iframe
  src="https://youtube.com/embed/videoseries?list=PL-V2nChTadrX6h44IeMo7hTkjg9HtJgvb"
  title="Low poly non-photorealistic rendering Tutorial"></oer-iframe>

  <h2>Learning Objectives</h2>

  <ol>

  <li>Become familiarized with the NPR workflow.</li>

  <li>Learn the character modeling workflow</li>

  </ol>

  <h2>Instructions</h2>

  <ol>

  <li>Model a polygonal character in the <a
  href="https://www.animatorisland.com/the-t-pose-all-about-the-mighty-blueprint/?v=7516fd43adaa">T
  pose</a>. Choose a theme for the character (IE - fantasy, sci-fi, etc.).</li>

  <li>Watch the tutorials.</li>

  <li>Create greasepencil modifier, shaders, materials, and freestyle lines to
  create a manga or comic book visual style.</li>

  <li>Save a 1920x1080 render as <code>LASTNAME-npr-character.png</code> in the
  project folder.</li>

  <li>Save your file as <code>LASTNAME-npr-character.blend</code> in the project
  folder.</li>

  <li>Compress the project folder once you’ve completed the tutorial and rename
  it <code>LASTNAME-npr-character.zip</code>.</li>

  <li>Upload the .zip file to the assignment dropbox.</li>

  <li>Double check that you’ve included all files and that your .zip file can be
  downloaded and opened.</li>

  </ol>

  <h2>Grading Rubric</h2>

  <oer-rubric rubric-id="exercise" version="1.0.0"></oer-rubric>
