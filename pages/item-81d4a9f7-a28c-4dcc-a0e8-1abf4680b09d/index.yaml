content: >
  <p>The Lady in the Picture: Design and Revelation in Renaissance Art (p.
  88-104) in Design and Truth by Robert Grudin</p>

  <h2>Writing prompt</h2>

  <p>In this chapter, Grudin gives us a glimpse into specific moments of
  knowledge design during the Renaissance through examining  paintings,
  architecture, writing, and opera. I encourage you to look up the works
  referenced in the passages as you read to visualize them.</p>

  <p>What distinctive characteristics does Grudin highlight to support his
  argument that these works are examples of <strong>knowledge design</strong>?
  With those examples in mind, can you relate them to specific pieces of
  contemporary creative work that succeed or fail to embed knowledge? Describe
  specific visual details and how they relate to the work's function in society
  or the creator's perspective.</p>

  <h2>Writing guidelines</h2>

  <ol>

  <li>Length: (150-300 words)</li>

  <li>Reference the chapter content whenever possible</li>

  <li>Cite sources where applicable.</li>

  <li>Check for spelling and grammar.</li>

  <li>Avoid generalizing language. Choose clear and concise wording.</li>

  </ol>

