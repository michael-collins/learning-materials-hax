content: >-
  <p>A mesh can only bend where it has edges. In this part you'll add edge loops
  to the mirrored base mesh at the elbows, knees, waist, hips and shoulders,
  tidy up the neck, and nudge the arms and legs into a more natural T-pose. The
  aim isn't a perfect character model, just enough geometry for it to bend.
  You'll need the half mesh with its Mirror modifier from the last part. The
  video uses Blender 2.90.</p>


  <oer-video id="video-SAXMOmAArAw"
  src="https://www.youtube.com/watch?v=SAXMOmAArAw" title="Rigging Part 03 -
  Adding Knees and Elbows" credit="Michael Collins"
  credit-url="https://www.youtube.com/channel/UCp1cLW7rry_NKRhcH8bPfGg"></oer-video>


  <h2>See the edges while you work</h2>

  <ol>
    <li>
      <p><strong>Show the wireframe over the solid view.</strong> <page-anchor target="#video-SAXMOmAArAw" value="2">0:02</page-anchor> Go to the front view. Either use wireframe shading, or stay in solid shading and turn on <em>Wireframe</em> in the <em>Viewport Overlays</em> dropdown, so you can always see where the edges are.</p>
      <figure><img src="files/adding-knees-and-elbows-t0017.4.jpg" alt="The smooth-shaded base mesh in the Front Orthographic view, with the Viewport Overlays dropdown open at the top right. The pointer is on the Wireframe checkbox under Geometry."><figcaption><p>Viewport Overlays → Wireframe shows the edges on top of the solid view.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Add the elbows and knees</h2>

  <ol>
    <li>
      <p><strong>Add two edge loops at the elbow.</strong> <page-anchor target="#video-SAXMOmAArAw" value="21">0:21</page-anchor> Press <kbd>Tab</kbd> for <em>Edit Mode</em>. Press <kbd>Ctrl</kbd> <kbd>R</kbd> and hover over the arm; before you click, scroll the mouse wheel up to make it two loops instead of one <page-anchor target="#video-SAXMOmAArAw" value="43">0:43</page-anchor>. Click, then press <kbd>Esc</kbd> to drop them where they are rather than sliding them <page-anchor target="#video-SAXMOmAArAw" value="51">0:51</page-anchor>. If you added one by mistake, press <kbd>Esc</kbd> and undo with <kbd>Ctrl</kbd> <kbd>Z</kbd> (<kbd>Cmd</kbd> <kbd>Z</kbd> on a Mac) and try again.</p>
      <figure><img src="files/adding-knees-and-elbows-t0048.4.jpg" alt="Edit Mode in the Front Orthographic view. Hovering over the upper arm on the right shows two yellow loop-cut lines across it, and the status bar reads Number of Cuts: 2."><figcaption><p>Scrolling up while using Ctrl R previews two loops at once.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Or use the Loop Cut tool.</strong> <page-anchor target="#video-SAXMOmAArAw" value="58">0:58</page-anchor> If you'd rather click a button than use the shortcut, choose <em>Loop Cut</em> in the toolbar on the left, set <em>Number of Cuts</em> to 2 in its tool settings and click in the middle of the arm <page-anchor target="#video-SAXMOmAArAw" value="71">1:11</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Move the two loops closer together.</strong> <page-anchor target="#video-SAXMOmAArAw" value="78">1:18</page-anchor> They're too far apart to work as an elbow. With them selected, press <kbd>S</kbd> then <kbd>X</kbd> to scale them along X only, so they move toward each other.</p>
      <figure><img src="files/adding-knees-and-elbows-t0091.4.jpg" alt="The two new loops in the arm on the right scaled close together near the elbow. The header reads Scale: 0.1575 along global X, and the Mirror modifier shows the same pair of loops on the other arm."><figcaption><p>Scaled along X, the two loops sit close together at the elbow (and on the other arm too).</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Do the same for the knees.</strong> <page-anchor target="#video-SAXMOmAArAw" value="93">1:33</page-anchor> Add two loops across the leg the same way and press <kbd>S</kbd> then <kbd>Z</kbd> to bring them together along Z <page-anchor target="#video-SAXMOmAArAw" value="99">1:39</page-anchor>.</p>
      <figure><img src="files/adding-knees-and-elbows-t0106.4.jpg" alt="The lower body in the Front Orthographic view, with two close edge loops across each leg at knee height. The loops on the right leg are selected in orange, and the mirrored leg shows the same pair."><figcaption><p>Two close loops at the knee, mirrored on the other leg.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Add the waist, hips and ankles</h2>

  <ol>
    <li>
      <p><strong>Separate the waist from the chest.</strong> <page-anchor target="#video-SAXMOmAArAw" value="108">1:48</page-anchor> To bend the legs at the waist and the character's back, the torso needs more divisions between the waist and the upper body. Press <kbd>Ctrl</kbd> <kbd>R</kbd> over the torso and scroll up to add more loops <page-anchor target="#video-SAXMOmAArAw" value="129">2:09</page-anchor>.</p>
      <figure><img src="files/adding-knees-and-elbows-t0135.0.jpg" alt="The character in perspective in Edit Mode. Two yellow loop-cut previews run around the torso between the chest and the waist, and the status bar reads Number of Cuts: 2. Earlier loops show at the knees."><figcaption><p>More loops around the torso, so the back and waist can bend.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Add one at the hip and one above the foot.</strong> <page-anchor target="#video-SAXMOmAArAw" value="138">2:18</page-anchor> Add another loop across the top of the leg and slide it up close to the hip. Add one more at the bottom of the leg, toward the top of the foot <page-anchor target="#video-SAXMOmAArAw" value="152">2:32</page-anchor>; the foot itself will probably change later.</p>
    </li>
  </ol>


  <h2>Fix the neck and the shoulders</h2>

  <ol>
    <li>
      <p><strong>Add a loop at the neck, but don't scale it.</strong> <page-anchor target="#video-SAXMOmAArAw" value="165">2:45</page-anchor> Add a loop in the middle of the neck. Scaling it along X goes wrong here: the loop crosses the mirror's boundary, so scaling moves the vertices that sit on the boundary off it and spoils the middle of the mesh <page-anchor target="#video-SAXMOmAArAw" value="176">2:56</page-anchor>.</p>
      <figure><img src="files/adding-knees-and-elbows-t0180.4.jpg" alt="A close view of the neck in Edit Mode while scaling along X, with the header reading Scale: 0.3913 along global X. The neck's new loop is being pulled in, and the faces at the middle of the neck fold into a gap."><figcaption><p>Scaling the neck loop pulls the vertices in the middle off the mirror line.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Move the vertices by hand instead.</strong> <page-anchor target="#video-SAXMOmAArAw" value="190">3:10</page-anchor> Press <kbd>1</kbd> for vertex select mode and adjust the neck's vertices with the <em>Move</em> tool. The head could also be rounder <page-anchor target="#video-SAXMOmAArAw" value="205">3:25</page-anchor>: the base mesh is deliberately rough, so you get to practise fixing it.</p>
    </li>
    <li>
      <p><strong>Test the shoulder.</strong> <page-anchor target="#video-SAXMOmAArAw" value="217">3:37</page-anchor> Turn on X-ray in the viewport header so you can select through the mesh, select the arm, rotate it around Y and move it down into place. With no edges there to bend, the shoulder just melts away <page-anchor target="#video-SAXMOmAArAw" value="238">3:58</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Add a loop at the shoulder.</strong> <page-anchor target="#video-SAXMOmAArAw" value="244">4:04</page-anchor> Add an edge loop near the shoulder with <kbd>Ctrl</kbd> <kbd>R</kbd>, select the arm again and rotate it with <kbd>R</kbd>, just as a test. Now the shoulder holds its shape much better, and it'll look better still once it's rigged. Undo the test, then move the shoulder's vertices up and out a little to shape it <page-anchor target="#video-SAXMOmAArAw" value="268">4:28</page-anchor>.</p>
      <figure><img src="files/adding-knees-and-elbows-t0257.0.jpg" alt="The arm on the right selected in orange and rotated down by 54.78 degrees along global Y, as the header shows. With a new loop near the shoulder, the shoulder keeps its shape where the arm bends down."><figcaption><p>A test rotation after adding a shoulder loop. The shoulder keeps its shape.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Shape the T-pose</h2>

  <ol>
    <li>
      <p><strong>Think about how high the arms are.</strong> <page-anchor target="#video-SAXMOmAArAw" value="282">4:42</page-anchor> Characters used to be modeled in a very exaggerated T-pose, the arms straight out at 90° to the body. Many character artists now make the T-pose lower, because rigged characters deform a little better when the arms don't start so high. You can lower the arms if you want; the video leaves that for a later step <page-anchor target="#video-SAXMOmAArAw" value="336">5:36</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Kick the elbows back.</strong> <page-anchor target="#video-SAXMOmAArAw" value="343">5:43</page-anchor> The pose should be close to how a person really stands. In the top view, move the elbow loops back a little, so the arm has a slight bend from the start. A T-pose should also have the hands flat, with the thumbs forward <page-anchor target="#video-SAXMOmAArAw" value="366">6:06</page-anchor>.</p>
      <figure><img src="files/adding-knees-and-elbows-t0364.8.jpg" alt="The Top Orthographic view looking down on the arms. The elbow loops on the arm on the right are selected and moved back, toward the top of the picture, so the arm bends slightly at the elbow."><figcaption><p>From above: the elbow moved back so the arm is slightly bent.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Kick the knees forward.</strong> <page-anchor target="#video-SAXMOmAArAw" value="380">6:20</page-anchor> In the side view (along the X axis), move the knee vertices a little forward for a more realistic stance. Scaling the knee loops earlier already did some of this. You could keep shaping the legs, and add more geometry, but the point here is only enough geometry to bend <page-anchor target="#video-SAXMOmAArAw" value="409">6:49</page-anchor>.</p>
      <figure><img src="files/adding-knees-and-elbows-t0404.0.jpg" alt="The Right Orthographic side view of one leg, with the foot pointing to the left. Vertices at the knee are being moved toward the front of the leg, so the knee pushes forward slightly."><figcaption><p>From the side: the knee moved slightly forward.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Wrap-up</h2>

  <p>The base mesh now has edge loops at the elbows, knees, waist, hips, ankles,
  neck and shoulders, mirrored on both sides, and a slightly more natural T-pose
  with the elbows back and the knees forward. It's enough to bend, but not yet
  clean: the next part works on the edge flow so it deforms well.</p>

