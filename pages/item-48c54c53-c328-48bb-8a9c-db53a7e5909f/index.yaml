content: >-
  <p>In this part you'll take models made in Blender into PlayCanvas, a game
  engine that runs in the web browser, and make a scene you can walk around in
  first person. The video sets up a PlayCanvas project, makes reusable pieces in
  Blender and exports them as GLB files, builds a player from a capsule with the
  camera inside it, gives the player and the ground collision and rigid bodies
  so the player stands on the ground, brings in the models and changes their
  materials, and adds a script that moves the player with the keyboard and
  mouse. You'll need Blender and a PlayCanvas account (the video signs in with a
  GitHub account). The video uses Blender 4.0 and the PlayCanvas Editor in
  Firefox on a Mac, in early 2024, so some screens may look different now. Part
  2 puts the finished scene online with GitHub Pages.</p>


  <oer-video id="video-nomFPf07Fmc"
  src="https://www.youtube.com/watch?v=nomFPf07Fmc" title="Intro to PlayCanvas"
  credit="Michael Collins"
  credit-url="https://www.youtube.com/channel/UCp1cLW7rry_NKRhcH8bPfGg"></oer-video>


  <h2>Set up PlayCanvas</h2>

  <ol>
    <li>
      <p><strong>Sign in.</strong> <page-anchor target="#video-nomFPf07Fmc" value="52">0:52</page-anchor> Go to playcanvas.com and make an account, or sign in. The video signs in with its GitHub account: PlayCanvas works with GitHub repositories, which keep your code under version control so you don't lose it <page-anchor target="#video-nomFPf07Fmc" value="60">1:00</page-anchor>, and let you share it with others helping on the project <page-anchor target="#video-nomFPf07Fmc" value="74">1:14</page-anchor>.</p>
      <figure><img src="files/bringing-a-blender-scene-into-playcanvas-t0072.0.jpg" alt="The PlayCanvas login page at login.playcanvas.com: fields for Email or Username and Password with a Log in button, and below them Sign in with Google and Sign in with Github buttons."><figcaption><p>You can sign in to PlayCanvas with GitHub; you'll need a GitHub account for Part 2 anyway.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Create a project.</strong> <page-anchor target="#video-nomFPf07Fmc" value="102">1:42</page-anchor> Create a new <em>Blank</em> project. (For something more static, a <em>Model Viewer</em> project is another starting point <page-anchor target="#video-nomFPf07Fmc" value="113">1:53</page-anchor>.) Give it a name and a description in the project's <em>Settings</em>, then <em>Save</em>: the video calls it "Example demo" <page-anchor target="#video-nomFPf07Fmc" value="122">2:02</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Open the editor.</strong> <page-anchor target="#video-nomFPf07Fmc" value="141">2:21</page-anchor> Most of your time in PlayCanvas is spent in the <em>Editor</em>, a full 3D environment editor. <em>Launch</em> opens the scene in a new browser tab <page-anchor target="#video-nomFPf07Fmc" value="158">2:38</page-anchor>. You can't move around yet: nothing is interactive, so you only see what the default camera sees <page-anchor target="#video-nomFPf07Fmc" value="164">2:44</page-anchor>.</p>
    </li>
  </ol>


  <h2>Prepare your models in Blender</h2>

  <p><page-anchor target="#video-nomFPf07Fmc" value="452">7:32</page-anchor> The
  video's scene is a waterfront, not yet textured: space for the player to walk
  in front of some buildings, a dock running out over the water, and boats to
  look at.</p>

  <ol>
    <li>
      <p><strong>Build from reusable pieces.</strong> <page-anchor target="#video-nomFPf07Fmc" value="204">3:24</page-anchor> Blender's <em>Asset Browser</em> holds pieces you've made, like a section of dock, that you drag into the scene and line up with snapping <page-anchor target="#video-nomFPf07Fmc" value="225">3:45</page-anchor>. The point isn't speed in Blender: PlayCanvas only has to load a piece once, and can reuse it to build similar structures <page-anchor target="#video-nomFPf07Fmc" value="253">4:13</page-anchor>. Games do this all the time with asset packs; you're making your own <page-anchor target="#video-nomFPf07Fmc" value="266">4:26</page-anchor>. If everything in your scene is unique, the Asset Browser is less useful <page-anchor target="#video-nomFPf07Fmc" value="274">4:34</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Give your assets a home.</strong> <page-anchor target="#video-nomFPf07Fmc" value="288">4:48</page-anchor> Make a folder for them (the video's is <em>Documents → Blender → Assets</em>) and point Blender at it in <em>Edit → Preferences → File Paths → Asset Libraries</em> <page-anchor target="#video-nomFPf07Fmc" value="342">5:42</page-anchor>. Save your Blender files in that folder: the assets live in the Blender file, and Blender finds them through the folder <page-anchor target="#video-nomFPf07Fmc" value="324">5:24</page-anchor>.</p>
      <figure><img src="files/bringing-a-blender-scene-into-playcanvas-t0355.0.jpg" alt="Blender Preferences open at File Paths. Under Asset Libraries, User Library is selected, with its Path set to a Blender/Assets folder inside the user's Documents folder and Import Method Append (Reuse Data)."><figcaption><p>The asset library's <em>Path</em> is the folder where you keep your Blender files.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Mark objects as assets.</strong> <page-anchor target="#video-nomFPf07Fmc" value="363">6:03</page-anchor> Right-click an object in the Outliner and choose <em>Mark as Asset</em> <page-anchor target="#video-nomFPf07Fmc" value="401">6:41</page-anchor>. It's now in the Asset Browser for every Blender project you make. When you drag it in, it lines itself up with the surface you drop it on: sideways on a wall, upright on a floor <page-anchor target="#video-nomFPf07Fmc" value="412">6:52</page-anchor>.</p>
      <figure><img src="files/bringing-a-blender-scene-into-playcanvas-t0403.0.jpg" alt="Blender with Suzanne, the monkey head, selected in the viewport. The Outliner's right-click menu is open, listing Copy, Paste, Delete, Select, New Collection, ID Data and Mark as Asset, with Clear Asset greyed out below it. The Asset Browser on the left shows dock pieces: dock_module_1, dock_module_end, dock_ramp and door."><figcaption><p><em>Mark as Asset</em> in the Outliner's right-click menu.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Export each piece as a GLB file.</strong> <page-anchor target="#video-nomFPf07Fmc" value="489">8:09</page-anchor> Export the pieces as separate files into a folder in your project's working folder (the video's is called "glb"). GLB is a file type that makes 3D work well on the web <page-anchor target="#video-nomFPf07Fmc" value="497">8:17</page-anchor>. Select the object, with everything nested in it <page-anchor target="#video-nomFPf07Fmc" value="514">8:34</page-anchor>: its mesh, its material and any UV map go with it <page-anchor target="#video-nomFPf07Fmc" value="558">9:18</page-anchor>. Then choose <em>File → Export → glTF 2.0</em> <page-anchor target="#video-nomFPf07Fmc" value="593">9:53</page-anchor>. Open <em>Include</em> and tick <em>Limit to Selected Objects</em>, or you'll export the whole scene <page-anchor target="#video-nomFPf07Fmc" value="598">9:58</page-anchor>. Keep <em>UVs</em> and <em>Normals</em> (normals describe how smooth or angled your geometry is) <page-anchor target="#video-nomFPf07Fmc" value="623">10:23</page-anchor>; the other defaults are fine <page-anchor target="#video-nomFPf07Fmc" value="645">10:45</page-anchor>. Name the file and click <em>Export</em>, and do the same for every piece <page-anchor target="#video-nomFPf07Fmc" value="648">10:48</page-anchor>.</p>
      <figure><img src="files/bringing-a-blender-scene-into-playcanvas-t0620.8.jpg" alt="Blender's glTF 2.0 export dialog: Format glTF Binary (.glb); under Include, Limit to Selected Objects is ticked; under Transform, +Y Up is ticked; under Mesh, UVs, Normals and Vertex Colors are ticked, and Materials is set to Export. The Outliner behind it has dock_ramp selected, and the Export glTF 2.0 button is at the bottom right."><figcaption><p><em>Limit to Selected Objects</em> exports only the piece you've selected.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Find your way around the editor</h2>

  <ul>
    <li><page-anchor target="#video-nomFPf07Fmc" value="680">11:20</page-anchor> On the left are the tools for moving, rotating and scaling, and beside them the <em>Hierarchy</em>: the scene's tree, what Blender calls the Outliner <page-anchor target="#video-nomFPf07Fmc" value="684">11:24</page-anchor>.</li>
    <li><page-anchor target="#video-nomFPf07Fmc" value="694">11:34</page-anchor> Along the top are a way back to the project's page, the project settings, and version control, which you can connect to a GitHub repository <page-anchor target="#video-nomFPf07Fmc" value="702">11:42</page-anchor>.</li>
    <li><page-anchor target="#video-nomFPf07Fmc" value="713">11:53</page-anchor> Next come the render mode (<em>Standard</em> is fine) and the views: <em>Perspective</em>, <em>Top</em>, <em>Front</em> and so on, and <em>Camera</em>, which looks through the scene's camera <page-anchor target="#video-nomFPf07Fmc" value="718">11:58</page-anchor>.</li>
    <li><page-anchor target="#video-nomFPf07Fmc" value="784">13:04</page-anchor> On the right, the <em>Inspector</em> shows the properties of whatever is selected; the <em>Assets</em> panel is at the bottom.</li>
  </ul>

  <figure><img src="files/bringing-a-blender-scene-into-playcanvas-t0155.0.jpg"
  alt="The PlayCanvas Editor for the Example demo project. The Hierarchy on the
  left lists Root, Camera, Light, Box and Plane; the viewport shows a grey plane
  with a box on it; the toolbar along the top has home and settings buttons, the
  main branch, the scene name Untitled, a How do I…? search, Standard,
  Perspective and Launch. The Assets panel at the bottom holds a Skybox folder,
  and the Inspector on the right is empty."><figcaption><p>A new blank project:
  a camera, a light, a box and a plane.</p></figcaption></figure>


  <h2>Make a player</h2>

  <ol>
    <li>
      <p><strong>Add a capsule.</strong> <page-anchor target="#video-nomFPf07Fmc" value="756">12:36</page-anchor> Click <em>+</em> at the top of the Hierarchy and choose <em>3D → Capsule</em>. The video also deletes the default box <page-anchor target="#video-nomFPf07Fmc" value="767">12:47</page-anchor>.</p>
      <oer-callout type="warning" title="Watch what's selected"><p>New things go inside whatever is selected. The video's capsule ended up inside the camera, so it drags it back to <em>Root</em> <page-anchor target="#video-nomFPf07Fmc" value="771">12:51</page-anchor>. It also took the camera's position, so set its position and rotation to 0 in the Inspector <page-anchor target="#video-nomFPf07Fmc" value="784">13:04</page-anchor>, then move it so it rests on, or just above, the plane <page-anchor target="#video-nomFPf07Fmc" value="846">14:06</page-anchor>.</p></oer-callout>
    </li>
    <li>
      <p><strong>Put the camera inside it.</strong> <page-anchor target="#video-nomFPf07Fmc" value="869">14:29</page-anchor> Think of the capsule as the character and the camera as where it looks <page-anchor target="#video-nomFPf07Fmc" value="880">14:40</page-anchor>. Set the camera's rotation to 0 and raise it to a good eye height inside the capsule <page-anchor target="#video-nomFPf07Fmc" value="887">14:47</page-anchor>. In PlayCanvas, Y is up, not Z as in most 3D tools <page-anchor target="#video-nomFPf07Fmc" value="897">14:57</page-anchor>. You can see out from inside because faces are one-sided: from behind, they're invisible <page-anchor target="#video-nomFPf07Fmc" value="950">15:50</page-anchor>. Then drag the camera onto the capsule in the Hierarchy, so it moves with it <page-anchor target="#video-nomFPf07Fmc" value="977">16:17</page-anchor>.</p>
      <figure><img src="files/bringing-a-blender-scene-into-playcanvas-t0985.8.jpg" alt="The PlayCanvas Editor with a white capsule standing on the plane. In the Hierarchy, Camera is nested under Capsule, and the camera's outline shows at the top of the capsule. The Inspector shows the Capsule entity at Position 0, 1.002, −1.699 with Rotation 0, and its Render component set to Capsule."><figcaption><p>The camera nested in the capsule, at eye height.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Make room to walk.</strong> <page-anchor target="#video-nomFPf07Fmc" value="1003">16:43</page-anchor> With the scale tool, make the plane bigger so you don't fall off the edge as easily.</p>
    </li>
    <li>
      <p><strong>Give the player a collision shape.</strong> <page-anchor target="#video-nomFPf07Fmc" value="1009">16:49</page-anchor> The capsule doesn't need to be seen: turn off its <em>Render</em> component, or delete it <page-anchor target="#video-nomFPf07Fmc" value="1018">16:58</page-anchor>. Then choose <em>Add Component → Physics → Collision</em> and set its <em>Type</em> to <em>Capsule</em>, the same size and shape as the mesh. Being round helps it collide smoothly, without catching on the edges of things <page-anchor target="#video-nomFPf07Fmc" value="1043">17:23</page-anchor>. If it says <em>Ammo module not found</em>, click <em>Import Ammo</em>: collisions need that JavaScript in the project <page-anchor target="#video-nomFPf07Fmc" value="1056">17:36</page-anchor>. Rename the capsule "Player" in the Inspector's <em>Name</em> field: scripts often expect the thing that moves the camera around to be called that <page-anchor target="#video-nomFPf07Fmc" value="1083">18:03</page-anchor>.</p>
      <figure><img src="files/bringing-a-blender-scene-into-playcanvas-t1055.4.jpg" alt="The capsule shown as a purple collision shape. The Inspector's Collision component has Type Capsule, Radius 0.5, Height 2 and Axis Y; below it a red message reads Ammo module not found, with an Import Ammo button."><figcaption><p><em>Import Ammo</em> adds the physics library that collisions need.</p></figcaption></figure>
      <p>Launch now and the camera's in the right place, but there's no way to move and nothing to collide with <page-anchor target="#video-nomFPf07Fmc" value="1109">18:29</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Give the ground a collision shape.</strong> <page-anchor target="#video-nomFPf07Fmc" value="1130">18:50</page-anchor> To stop the player falling through the floor, the ground needs two things. First, a <em>Collision</em> component. For a flat plane, set its <em>Type</em> to <em>Box</em> <page-anchor target="#video-nomFPf07Fmc" value="1154">19:14</page-anchor> and size it with <em>Half Extents</em> to cover the plane <page-anchor target="#video-nomFPf07Fmc" value="1164">19:24</page-anchor> (Z is one of the flat axes here), then lower it with <em>Position Offset</em> <page-anchor target="#video-nomFPf07Fmc" value="1191">19:51</page-anchor>. Instead, you can replace the plane with a box as the ground <page-anchor target="#video-nomFPf07Fmc" value="1203">20:03</page-anchor>, as the video does, or model the ground in Blender <page-anchor target="#video-nomFPf07Fmc" value="1215">20:15</page-anchor>. A <em>Mesh</em> collision fits the shape exactly, but not on something you've scaled: the editor warns that non-uniform scale mesh collision won't work as expected, so the video uses <em>Box</em> again <page-anchor target="#video-nomFPf07Fmc" value="1263">21:03</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Add rigid bodies.</strong> <page-anchor target="#video-nomFPf07Fmc" value="1319">21:59</page-anchor> A collision shape only reports that something touched it; it doesn't stop gravity <page-anchor target="#video-nomFPf07Fmc" value="1326">22:06</page-anchor>. For that, add a <em>Rigidbody</em> component: <em>Static</em> on the ground, so it doesn't move with gravity <page-anchor target="#video-nomFPf07Fmc" value="1342">22:22</page-anchor>, and <em>Dynamic</em> on the player, so physics moves it and it collides with the ground <page-anchor target="#video-nomFPf07Fmc" value="1349">22:29</page-anchor>. Without the ground's rigid body, the player falls forever when you launch <page-anchor target="#video-nomFPf07Fmc" value="1406">23:26</page-anchor>; with it, the player stands <page-anchor target="#video-nomFPf07Fmc" value="1428">23:48</page-anchor>.</p>
      <figure><img src="files/bringing-a-blender-scene-into-playcanvas-t1420.4.jpg" alt="The ground, a flat box, selected in the editor with a pink collision area around it. In the Inspector, its Collision component has Type Box, Half Extents 3.641, 0.5, 3.664 and Position Offset Y −0.335, and its Rigidbody component has Type Static, Friction 0.5 and Restitution 0.5."><figcaption><p>The ground: a box collision shape and a static rigid body.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Bring in your models</h2>

  <ol>
    <li>
      <p><strong>Upload your GLB files.</strong> <page-anchor target="#video-nomFPf07Fmc" value="1440">24:00</page-anchor> In the <em>Assets</em> panel, make a folder (the video calls it "models" <page-anchor target="#video-nomFPf07Fmc" value="1471">24:31</page-anchor>) and drag your GLB files into it <page-anchor target="#video-nomFPf07Fmc" value="1460">24:20</page-anchor>. Each becomes a folder: PlayCanvas processes it on its server into something it can use, one at a time <page-anchor target="#video-nomFPf07Fmc" value="1478">24:38</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Add a model to the scene.</strong> <page-anchor target="#video-nomFPf07Fmc" value="1502">25:02</page-anchor> Open a model's folder and drag its <em>template</em> (the diamond icon) into the scene; the other items don't bring everything with them <page-anchor target="#video-nomFPf07Fmc" value="1519">25:19</page-anchor>. To make a model collide, give it the same two physics components as the ground <page-anchor target="#video-nomFPf07Fmc" value="1539">25:39</page-anchor>.</p>
      <figure><img src="files/bringing-a-blender-scene-into-playcanvas-t1540.4.jpg" alt="A blue door standing on the ground, just added to the scene. In the Assets panel, the door.glb folder holds blue-paint-wood and white-paint-wood materials, Cube.027 (Render), door (Template), door.glb (Model source) and door.glb (Container). The Inspector shows a Template Instance of door, with its Render component's two materials, blue-paint-wood and white-paint-wood."><figcaption><p>Each uploaded GLB becomes a folder; the template is what you drag into the scene.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Change its materials.</strong> <page-anchor target="#video-nomFPf07Fmc" value="1560">26:00</page-anchor> The model's materials come with it, and you can set them up as PBR materials; the video's only use a colour, in the <em>Diffuse</em> channel <page-anchor target="#video-nomFPf07Fmc" value="1567">26:07</page-anchor>. Copies of a model share their materials: change the colour on one door and both change <page-anchor target="#video-nomFPf07Fmc" value="1590">26:30</page-anchor>. For a different colour, duplicate the material and rename it (the video makes "red paint") <page-anchor target="#video-nomFPf07Fmc" value="1604">26:44</page-anchor>, then drop it onto the material's slot in the Inspector <page-anchor target="#video-nomFPf07Fmc" value="1635">27:15</page-anchor>. Materials belong to the <em>Render</em> component <page-anchor target="#video-nomFPf07Fmc" value="1665">27:45</page-anchor>.</p>
      <figure><img src="files/bringing-a-blender-scene-into-playcanvas-t1645.0.jpg" alt="Two doors side by side, the left one blue and the right one red with blue-grey panels. The selected door's Inspector shows Template Instance with 1 Override and View Diff, Revert All and Apply All buttons, and its Material #0 is now red-paint-wood. The Assets panel lists blue-paint-wood, red-paint-wood and white-paint-wood materials."><figcaption><p>A duplicated material, dropped onto one door's slot, makes that door red.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Check each model.</strong> <page-anchor target="#video-nomFPf07Fmc" value="1672">27:52</page-anchor> Bring in the rest of your models and look for problems: the video's boat went inside the door, because the door was selected <page-anchor target="#video-nomFPf07Fmc" value="1689">28:09</page-anchor>. A model like the boat is a set of objects you can change separately, but they work together <page-anchor target="#video-nomFPf07Fmc" value="1698">28:18</page-anchor>. Save the scene and launch it to check <page-anchor target="#video-nomFPf07Fmc" value="1715">28:35</page-anchor>.</p>
    </li>
  </ol>


  <h2>Add first-person movement</h2>

  <ol>
    <li>
      <p><strong>Create a script.</strong> <page-anchor target="#video-nomFPf07Fmc" value="1722">28:42</page-anchor> The video copies a first-person movement script from another of its projects (it says the script will be provided for you) <page-anchor target="#video-nomFPf07Fmc" value="1739">28:59</page-anchor>. In the <em>Assets</em> panel, make a new script asset and name it "firstPersonMovement" <page-anchor target="#video-nomFPf07Fmc" value="1760">29:20</page-anchor>. Keep scripts in a "scripts" folder at the top level of your assets, so they're easy to find <page-anchor target="#video-nomFPf07Fmc" value="1776">29:36</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Paste in the code.</strong> <page-anchor target="#video-nomFPf07Fmc" value="1799">29:59</page-anchor> Editing the script opens it in the code editor, in its own tab <page-anchor target="#video-nomFPf07Fmc" value="1806">30:06</page-anchor>. You don't need to understand the code: paste it in <page-anchor target="#video-nomFPf07Fmc" value="1849">30:49</page-anchor> and save it (<kbd>Cmd</kbd>+<kbd>S</kbd> on a Mac, <kbd>Ctrl</kbd>+<kbd>S</kbd> on Windows) <page-anchor target="#video-nomFPf07Fmc" value="1863">31:03</page-anchor>.</p>
      <figure><img src="files/bringing-a-blender-scene-into-playcanvas-t1865.8.jpg" alt="The PlayCanvas code editor in its own browser tab with firstPersonMovement.js open: code that checks the W, A, S and D keys (and Q) to set a direction, applies a force to the entity's rigid body, and turns the camera with the mouse. The status bar reads Saved firstPersonMovement.js."><figcaption><p>The movement script, pasted in and saved.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Attach it to the player.</strong> <page-anchor target="#video-nomFPf07Fmc" value="1868">31:08</page-anchor> Select <em>Player</em>, choose <em>Add Component → Script</em>, and pick <em>firstPersonMovement</em> from the list <page-anchor target="#video-nomFPf07Fmc" value="1880">31:20</page-anchor>. Click the script's <em>Parse</em> button: it reloads the script and shows its settings <page-anchor target="#video-nomFPf07Fmc" value="1929">32:09</page-anchor>. Set <em>camera</em> to your camera <page-anchor target="#video-nomFPf07Fmc" value="1936">32:16</page-anchor>, and lower <em>power</em> from 2500 to 800 <page-anchor target="#video-nomFPf07Fmc" value="1945">32:25</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Tune the player's physics.</strong> <page-anchor target="#video-nomFPf07Fmc" value="1902">31:42</page-anchor> On the first launch, the video moves far too fast, because the player's <em>Mass</em> is 1 <page-anchor target="#video-nomFPf07Fmc" value="1913">31:53</page-anchor>. It sets <em>Mass</em> to 100 and <em>Linear Damping</em> to 0.99, as on the player in its other project <page-anchor target="#video-nomFPf07Fmc" value="1945">32:25</page-anchor>. Next the player falls over, because the capsule is round at the bottom: set <em>Angular Factor</em> to 0 on all three axes <page-anchor target="#video-nomFPf07Fmc" value="1981">33:01</page-anchor>.</p>
      <figure><img src="files/bringing-a-blender-scene-into-playcanvas-t1992.8.jpg" alt="The player selected in the editor, beside the two doors and the boat. The Inspector shows Collision Type Capsule; Rigidbody Type Dynamic, Mass 100 and Linear Damping 0.99, with the Angular Factor's X field being edited; and the Script component with firstPersonMovement, its camera set to Camera, power 800 and lookSpeed 0.25."><figcaption><p>The finished player: a capsule collision shape, a dynamic rigid body and the movement script.</p></figcaption></figure>
    </li>
    <li>
