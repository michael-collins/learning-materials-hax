content: >
  <p>In this exercise, you will practice unwrapping UVs, exporting a UV map, and
  creating textures in 2D image editing software like Photoshop. You will then
  apply your textures to a polygonal model of the KEM Weber Airline Chair.</p>

  <oer-iframe
  src="https://youtube.com/embed/videoseries?list=PL-V2nChTadrUGw6OioaTkVBSCP12C9mjq"
  title="Texturing the Airline Chair Tutorial"></oer-iframe>

  <h2>Learning Objectives</h2>

  <ol>

  <li>Become familiarized with 3D software interface and terminology.</li>

  <li>Use modeling workflows to create high quality topology and edge flow.</li>

  <li>Perform fundamental polygonal modeling operations including mirror,
  extrude, loop cut, and subdivide.</li>

  </ol>

  <h2>Instructions</h2>

  <p><strong>Note:</strong> You should have a basic understanding of Blender's
  interface before completing this exercise. You should also complete the
  exercise called <strong>Modeling the Airline Chair</strong> prior to
  completing this exercise.</p>

  <ol>

  <li>Duplicate the modeling folder on your computer. <strong>This will be your
  project folder.</strong> Save all files to this folder.

  <ul>

  <li>If you were unable to produce a polygonal model, you can download the
  Airline Chair Model, and use it to complete the assignment.</li>

  </ul>

  </li>

  <li>Follow the video demonstration to create UV maps to texture the <a
  href="https://collection.cooperhewitt.org/objects/404536651/images/">KEM Weber
  Airline Chair</a>.</li>

  <li>Apply the scale transform to reset each polygonal object.</li>

  <li>Unwrap the chair’s parts’ UVs using the various methods and tools
  described in the tutorials.</li>

  <li>Export a UV map for each part and save it in the project folder as
  <strong><em>uv-arm.jpg</em></strong>,
  <strong><em>uv-cushion.jpg</em></strong><em>,</em> etc.</li>

  <li>Import the UV maps into Photoshop and create textures to match the Airline
  Chair as closely as possible.</li>

  <li>Save the textures as <strong><em>arm_color.jpg</em></strong>,
  <strong><em>cushion1_color.jpg</em></strong>, etc. in the project folder. Name
  the files in an organized in a logical way.</li>

  <li>In Blender, set up the chair’s textures so they are visible on the
  model.</li>

  <li>Save the 3D scene file as
  <strong><em>LASTNAME</em>-texturing-chair</strong> in the project folder.</li>

  <li>Compress the project folder once you’ve completed the tutorial and rename
  it <strong><em>LASTNAME</em>-texturing-chair.zip.</strong></li>

  <li>Upload the .zip file to the assignment dropbox.</li>

  <li>Double check that you’ve included all files and that your .zip file can be
  downloaded and opened.</li>

  </ol>

