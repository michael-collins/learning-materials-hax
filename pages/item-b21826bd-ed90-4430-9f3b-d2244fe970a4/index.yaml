content: >-
  <p>To give the Airline Chair textures and materials that match the photo, you
  first lay out its UVs. Before that, every object's scale should be reset to 1,
  or textures can come out stretched. In this short part you'll open the UV
  Editing workspace, see how a checker texture shows the problem, and apply the
  scale of each piece of the chair. You'll need your modeled chair. The video
  uses Blender 2.83.</p>


  <oer-video id="video-egWgHYmKwww"
  src="https://www.youtube.com/watch?v=egWgHYmKwww" title="Texturing the Airline
  Chair — Part 2: Applying Scale" credit="Michael Collins"
  credit-url="https://www.youtube.com/channel/UCp1cLW7rry_NKRhcH8bPfGg"></oer-video>


  <h2>Look at the UVs</h2>

  <ol>
    <li>
      <p><strong>Switch to the UV Editing workspace.</strong> <page-anchor target="#video-egWgHYmKwww" value="1">0:01</page-anchor> The tabs along the top of Blender are workspaces: default layouts set up for different workflows. A texturing workflow starts in <em>UV Editing</em> <page-anchor target="#video-egWgHYmKwww" value="26">0:26</page-anchor>, which shows the <em>UV Editor</em> on the left and the 3D Viewport on the right.</p>
      <figure><img src="files/applying-scale-t0022.4.jpg" alt="Blender in the Layout workspace with the smooth, grey Airline Chair in the viewport. The pointer is on the workspace tabs along the top (Layout, Modeling, Sculpting, UV Editing, Texture Paint, Shading and more), and a tooltip reads Active workspace showing in the window."><figcaption><p>The workspace tabs: each is a layout for a different workflow.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Check the chair with a checker texture.</strong> <page-anchor target="#video-egWgHYmKwww" value="41">0:41</page-anchor> Press <kbd>Tab</kbd> to go back to Object Mode and select all the objects. The video has already given them a texture that shows a checker pattern <page-anchor target="#video-egWgHYmKwww" value="50">0:50</page-anchor>, and it isn't spread evenly: some squares are really large, and others are very thin and stretched <page-anchor target="#video-egWgHYmKwww" value="66">1:06</page-anchor>.</p>
      <figure><img src="files/applying-scale-t0065.0.jpg" alt="Close-up of the selected chair in Material Preview. The arms are covered in thin, stretched stripes of light and dark grey, while the cushions show a few very large light and dark patches."><figcaption><p>A checker texture that's stretched and uneven across the chair.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>See where the UVs came from.</strong> <page-anchor target="#video-egWgHYmKwww" value="74">1:14</page-anchor> The main reason is that the UVs haven't been laid out yet. Select the side and press <kbd>Tab</kbd>: its UVs in the <em>UV Editor</em> are still those of the plane you started modeling from, and the chair is far more complex than a plane <page-anchor target="#video-egWgHYmKwww" value="86">1:26</page-anchor>.</p>
      <figure><img src="files/applying-scale-t0084.4.jpg" alt="UV Editing workspace. On the right, the chair's side is selected in Edit Mode, outlined in orange. On the left, the UV Editor shows its UVs as one square divided only by a few horizontal lines, the layout of the original plane."><figcaption><p>The side's UVs are still a flat plane's.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Apply the scale</h2>

  <ol>
    <li>
      <p><strong>Check each object's scale.</strong> <page-anchor target="#video-egWgHYmKwww" value="90">1:30</page-anchor> Before you lay out the UVs, make sure each object's scale is 1. Press <kbd>Tab</kbd> to go back to Object Mode and open the Sidebar in the 3D Viewport (<kbd>N</kbd>): <em>Scale</em> is on its <em>Item</em> tab. Click through the objects one at a time. On the side it's already 1, but the seat has an X scale that's been changed <page-anchor target="#video-egWgHYmKwww" value="104">1:44</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Apply the scale.</strong> <page-anchor target="#video-egWgHYmKwww" value="109">1:49</page-anchor> Press <kbd>Ctrl</kbd>+<kbd>A</kbd> and choose <em>Scale</em> from the <em>Apply</em> menu. That resets the scale to 1 without changing the object's size. Don't type 1 into the <em>Scale</em> fields: that actually scales the object rather than resetting it <page-anchor target="#video-egWgHYmKwww" value="113">1:53</page-anchor>.</p>
      <figure><img src="files/applying-scale-t0110.0.jpg" alt="The seat is selected, and the Sidebar shows its Scale X as 0.974 with Y and Z at 1.000. The Apply menu is open over the viewport with Scale highlighted, above All Transforms and Rotation and Scale. A key overlay shows Ctrl A."><figcaption><p><kbd>Ctrl</kbd>+<kbd>A</kbd> → <em>Scale</em> on the seat, whose X scale is 0.974.</p></figcaption></figure>
      <figure><img src="files/applying-scale-t0111.8.jpg" alt="The same view after applying: the seat's Scale reads 1.000 on X, Y and Z, its dimensions are unchanged, and an Apply Object Transform panel has appeared at the bottom of the viewport."><figcaption><p>After applying, the scale is 1 and the seat is the same size.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Do the same for every piece.</strong> <page-anchor target="#video-egWgHYmKwww" value="123">2:03</page-anchor> Go through the rest of the chair and apply the scale wherever it isn't 1. In the video, most of the objects hadn't had their scale applied, so check them all, including the small brackets <page-anchor target="#video-egWgHYmKwww" value="139">2:19</page-anchor>.</p>
    </li>
  </ol>


  <h2>Wrap-up</h2>

  <p>Applying the scale doesn't fix the stretched checker by itself, but it
  means the textures won't be stretched once you lay out the UVs <page-anchor
  target="#video-egWgHYmKwww" value="149">2:29</page-anchor>. Reset your
  transforms, especially the scale, as much as you can before you texture. Next,
  you'll unfold the chair's UVs.</p>

