content: >
  <p>In this exercise, you will learn how to model 3 snowflakes</p>

  <oer-iframe
  src="https://youtube.com/embed/videoseries?list=PLcAjW37cz5QlA1AFMxpkvj6JQwOxNygMy"
  title="Model a Snowflake Tutorial"></oer-iframe>

  <h2>Learning Objectives</h2>

  <ol>

  <li>Practice using 3D software interface and terminology.</li>

  <li>Use modeling workflows to create high quality topology and edge flow.</li>

  <li>Familiarize yourself with a cumulative number of hotkeys and operations
  (it's a good idea to keep a personal log of hotkeys and operators that you
  will likely use again, as you go).</li>

  </ol>

  <h2>Instructions</h2>

  <p>Welcome to the&nbsp;<strong>Blender 3D -Modeling Environment</strong>.

  <br>

  <br>

  I provided a playlist of several different versions of the demonstration for
  this assignment. I recommend checking out the two most recent ones to see a
  variety of different approached that might be used.

  <br>

  <br>

  For this assignment, create 3 unique snowflakes, based on the steps in the
  demonstration and submit 3 images (from good angles) of your model to Canvas
  and the <strong>corresponding discussion thread</strong> for review. Make sure
  that your assignment is titled in the following format:

  <br>

  <br>

  Last name, First name, the word "Lesson" followed by the Lesson number, and
  the word "Assignment" followed by the Assignment number.

  <br>

  <br>

  Example:

  Brill Ian Lesson x Assignment x

  <br>

  <br>

  Be sure to provide screen grabs or renders from 3 angles and the original
  blender file. Be sure to upload each file independently to facilitate ease in
  grading (so that the reviewer only need to download files when necessary).</p>

  <h2>Grading Rubric</h2>

  <oer-rubric rubric-id="exercise"></oer-rubric>
