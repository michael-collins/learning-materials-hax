content: >
  <p>In this exercise, you will practice polygonal modeling fundamentals and
  using reference images to create a chess piece</p>

  <oer-iframe
  src="https://youtube.com/embed/videoseries?list=PLcAjW37cz5QliQriwysglJwRIE6R8NP2f"
  title="Modeling a Basic Knight Tutorial"></oer-iframe>

  <h2>Learning Objectives</h2>

  <ol>

  <li>Practice working from reference images</li>

  <li>Practice using 3D software interface and terminology.</li>

  <li>Use modeling workflows to create high quality topology and edge flow.</li>

  <li>Familiarize yourself with a cumulative number of hotkeys and operations
  (it's a good idea to keep a personal log of hotkeys and operators that you
  will likely use again, as you go).</li>

  </ol>

  <h2>Instructions</h2>

  <p>This is the most basic of four demonstrations on how to complete the Knight
  assignment.&nbsp;

  If you complete this version you will receive full credit for this week's
  requirement to create a Knight for you Chess Set

  However, you are expected to watch all three demonstrations.&nbsp;

  They will show you how you might use new tools and methods to make your knight
  more unique or figurative.</p>

