content: >
  <p>In this exercise, you continue working on the sea creature. You will
  practice unwrapping UVs, exporting a UV map, and creating textures in 2D image
  editing software like Substance Painter and/or Photoshop.</p>

  <oer-iframe
  src="https://youtube.com/embed/videoseries?list=PL-V2nChTadrUU3MSAv9EfORij5j2E3uVv"
  title="Sea creature: Texturing Tutorial"></oer-iframe>

  <h2>Learning Objectives</h2>

  <ol>

  <li>Become familiarized with 3D software interface and terminology.</li>

  <li>Use texturing workflows to add color and texture to your polygonal
  models.</li>

  <li>Perform fundamental UV unwrapping operations including UV unwrap, mark
  seams, and project from view.</li>

  </ol>

  <h2>Instructions</h2>

  <ol>

  <li>Watch the tutorials in Learning Resources.</li>

  <li>Continue working from your model.</li>

  <li>Duplicate the sculpting assignment folder on your computer. <strong>This
  will be your project folder.</strong> Save all files to this folder.</li>

  <li>If you have not done so, retopologize the mesh.

  <ol>

  <li>Export the high-poly version of the mesh as FBX format (this is the
  non-optimized high-resolution mesh used for generating a normal map.)</li>

  <li>Export the retopologized low-poly version of the mesh as FBX format. (You
  will use the normal map baked from the other mesh)</li>

  </ol>

  </li>

  <li>Use Adobe Substance painter to create textures like the following.

  <ol>

  <li>BaseColor (Required)</li>

  <li>Height</li>

  <li>Roughness (Required)</li>

  <li>Metallic</li>

  <li>Normal (Required)</li>

  <li>Emissive</li>

  <li>Opacity</li>

  </ol>

  </li>

  <li>In Blender, set up the textures so they are visible on the model. You do
  not need to render an image.</li>

  <li>Save the 3D scene file as <code>LASTNAME-texturing-creature</code> in the
  project folder.</li>

  <li>Compress the project folder once you’ve completed the tutorial and rename
  it <code>LASTNAME-texturing-creature.zip</code>.</li>

  <li>Upload the .zip file to the assignment dropbox.</li>

  <li>Double check that you’ve included all files and that your .zip file can be
  downloaded and opened.</li>

  </ol>

