content: >
  <h2>Learning Objectives</h2>

  <p>Students completing DMD 100: Digital Multimedia Design Foundations will be
  able to do the following:</p>

  <ol>

  <li><strong>Objectives related to developing Process and Procedural Skills
  (Designing)</strong>

  <ol>

  <li>Integrate skills, knowledge, and creative practices in digital media in
  exploratory exercises that draw on content and methods from information
  sciences and technology, communications, and visual arts and design.</li>

  <li>Use digital technologies in multimedia projects through exploration,
  expression, and communication that engage a multiplicity of ideas, forms,
  actions, and settings.</li>

  <li>Gather and analyze information from research sources to identify and apply
  relevant content that can aid concept development, improve design processes
  and products.</li>

  </ol>

  </li>

  <li><strong>Objectives related to developing Critical Skills
  (Critiquing)</strong>

  <ol>

  <li>Adapt an interdisciplinary vocabulary of terms, methods, and processes to
  review applying information and critique ideas in individual contexts and
  collaborative settings</li>

  <li>Demonstrate communication skills by creating and presenting ideas,
  concepts, and designs in written, verbal, and visual forms.</li>

  <li>Implement new ideas and develop a diverse array of options for problem
  solving in response to critical review and the iterative design process for
  improving work.</li>

  </ol>

  </li>

  <li><strong>Objectives related to developing Attitudes and Awareness
  (Assessing context)</strong>

  <ol>

  <li>Recognize how influences, constraints, personal interests, ethics, and
  resources impact design decisions and creative options.</li>

  </ol>

  </li>

  </ol>
