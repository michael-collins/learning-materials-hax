  <p>Edsel's Law: How Bad Design Happens (p. 46-54) in Design and Truth by
  Robert Grudin</p>

  <h2>Prompt</h2>

  <p>In this chapter, Grudin describes the Edsel scale for measuring the quality
  of a design:</p>

  <ol>

  <li>Photograph an object not mentioned in the book that would earn <strong>low
  negative</strong> points. Write a detailed description of why you've allotted
  the object's points.</li>

  <li>Photograph an object not mentioned in the book that would earn
  <strong>high positive</strong> points. Write a description of why this would
  receive high positive points.</li>

  </ol>

  <p>Please keep in mind, the Edsel scale is not intuitive. Please make sure you
  fully understand how it works before proceeding. Post these examples and
  descriptions in this discussion board for conversation.</p>

