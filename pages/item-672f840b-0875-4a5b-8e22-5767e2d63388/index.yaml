content: >
  <p><img src="files/open-design-img@2x.jpg" alt="Excerpt from book, Open Design
  Now"></p>

  <p>In this lesson, you will be learning about <strong>open design</strong>, a
  paradigm where design operates in a transparent, self-initiated, and
  collaborative environment.</p>

  <p>You will continue to practice the Double Diamond design process by creating
  your third course project, where you will generate a physical prototype based
  on some common open design principles. You will also continue reading and
  responding to the writing prompts for <em>Design and Truth</em> book chapters,
  and will have the opportunity to watch a lecture by Thomas Lommee.</p>
