content: >
  <oer-draft note="Week 1 from the DART 413 course plan. Revise it, then Publish
  to show it to readers.">

  <p>Course overview; shop tour and safety culture; what digital fabrication
  means for artists and designers; the file → machine → object loop.</p>

  <h2>Ideas</h2>

  <p>Additive, subtractive, and formative process families; CAD → CAM → machine;
  the digital material (files as things); precision and repeatability; the
  workmanship of certainty vs. risk (Pye).</p>

  <h2>In class</h2>

  <ul><li>Intro lecture (40 min)</li><li>shop tour + safety orientation with the
  lab tech (60)</li><li>object autopsy kickoff (30)</li></ul>

