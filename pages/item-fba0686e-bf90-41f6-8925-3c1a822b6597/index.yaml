  <p>Model a Diamond</p>

  <oer-iframe
  src="https://youtube.com/embed/videoseries?list=PLcAjW37cz5Qnq4fsbvQw-IjrZd6EoMX1h"
  title="Modeling a Diamond Tutorial"></oer-iframe>

  <h2>Learning Objectives</h2>

  <ol>

  <li>Practice using 3D software interface and terminology.</li>

  <li>Use modeling workflows to create high quality topology and edge flow.</li>

  <li>Familiarize yourself with a cumulative number of hotkeys and operations
  (it's a good idea to keep a personal log of hotkeys and operators that you
  will likely use again, as you go).</li>

  </ol>

  <h2>Instructions</h2>

  <p>For this assignment, create your own interpretation of a diamond, based on
  observed techniques in the following videos.

  <br>

  <br>

  Make sure that your assignment is titled in the following format:

  <br>

  <br>

  Last name, First name, the word "Lesson" followed by the Lesson number, and
  the word "Assignment" followed by the Assignment number.

  <br>

  <br>

  Example:

  Brill Ian Lesson x Assignment x

  <br>

  <br>

  Be sure to provide screen grabs or renders from 3 angles and the original
  blender file.

  <br>

  <br>

  Be sure to upload each file independently to facilitate ease of grading (so
  that the reviewer only need to download files when necessary).</p>

  <h2>Grading Rubric</h2>

  <oer-rubric rubric-id="exercise"></oer-rubric>
