content: >-
  <p>Include a MS Word Doc that contains the following:</p>

  <ol>

  <li>After reviewing your feedback, please summarize the feedback that you were
  given.</li>

  <li>How will you be addressing the feedback you were given?</li>

  <li>Did the reviewers misinterpret or misunderstand the work? If so, how might
  this be prevented from happening in the future?</li>

  <li>(Optional) Do you have any recommendations to improve the review process
  for future students?</li>

  </ol>
