content: >
  <oer-draft note="Brief from the DART 413 course plan. Revise it, then Publish
  to show it to readers.">

  <p>Produce a series of at least five objects in which variation is designed —
  parametric, generative, or rule-based — and the series says something the
  single object cannot. Budget your print time; batch your jobs.</p>

  <h2>Theme: Multiples and variation</h2>

  <p>A series or edition in which variation is designed: a parametric family, a
  generative system, a set that changes across instances.</p>

  <p>Techniques: Parametric CAD; generative/scripted variation; FDM printing;
  batching</p>

  <h2>What to hand in</h2>

  <ul><li>The series</li><li>The system: parameters/rules and how they map to
  the objects</li><li>Process documentation incl. print budget vs.
  actual</li></ul>

  <h2>What you'll practise</h2>

  <ul><li>Design a system, not an object</li><li>Manage production across many
  jobs</li><li>Present a series with intent</li></ul>

  <p>Time: 3 weeks + crit</p>

  </oer-draft>
