content: >
  <p>DMD 400 is the third of three spine courses in the Bachelor of Design in
  Digital Multimedia Design (DMD) program at Penn State University. This program
  is the first entirely online multi-college undergraduate bachelor's degree
  program offered at Penn State.</p>

  <p>Visit the <a href="http://dmd.psu.edu/">DMD Program Hub</a> for more
  details.</p>

