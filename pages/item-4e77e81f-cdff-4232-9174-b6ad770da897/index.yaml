content: >-
  <p>Students will plan, build, and deliver a media art and design project that
  integrates a variety of methods relevant to their project in consultation with
  the instructor or project advisor. This project is included in a final group
  exhibition of work.</p>

  <h2>Measured by</h2>

  <ul>

  <li>Submission of all capstone deliverables on the schedule in Canvas:
  Proposal, Agreement Form, Proof of Ability, ongoing Production Reports,
  Discussion posts, Mid-production Video, Exhibition Statement, Project
  Document, Explainer Video, and Exhibition participation.</li>

  <li>Project incorporates reviewer feedback at midterm and final
  checkpoints.</li>

  </ul>

