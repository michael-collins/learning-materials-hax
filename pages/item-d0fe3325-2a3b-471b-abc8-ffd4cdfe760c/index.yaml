content: >-

  <p>Physically based rendering (PBR) describes surfaces by how they treat
  light, so they look real under any lighting. In these two parts you'll learn
  the PBR workflow in Blender and then use it on a whole scene. Part 1
  introduces the Principled BSDF (roughness, metallic, coat, glass, subsurface
  and emission), applies a downloaded PBR texture pack with Node Wrangler and
  explains what each of its maps does, and lights a scene with a Sky Texture or
  an HDRI. Part 2 makes a brutalist sculpture garden from start to finish:
  blocking out the space with skylights cut by Booleans, a camera at eye height,
  concrete, ground and metal materials from texture packs, a sculpture built
  from icospheres and curves, 3D lettering, and an afternoon and an evening
  render finished in Photoshop.</p>

  <p>You'll need Blender, a few free PBR texture packs and HDRIs (the videos use
  ambientCG; 2K is enough), and an image editor that opens 32-bit EXR files for
  finishing (the videos use Photoshop). The videos use Blender 4.2 on a Mac and
  render with Cycles, which is much faster with a good graphics card; where the
  videos use <kbd>Cmd</kbd> or <kbd>Option</kbd>, use <kbd>Ctrl</kbd> or
  <kbd>Alt</kbd> on Windows and Linux.</p>

