content: >
  <p>Before you start Compositor Pathway: can you answer these? Your answers
  aren't recorded.</p>

  <self-check title="Are you ready?">
    <p slot="question">What does keying do, and when would you use rotoscoping instead?</p>
    <p>Keying separates a subject from a uniform background, such as a green screen, by color. Rotoscoping draws animated mattes by hand where there is no clean key, for example when there was no green screen or the edges are hard to separate.</p>
  </self-check>

  <self-check title="Are you ready?">
    <p slot="question">Why do CG elements need matched lighting, shadows and color to sit convincingly in live-action footage?</p>
    <p>The eye notices when light direction, shadow softness, black levels, grain or color don't match the plate, and the element then looks pasted on. Matching them makes the CG element feel like part of the shot.</p>
  </self-check>
