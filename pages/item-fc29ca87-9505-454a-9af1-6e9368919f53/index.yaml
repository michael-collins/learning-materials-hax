title: Applying the animated texture and rendering the video
description: >-
  Play a 72-frame image sequence on the TV's screen in Blender as a glowing
  animated texture, and light the room with it. Render the scene in EEVEE as an
  image sequence, then make it into a video in After Effects and export an H.264
  MP4 with Media Encoder.
