content: >-
  <p>You'll put a three-second animation on the screen of the TV from Part 1 as
  an animated texture. First you'll render the animation from After Effects as a
  numbered sequence of PNG images. Then you'll play it on the screen in Blender,
  make the screen glow, and animate the room's light with it. Finally you'll
  render the scene from Blender as an image sequence and turn it into a video in
  After Effects: a lossless copy to keep and an H.264 MP4 to put online. You'll
  need the TV model from Part 1 (or a model of your own with a screen), Blender
  (the video uses Blender 2.90) with EEVEE, After Effects and Media Encoder. The
  image sequence for the screen is available to download, so you don't have to
  make your own <page-anchor target="#video-9gecnwpRE0g"
  value="1886">31:26</page-anchor>.</p>


  <oer-video id="video-9gecnwpRE0g"
  src="https://www.youtube.com/watch?v=9gecnwpRE0g" title="Animated Textures —
  Part 2" credit="Michael Collins"
  credit-url="https://www.youtube.com/channel/UCp1cLW7rry_NKRhcH8bPfGg"></oer-video>


  <h2>Render the screen animation as an image sequence</h2>

  <ol>
    <li>
      <p><strong>Check the composition's settings.</strong> <page-anchor target="#video-9gecnwpRE0g" value="47">0:47</page-anchor> The screen animation is an After Effects composition at 24 frames per second, three seconds long: 72 frames. In <em>Composition Settings</em> <page-anchor target="#video-9gecnwpRE0g" value="58">0:58</page-anchor>, <em>Frame Rate</em> is 24 and <em>Duration</em> is 0:00:03:00 (hours, minutes, seconds and frames). <em>Width</em> and <em>Height</em> are both 1024 px <page-anchor target="#video-9gecnwpRE0g" value="81">1:21</page-anchor>: a square, 1:1 image, so it fits Blender's square UV space.</p>
      <figure><img src="files/applying-the-animated-texture-and-rendering-the-vi-t0085.4.jpg" alt="After Effects' Composition Settings for Comp 1: Width and Height 1024 px, Frame Rate 24 frames per second, Duration 0:00:03:00. The timeline behind it lists four layers: Shape Layer 1, Dark P… Solid 1, White Solid 1 and squiggle."><figcaption><p>A 1024 by 1024, 24 fps, three-second composition: 72 frames.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>See how it's built.</strong> <page-anchor target="#video-9gecnwpRE0g" value="105">1:45</page-anchor> A shape layer, turned off, is a square that grows to fill the frame. The dark solid below it uses it as an <em>Alpha Inverted Matte</em> (set in the track matte column) <page-anchor target="#video-9gecnwpRE0g" value="141">2:21</page-anchor>, so the dark color gives way as the square grows and the screen seems to switch on. Under that is a white solid with a <em>Noise</em> effect, made coarser with a <em>Mosaic</em> effect because the noise on its own is too fine <page-anchor target="#video-9gecnwpRE0g" value="181">3:01</page-anchor>, and a layer with the squiggly line. Making these is beyond this tutorial; the image sequence is available to download for the exercise <page-anchor target="#video-9gecnwpRE0g" value="201">3:21</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Add it to the render queue as a PNG sequence.</strong> <page-anchor target="#video-9gecnwpRE0g" value="208">3:28</page-anchor> With the composition selected, choose <em>File → Export → Add to Render Queue</em>. After Effects' own renderer opens in the <em>Render Queue</em>. Click the <em>Output Module</em> setting (<em>Lossless</em>), change <em>Format</em> to <em>PNG Sequence</em> and click <em>OK</em> <page-anchor target="#video-9gecnwpRE0g" value="243">4:03</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Name the files and choose a folder.</strong> <page-anchor target="#video-9gecnwpRE0g" value="253">4:13</page-anchor> The output file name now has hash marks, [#####], which stand for the frame number: the first image is numbered 00000, the next 00001 and so on. Click the name to change it: replace the start (here with tv-screen_) and keep the hash marks <page-anchor target="#video-9gecnwpRE0g" value="272">4:32</page-anchor>. Make a new, empty folder for the images (here tv screen sequence) <page-anchor target="#video-9gecnwpRE0g" value="280">4:40</page-anchor> and click <em>Save</em>. Then click <em>Render</em>: After Effects saves one image for each of the 72 frames <page-anchor target="#video-9gecnwpRE0g" value="301">5:01</page-anchor>.</p>
      <figure><img src="files/applying-the-animated-texture-and-rendering-the-vi-t0285.8.jpg" alt="The Save dialog for the render: Save As reads tv-screen_[#####].png and File Format is PNG. In the Render Queue behind it, the Output Module is Custom: PNG Sequence."><figcaption><p>The hash marks become each frame's number.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Put the sequence on the screen in Blender</h2>

  <ol>
    <li>
      <p><strong>Unwrap the screen.</strong> <page-anchor target="#video-9gecnwpRE0g" value="344">5:44</page-anchor> You texture the screen like anything else. Select it and go to the <em>UV Editing</em> workspace, then press <kbd>A</kbd> to select all. Its UVs aren't laid out properly, so choose <em>UV → Unwrap</em> <page-anchor target="#video-9gecnwpRE0g" value="368">6:08</page-anchor>, and rotate the result if it comes out turned the wrong way <page-anchor target="#video-9gecnwpRE0g" value="373">6:13</page-anchor>. If it isn't close to a 4:3 shape, apply the object's scale before you unwrap, or the texture will stretch <page-anchor target="#video-9gecnwpRE0g" value="384">6:24</page-anchor>. The animation fills the whole square, so move the UVs up to the middle of the square <page-anchor target="#video-9gecnwpRE0g" value="399">6:39</page-anchor>: then the screen switches on evenly at the top and bottom.</p>
      <figure><img src="files/applying-the-animated-texture-and-rendering-the-vi-t0425.4.jpg" alt="The UV Editing workspace. On the left, the screen's UVs, a 4 by 4 grid, fill the width of the square UV space and are centered, with an equal strip of space above and below. On the right, the TV in Edit Mode with the screen's faces selected."><figcaption><p>Unwrapped and centered in the square the animation fills.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Add the image sequence.</strong> <page-anchor target="#video-9gecnwpRE0g" value="432">7:12</page-anchor> Go to the <em>Shading</em> workspace. From the file browser on the left, drag the first image of the sequence into the <em>Shader Editor</em>: it becomes an <em>Image Texture</em> node <page-anchor target="#video-9gecnwpRE0g" value="443">7:23</page-anchor>. Pressing <kbd>Shift</kbd>+<kbd>A</kbd> and searching for <em>Image Texture</em> does the same <page-anchor target="#video-9gecnwpRE0g" value="452">7:32</page-anchor>. Change <em>Single Image</em> to <em>Image Sequence</em> and set <em>Frames</em> to 72 <page-anchor target="#video-9gecnwpRE0g" value="462">7:42</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Line up the first frame.</strong> <page-anchor target="#video-9gecnwpRE0g" value="473">7:53</page-anchor> The files are numbered 00000 to 00071, which is 72 images. To check, select them all in the folder (<kbd>Cmd</kbd>+<kbd>A</kbd>, or <kbd>Ctrl</kbd>+<kbd>A</kbd> on a PC): it says 72 selected <page-anchor target="#video-9gecnwpRE0g" value="492">8:12</page-anchor>. Image sequences often start at 0 rather than 1, but Blender matches frame 1 to the image numbered 1 <page-anchor target="#video-9gecnwpRE0g" value="510">8:30</page-anchor>. Set <em>Offset</em> to -1, so that frame 1 shows the image numbered 0 <page-anchor target="#video-9gecnwpRE0g" value="524">8:44</page-anchor>. Tick <em>Cyclic</em> and <em>Auto Refresh</em>: Auto Refresh updates the image in the viewport every time the frame changes <page-anchor target="#video-9gecnwpRE0g" value="538">8:58</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Connect it and give the screen its own material.</strong> <page-anchor target="#video-9gecnwpRE0g" value="543">9:03</page-anchor> Connect the node's <em>Color</em> to the <em>Base Color</em> of the <em>Principled BSDF</em> and scrub through the timeline: the screen animates <page-anchor target="#video-9gecnwpRE0g" value="584">9:44</page-anchor>. But the TV's objects all share one material, so the texture shows on all of them. Keep this material for the screen, named here tv-screen <page-anchor target="#video-9gecnwpRE0g" value="549">9:09</page-anchor>. For each of the other objects, remove the shared material and make a new one with its own name (here tv-plastic, metal-knob and tv-plastic-2) <page-anchor target="#video-9gecnwpRE0g" value="591">9:51</page-anchor>.</p>
      <figure><img src="files/applying-the-animated-texture-and-rendering-the-vi-t0590.0.jpg" alt="The Shading workspace. An Image Texture node, tv-screen_00000.png, is set to Image Sequence with Frames 72, Start Frame 1 and Offset -1, and Cyclic and Auto Refresh ticked. Its Color goes into the Base Color of a Principled BSDF. The material, tv-screen, still shows 3 users, and in the viewport both the screen and the panel show the texture."><figcaption><p>The image sequence as a texture. The material still has 3 users, so the panel shows it too.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Make the timeline 72 frames.</strong> <page-anchor target="#video-9gecnwpRE0g" value="621">10:21</page-anchor> With <em>Cyclic</em> on, the sequence repeats; with it off, it plays once <page-anchor target="#video-9gecnwpRE0g" value="627">10:27</page-anchor>. Set the timeline's <em>End</em> to 72, so that it's three seconds long <page-anchor target="#video-9gecnwpRE0g" value="638">10:38</page-anchor>. With 72 frames and 72 images they line up exactly, so it doesn't matter whether Cyclic is on.</p>
    </li>
  </ol>


  <h2>Make the screen glow</h2>

  <ol>
    <li>
      <p><strong>Choose how it glows.</strong> <page-anchor target="#video-9gecnwpRE0g" value="653">10:53</page-anchor> One way is an <em>Emission</em> shader in the material: the screen becomes a light source, the only one in the scene if you turn the light off <page-anchor target="#video-9gecnwpRE0g" value="681">11:21</page-anchor>, and you can turn up its <em>Strength</em> to make it really bright. The video uses the <em>Principled BSDF</em> instead, because it can also make the screen look like glass <page-anchor target="#video-9gecnwpRE0g" value="690">11:30</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Connect the texture to Emission as well.</strong> <page-anchor target="#video-9gecnwpRE0g" value="710">11:50</page-anchor> Leave the texture in <em>Base Color</em> and also connect its <em>Color</em> to the Principled BSDF's <em>Emission</em>, so the screen glows. Turn <em>Roughness</em> right down, as glass would be, and turn up <em>Clearcoat</em> <page-anchor target="#video-9gecnwpRE0g" value="724">12:04</page-anchor>, which adds a second reflection, as if there were a see-through surface on top. The glare is hard to see in EEVEE; switch to Cycles to check it <page-anchor target="#video-9gecnwpRE0g" value="755">12:35</page-anchor>.</p>
      <figure><img src="files/applying-the-animated-texture-and-rendering-the-vi-t0735.0.jpg" alt="The screen object on its own on frame 49, white with a black squiggly line. In the Shader Editor, the image sequence's Color goes into both Base Color and Emission of the Principled BSDF, with Roughness 0.032 and Clearcoat 1.000."><figcaption><p>The texture as both color and glow, with a glassy finish.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Finish the TV's materials</h2>

  <ol>
    <li>
      <p><strong>Color the plastic.</strong> <page-anchor target="#video-9gecnwpRE0g" value="771">12:51</page-anchor> Give the TV's plastic a darker color, with a little red in it.</p>
    </li>
    <li>
      <p><strong>Make the knob aluminum.</strong> <page-anchor target="#video-9gecnwpRE0g" value="790">13:10</page-anchor> Instead of setting up the material's values by hand, the video uses the PBR Materials add-on by 3D Wolf: <em>Metal</em>, then <em>Aluminum</em> <page-anchor target="#video-9gecnwpRE0g" value="803">13:23</page-anchor>. It then raises the roughness for a more matte finish, with less reflection, and turns up <em>Anisotropic</em> <page-anchor target="#video-9gecnwpRE0g" value="817">13:37</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Smooth the knob and bevel its rim.</strong> <page-anchor target="#video-9gecnwpRE0g" value="850">14:10</page-anchor> Shade the knob smooth and turn on <em>Auto Smooth</em> so it isn't smoothed too much. To get a highlight around the rim, add a <em>Bevel</em> modifier, reduce its size and give it 2 segments <page-anchor target="#video-9gecnwpRE0g" value="865">14:25</page-anchor>.</p>
    </li>
  </ol>


  <h2>Light the scene</h2>

  <ol>
    <li>
      <p><strong>Turn on EEVEE's effects.</strong> <page-anchor target="#video-9gecnwpRE0g" value="899">14:59</page-anchor> Go back to EEVEE: it's much faster to render than Cycles. In the <em>Render Properties</em>, tick <em>Ambient Occlusion</em>, <em>Bloom</em> and <em>Screen Space Reflections</em>, and increase the quality of the <em>Shadows</em> <page-anchor target="#video-9gecnwpRE0g" value="911">15:11</page-anchor>.</p>
      <figure><img src="files/applying-the-animated-texture-and-rendering-the-vi-t0920.0.jpg" alt="Render Properties with Render Engine set to Eevee: Ambient Occlusion, Bloom and Screen Space Reflections are ticked, and under Shadows, Cube Size is 4096 px, Cascade Size 1024 px, with High Bitdepth and Soft Shadows ticked. The viewport shows the TV with dark plastic and a white screen on the table, casting soft shadows."><figcaption><p>EEVEE's effects on, and higher-quality shadows.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Soften and place the light.</strong> <page-anchor target="#video-9gecnwpRE0g" value="920">15:20</page-anchor> Keep one light in the scene. In its settings, increase the <em>Radius</em> to soften the light <page-anchor target="#video-9gecnwpRE0g" value="927">15:27</page-anchor>, and move it forward, in front of the TV, for some room lighting <page-anchor target="#video-9gecnwpRE0g" value="937">15:37</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Animate the light with the screen.</strong> <page-anchor target="#video-9gecnwpRE0g" value="984">16:24</page-anchor> To make the whole room get brighter as the TV switches on, animate the light's <em>Power</em>. Go to the frame where the screen is fully on, hover over <em>Power</em> and press <kbd>I</kbd> to add a keyframe <page-anchor target="#video-9gecnwpRE0g" value="1001">16:41</page-anchor>. Go to an earlier frame, set Power to 0 and press <kbd>I</kbd> again <page-anchor target="#video-9gecnwpRE0g" value="1008">16:48</page-anchor>. If the light is too strong at full brightness, lower it (here to 350 W) and key it again <page-anchor target="#video-9gecnwpRE0g" value="1027">17:07</page-anchor>, and delete any keyframe you add by mistake <page-anchor target="#video-9gecnwpRE0g" value="1038">17:18</page-anchor>. Now the screen seems to be lighting the room.</p>
      <figure><img src="files/applying-the-animated-texture-and-rendering-the-vi-t1005.4.jpg" alt="Frame 11: the light's Power is 506.2 W in a yellow field, meaning it's keyed on this frame, and the Timeline shows a keyframe at frame 11. Radius is 2.24 m, and the TV's screen is lit white."><figcaption><p>Full brightness keyed on the frame where the screen is fully on.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Color the table and floor.</strong> <page-anchor target="#video-9gecnwpRE0g" value="1057">17:37</page-anchor> Give the table a simple wood color (a material named furniture) <page-anchor target="#video-9gecnwpRE0g" value="1064">17:44</page-anchor>, and the floor a bright color for contrast, here green <page-anchor target="#video-9gecnwpRE0g" value="1077">17:57</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Frame the shot.</strong> <page-anchor target="#video-9gecnwpRE0g" value="1086">18:06</page-anchor> Look through the camera and lock the camera to the view to frame the shot <page-anchor target="#video-9gecnwpRE0g" value="1095">18:15</page-anchor>.</p>
    </li>
  </ol>


  <h2>Render an image sequence from Blender</h2>

  <ol>
    <li>
      <p><strong>Check the output settings.</strong> <page-anchor target="#video-9gecnwpRE0g" value="1118">18:38</page-anchor> In the <em>Output Properties</em>, the resolution is 1920 by 1080 (1080p) by default. <em>Frame Start</em> and <em>End</em> are what's on your timeline, 1 to 72, and <em>Frame Rate</em> is 24 fps <page-anchor target="#video-9gecnwpRE0g" value="1130">18:50</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Choose a folder for the renders.</strong> <page-anchor target="#video-9gecnwpRE0g" value="1144">19:04</page-anchor> Click the folder icon under <em>Output</em> and make and choose a new folder (here renders) <page-anchor target="#video-9gecnwpRE0g" value="1150">19:10</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Keep the format PNG.</strong> <page-anchor target="#video-9gecnwpRE0g" value="1157">19:17</page-anchor> <em>File Format</em> is <em>PNG</em> by default. Don't choose a video format: exporting straight to a video file lowers the image quality, and bringing an image sequence into After Effects is something you may need to do later <page-anchor target="#video-9gecnwpRE0g" value="1164">19:24</page-anchor>. If you were making a short film and needed fine control over all the color information, such as exposure, you'd use <em>OpenEXR</em> <page-anchor target="#video-9gecnwpRE0g" value="1189">19:49</page-anchor>.</p>
      <figure><img src="files/applying-the-animated-texture-and-rendering-the-vi-t1180.8.jpg" alt="Output Properties with Resolution 1920 by 1080 px and Frame Start 1, End 72. The File Format menu is open, with Image formats such as PNG and OpenEXR on the left and Movie formats AVI JPEG, AVI Raw and FFmpeg video on the right; the setting below still reads PNG."><figcaption><p>Stay with PNG: an image sequence, not a movie.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Render the animation.</strong> <page-anchor target="#video-9gecnwpRE0g" value="1208">20:08</page-anchor> Choose <em>Render → Render Animation</em>. Instead of one image, Blender renders each frame in turn, from 1 to 72, into the folder <page-anchor target="#video-9gecnwpRE0g" value="1220">20:20</page-anchor>. It took about four minutes here <page-anchor target="#video-9gecnwpRE0g" value="1234">20:34</page-anchor>. A 30-second animation would take ten times as long, about 40 minutes, so keep render times in mind to finish your project on time <page-anchor target="#video-9gecnwpRE0g" value="1241">20:41</page-anchor>.</p>
    </li>
  </ol>


  <h2>Make the video in After Effects</h2>

  <ol>
    <li>
      <p><strong>Import the frames.</strong> <page-anchor target="#video-9gecnwpRE0g" value="1281">21:21</page-anchor> Start a new After Effects project; you don't need to make a composition. Drag the folder you rendered to, with just the images in it, into the <em>Project</em> panel <page-anchor target="#video-9gecnwpRE0g" value="1294">21:34</page-anchor>: the images come in as one piece of footage. You can also right-click and import the files <page-anchor target="#video-9gecnwpRE0g" value="1308">21:48</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Set the footage to 24 fps.</strong> <page-anchor target="#video-9gecnwpRE0g" value="1329">22:09</page-anchor> After Effects reads it at 30 frames per second. Right-click the footage, choose <em>Interpret Footage → Main</em>, set <em>Assume this frame rate</em> to 24 and click <em>OK</em> <page-anchor target="#video-9gecnwpRE0g" value="1337">22:17</page-anchor>. At 30 frames per second it would play too fast <page-anchor target="#video-9gecnwpRE0g" value="1379">22:59</page-anchor>.</p>
      <figure><img src="files/applying-the-animated-texture-and-rendering-the-vi-t1340.4.jpg" alt="The Interpret Footage dialog for [0001-0072].png, with Assume this frame rate set to 30 frames per second, ready to change. The Project panel behind it shows the PNG sequence at 1920 by 1080, 30 fps and 0:00:02:12 long."><figcaption><p>Read at 30 fps, the 72 frames last only 2.4 seconds. Set it to 24.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Make a composition.</strong> <page-anchor target="#video-9gecnwpRE0g" value="1353">22:33</page-anchor> Drag the footage down into the empty timeline (not onto the <em>Render Queue</em>): After Effects makes a composition for it, three seconds long <page-anchor target="#video-9gecnwpRE0g" value="1371">22:51</page-anchor>. Press <kbd>Space</kbd> to play it <page-anchor target="#video-9gecnwpRE0g" value="1385">23:05</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Add a vignette.</strong> <page-anchor target="#video-9gecnwpRE0g" value="1404">23:24</page-anchor> Effects are optional, but they're good practice. Open <em>Effect Controls</em> so you can see the effects. From <em>Effects &amp; Presets</em>, drag <em>CC Vignette</em> onto the footage and adjust its <em>Amount</em> <page-anchor target="#video-9gecnwpRE0g" value="1423">23:43</page-anchor>; the video starts at 18 and raises it later.</p>
    </li>
    <li>
      <p><strong>Add noise to hide banding.</strong> <page-anchor target="#video-9gecnwpRE0g" value="1441">24:01</page-anchor> Sometimes you'll see banding in the shading, where there isn't enough color information. Add <em>Noise</em> (under <em>Noise &amp; Grain</em>), second in the list of effects, and turn it up slightly <page-anchor target="#video-9gecnwpRE0g" value="1459">24:19</page-anchor>. It masks the banding and makes the picture feel a little more organic, more like film <page-anchor target="#video-9gecnwpRE0g" value="1476">24:36</page-anchor>.</p>
      <figure><img src="files/applying-the-animated-texture-and-rendering-the-vi-t1470.0.jpg" alt="Effect Controls for the footage layer: CC Vignette with Amount 70.0, then Noise with Amount of Noise 7.0%. The Effects &amp; Presets panel is searched for noise, with Noise highlighted under Noise &amp; Grain. The composition shows the darkened scene before the screen switches on."><figcaption><p>A vignette, then a little noise to hide banding.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Add a lens flare, if you must.</strong> <page-anchor target="#video-9gecnwpRE0g" value="1493">24:53</page-anchor> The video adds a <em>Lens Flare</em> while saying you shouldn't really ever do it. It drops the flare's brightness, moves it first in the list, above the vignette <page-anchor target="#video-9gecnwpRE0g" value="1511">25:11</page-anchor>, and keyframes <em>Flare Brightness</em>, as the light was keyframed in Blender <page-anchor target="#video-9gecnwpRE0g" value="1551">25:51</page-anchor>. To keyframe a property, turn on its stopwatch, then add keyframes <page-anchor target="#video-9gecnwpRE0g" value="1579">26:19</page-anchor>. This is entirely optional.</p>
    </li>
  </ol>


  <h2>Export the video</h2>

  <ol>
    <li>
      <p><strong>Render a lossless copy for your archive.</strong> <page-anchor target="#video-9gecnwpRE0g" value="1605">26:45</page-anchor> You want two renders. For your own archive, choose <em>File → Export → Add to Render Queue</em> and keep the <em>Lossless</em> output module: a very large file to make other compressed videos from <page-anchor target="#video-9gecnwpRE0g" value="1620">27:00</page-anchor>. Name it, choose where it goes and click <em>Render</em> <page-anchor target="#video-9gecnwpRE0g" value="1645">27:25</page-anchor>. Avoid naming files "final": it's never the final one <page-anchor target="#video-9gecnwpRE0g" value="1661">27:41</page-anchor>. The lossless file here is 450 MB, and it may not play back on your computer <page-anchor target="#video-9gecnwpRE0g" value="1691">28:11</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Send it to Media Encoder.</strong> <page-anchor target="#video-9gecnwpRE0g" value="1705">28:25</page-anchor> For the streaming version, choose <em>File → Export → Add to Adobe Media Encoder Queue</em>. Media Encoder is separate Adobe software, and it can take a minute or two to open <page-anchor target="#video-9gecnwpRE0g" value="1735">28:55</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Use H.264 with the Vimeo preset.</strong> <page-anchor target="#video-9gecnwpRE0g" value="1748">29:08</page-anchor> In the queue, open the preset menu and choose <em>Vimeo 1080p Full HD</em>, with the format <em>H.264</em> <page-anchor target="#video-9gecnwpRE0g" value="1757">29:17</page-anchor>. H.264 is what most online video streams with. Don't choose the others: HEVC is better, but too new for much to be compatible with it <page-anchor target="#video-9gecnwpRE0g" value="1765">29:25</page-anchor>. There's also a YouTube preset, but the Vimeo one works fine for YouTube too <page-anchor target="#video-9gecnwpRE0g" value="1875">31:15</page-anchor>.</p>
      <figure><img src="files/applying-the-animated-texture-and-rendering-the-vi-t1762.4.jpg" alt="Adobe Media Encoder's Queue: the Comp item has Format H.264, and the Preset menu is open with Vimeo 1080p Full HD ticked, among presets for Adobe Stock, Facebook, Twitter, Vimeo and YouTube."><figcaption><p>H.264 with the Vimeo 1080p Full HD preset.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Encode it and check the result.</strong> <page-anchor target="#video-9gecnwpRE0g" value="1797">29:57</page-anchor> Click the green start button. When it's done, click the output file's link to find it: it's in a temporary folder, so move it into your project folder <page-anchor target="#video-9gecnwpRE0g" value="1815">30:15</page-anchor> and rename it following the assignment's file naming <page-anchor target="#video-9gecnwpRE0g" value="1831">30:31</page-anchor>. There are some compression artifacts, but it's 6.5 MB against 450 MB for the lossless copy, without losing much visual quality <page-anchor target="#video-9gecnwpRE0g" value="1842">30:42</page-anchor>. This is the file you submit and upload to Vimeo.</p>
