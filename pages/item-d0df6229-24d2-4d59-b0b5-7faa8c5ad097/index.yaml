content: >
  <oer-pathway layout="matrix"></oer-pathway>

  <p>This pathway prepares students for careers in the game industry, focusing
  on the creation of 3D content for interactive and real-time applications.
  Students will learn to balance artistic quality with technical performance
  requirements, creating assets that work seamlessly in game engines and virtual
  reality platforms.</p>

  <h2>Who This Is For</h2>

  <p>This pathway is perfect for students interested in:</p>

  <ul>

  <li>Video game development</li>

  <li>Virtual reality experiences</li>

  <li>Augmented reality applications</li>

  <li>Interactive installations</li>

  <li>Mobile game development</li>

  </ul>

  <h2>Career Outcomes</h2>

  <p>Graduates will be prepared for roles including:</p>

  <ul>

  <li>3D Game Artist</li>

  <li>Environment Artist</li>

  <li>Character Artist</li>

  <li>Technical Artist</li>

  <li>VR/AR Developer</li>

  <li>Props Artist</li>

  </ul>
