content: >-
  <p>With the lights and materials working, the last steps are the camera and
  the finish. In this part you'll choose a focal length and a composition for
  the render camera, match the lens to the reference photo, make the backdrop a
  shadow catcher so the chair renders on a transparent background with its
  shadow, and then put a background behind it and boost the colour in Photoshop.
  You'll need the scene from the previous parts, the reference photos of the
  chair, and Photoshop or another image editor with layers. The video uses
  Blender 2.83 and Photoshop 2020.</p>


  <oer-video id="video-BKoH1v42WHo"
  src="https://www.youtube.com/watch?v=BKoH1v42WHo" title="Lighting and
  rendering the airline chair — Part 3" credit="Michael Collins"
  credit-url="https://www.youtube.com/channel/UCp1cLW7rry_NKRhcH8bPfGg"></oer-video>


  <h2>Choose a focal length</h2>

  <ol>
    <li>
      <p><strong>Select the camera.</strong> <page-anchor target="#video-BKoH1v42WHo" value="0">0:00</page-anchor> Go to the <em>Layout</em> workspace and switch the viewport to <em>Material Preview</em> so things go a little quicker. Select the camera by clicking its dotted outline in the camera view, or in the Outliner, and open its camera properties.</p>
    </li>
    <li>
      <p><strong>Try the focal length.</strong> <page-anchor target="#video-BKoH1v42WHo" value="28">0:28</page-anchor> Drag <em>Focal Length</em> to the left and you get a wide-angle lens; the field shows the equivalent in millimetres. Go the other way, to something like 80 mm, and the camera is too close and crops the chair, but a longer lens may give a more pleasing view.</p>
      <figure><img src="files/framing-the-shot-and-finishing-in-photoshop-t0038.0.jpg" alt="Looking through the camera at a 22 mm focal length: the chair is small in the middle of a wide view, with the lights' outlines around it. The camera properties show Lens, Type Perspective, Focal Length 22 mm."><figcaption><p>A short focal length gives a wide-angle view.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Compose the shot.</strong> <page-anchor target="#video-BKoH1v42WHo" value="54">0:54</page-anchor> Pull back, come down to a lower angle and reposition the camera. Drag the magnifying-glass button at the right of the viewport to zoom in slowly, and leave a bit of space at the top and bottom to centre the chair. A straight-on or side view would also work, though you'd have to move the backdrop <page-anchor target="#video-BKoH1v42WHo" value="81">1:21</page-anchor>.</p>
      <figure><img src="files/framing-the-shot-and-finishing-in-photoshop-t0078.8.jpg" alt="The camera view at 80 mm, from a lower angle: the whole chair is centred in the frame with some space above and below it. Focal Length reads 80 mm."><figcaption><p>At 80 mm, with room above and below the chair.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Match the reference photo's lens.</strong> <page-anchor target="#video-BKoH1v42WHo" value="94">1:34</page-anchor> Compare the camera view with the reference photo. The photo was taken with a wider lens; at 80 mm the chair looks flattened. You can guess the photographer's lens: move the camera to match the photo's angle, and from the distance across the bottom of the chair you can tell it isn't the same lens. Try 35 mm <page-anchor target="#video-BKoH1v42WHo" value="132">2:12</page-anchor>. It's not pixel perfect, but it's pretty close: the photo was probably shot with a 35 mm lens.</p>
      <figure><img src="files/framing-the-shot-and-finishing-in-photoshop-t0160.0.jpg" alt="The camera view, now at 35 mm and from the side and slightly in front, next to the reference photo side.jpg open in Preview: the render and the photo show the chair from almost the same angle and perspective."><figcaption><p>At 35 mm the camera view is close to the reference photo.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Turn the backdrop and render.</strong> <page-anchor target="#video-BKoH1v42WHo" value="164">2:44</page-anchor> The backdrop no longer faces the right way, so rotate it, and zoom out a little so the chair isn't cropped. Render. The background is a little dark <page-anchor target="#video-BKoH1v42WHo" value="183">3:03</page-anchor>.</p>
    </li>
  </ol>


  <h2>Brighten the background</h2>

  <ol>
    <li>
      <p><strong>Move the backdrop closer.</strong> <page-anchor target="#video-BKoH1v42WHo" value="191">3:11</page-anchor> You could add another light for the background. Instead, move the backdrop much closer so the light reaches it more easily (first switch the render window to <em>Slot 4</em> to keep the last render). That's more like a real photo studio: there isn't a huge space, just a room, so the backdrop is much closer to the object.</p>
      <figure><img src="files/framing-the-shot-and-finishing-in-photoshop-t0225.0.jpg" alt="A wide view of the scene from above: the backdrop, selected and outlined in orange, is very large next to the small chair and its lights. The Move panel shows Move X -7.7328 m."><figcaption><p>The backdrop moved much closer to the chair.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Make a quick test render.</strong> <page-anchor target="#video-BKoH1v42WHo" value="240">4:00</page-anchor> In the render settings, set <em>Sampling</em> › <em>Render</em> to 70 so it renders quickly. There's still some grey, so turn the sun up a bit <page-anchor target="#video-BKoH1v42WHo" value="259">4:19</page-anchor> (the video sets its <em>Strength</em> to 1.5). It's still hard to get rid of the grey in the background <page-anchor target="#video-BKoH1v42WHo" value="275">4:35</page-anchor>.</p>
    </li>
  </ol>


  <h2>Render on a transparent background</h2>

  <ol>
    <li>
      <p><strong>Rename the backdrop.</strong> <page-anchor target="#video-BKoH1v42WHo" value="279">4:39</page-anchor> Another way is to make the backdrop invisible in the render rather than deleting it. Select it and rename it from <em>Plane</em> to <em>backdrop</em> in the Outliner (double-click the name), so you'll recognize it later.</p>
    </li>
    <li>
      <p><strong>Make it a shadow catcher.</strong> <page-anchor target="#video-BKoH1v42WHo" value="299">4:59</page-anchor> In its object properties, open <em>Visibility</em> and check <em>Shadow Catcher</em>. A shadow catcher only renders the shadows that fall on it.</p>
      <figure><img src="files/framing-the-shot-and-finishing-in-photoshop-t0312.0.jpg" alt="The backdrop's object properties, Visibility panel: Show in Viewports, Show in Renders, Selectable and Shadow Catcher are checked, and a tooltip reads: Only render shadows on this object, for compositing renders into real footage."><figcaption><p><em>Shadow Catcher</em>, in the object's <em>Visibility</em> panel.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Turn on a transparent background.</strong> <page-anchor target="#video-BKoH1v42WHo" value="314">5:14</page-anchor> In the render properties, under <em>Film</em>, check <em>Transparent</em>. Nothing is rendered behind the chair, just transparent pixels, and the shadow catcher captures the shadows on the floor. The white backdrop still reflects white light onto the chair and helps light it, so you get the best of both, and you can choose the background more carefully in Photoshop.</p>
      <figure><img src="files/framing-the-shot-and-finishing-in-photoshop-t0330.8.jpg" alt="The render properties: Sampling shows Render 70 and Viewport 32, and under Film, Exposure 1.00, Pixel Filter Blackman-Harris 1.50 px, and Transparent checked. The Outliner now lists the backdrop by name."><figcaption><p><em>Transparent</em>, under <em>Film</em> in the render properties.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Render.</strong> <page-anchor target="#video-BKoH1v42WHo" value="371">6:11</page-anchor> The chair and its shadow render over a transparent, checkered background. On screen, the render settings show 250 samples again for this render.</p>
      <figure><img src="files/framing-the-shot-and-finishing-in-photoshop-t0372.0.jpg" alt="The render window, Slot 5, Time 03:41.00: the chair seen from the side, with its soft shadow on the floor, over a dark checkered background that shows transparency. The render settings show Render 250 and Film Transparent checked."><figcaption><p>The finished render: the chair and its shadow, with nothing behind them.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Save the image.</strong> <page-anchor target="#video-BKoH1v42WHo" value="373">6:13</page-anchor> In the render window, choose <em>Image</em> › <em>Save As</em>. The video saves it to the desktop as <em>chair-render-1.png</em>, a PNG with <em>RGBA</em> colour so the transparency is kept. If you make several renders as you find things to fix, number them at the end of the name to keep them straight.</p>
    </li>
  </ol>


  <h2>Finish it in Photoshop</h2>

  <ol>
    <li>
      <p><strong>Put a white background behind it.</strong> <page-anchor target="#video-BKoH1v42WHo" value="406">6:46</page-anchor> Open the image in Photoshop: there's one layer, with nothing behind it. Create a new layer with the plus icon at the bottom of the <em>Layers</em> panel, drag it below the render and rename it "bg". Press <kbd>Cmd</kbd> <kbd>Delete</kbd> to fill it with the background colour, white <page-anchor target="#video-BKoH1v42WHo" value="436">7:16</page-anchor>. Now you can see the chair on a pure white background.</p>
      <figure><img src="files/framing-the-shot-and-finishing-in-photoshop-t0444.4.jpg" alt="Photoshop 2020 with chair-render-1.png open: the chair and its shadow on a white background. The Layers panel shows Layer 1 above a white layer named bg."><figcaption><p>A white "bg" layer under the render.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Boost the saturation.</strong> <page-anchor target="#video-BKoH1v42WHo" value="451">7:31</page-anchor> The reference photo is much brighter and more saturated. Add a <em>Hue/Saturation</em> adjustment layer with the adjustment-layer button at the bottom of the <em>Layers</em> panel, and raise <em>Saturation</em> a bit <page-anchor target="#video-BKoH1v42WHo" value="468">7:48</page-anchor>. Switch it on and off to compare, and don't overdo it.</p>
    </li>
    <li>
      <p><strong>Try Vibrance as well.</strong> <page-anchor target="#video-BKoH1v42WHo" value="488">8:08</page-anchor> Another adjustment layer, <em>Vibrance</em>, can help: raise its <em>Vibrance</em> and its <em>Saturation</em>. More advanced adjustments, such as <em>Curves</em>, give a more finely tuned result <page-anchor target="#video-BKoH1v42WHo" value="512">8:32</page-anchor>, but this doesn't have to be exact: what matters is a good render you're happy with. That's a really simple compositing workflow: add a background and adjust the colour.</p>
      <figure><img src="files/framing-the-shot-and-finishing-in-photoshop-t0508.0.jpg" alt="The Properties panel for a Vibrance adjustment layer, with Vibrance +46 and Saturation +36. The chair's wood is a richer orange. The Layers panel shows Vibrance 1 and Hue/Saturation 1 above Layer 1 and bg."><figcaption><p><em>Vibrance</em> above <em>Hue/Saturation</em>: the wood's colour is much richer.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Choose a background colour, if you like.</strong> <page-anchor target="#video-BKoH1v42WHo" value="539">8:59</page-anchor> You can add a <em>Solid Color</em> fill layer above "bg" in any colour you want. Keep in mind it won't look realistic: a blue background isn't reflecting blue light onto the chair, so it isn't really part of the scene, more like a collage. The shadows still give it some relationship to the ground.</p>
      <figure><img src="files/framing-the-shot-and-finishing-in-photoshop-t0546.0.jpg" alt="The Color Picker (Solid Color) is open with a blue, hex 0379b6, and the background behind the chair is blue. A Color Fill 1 layer sits between Layer 1 and bg."><figcaption><p>A blue background: possible, but the chair doesn't reflect it.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Or pull it just off white.</strong> <page-anchor target="#video-BKoH1v42WHo" value="569">9:29</page-anchor> Add only a little colour to take the background off pure white. The video chooses a warmer, yellowy off-white: in the RGB values, where 255 is the highest, it's almost white but not quite (252, 250, 243).</p>
      <figure><img src="files/framing-the-shot-and-finishing-in-photoshop-t0622.0.jpg" alt="The finished composite in Photoshop: the chair, with richer colour and a soft shadow, on a warm off-white background. The Layers panel shows Vibrance 1, Hue/Saturation 1, Layer 1, Color Fill 1 and bg."><figcaption><p>The finished image on a warm off-white background.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Save it as a PNG.</strong> <page-anchor target="#video-BKoH1v42WHo" value="606">10:06</page-anchor> Save a copy as a PNG (the video names it <em>chair-render-comp.png</em>). When you submit it, rename it to the file name the exercise asks for.</p>
    </li>
  </ol>


  <h2>Wrap-up</h2>

  <p>A focal length close to the one in your reference makes the render look
  like the photo; a backdrop near the chair catches more light; and a shadow
  catcher with a transparent background lets you choose the background later,
  keeping the shadows and the light the white backdrop reflects. In Photoshop, a
  background layer and a couple of adjustment layers finish the image. That
  completes lighting, rendering and a little colour grading of the Airline
  Chair.</p>

