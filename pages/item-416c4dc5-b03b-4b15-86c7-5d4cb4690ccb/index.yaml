content: >
  <p>"In many ways, the built world was not designed for you. It was designed
  for the average person. Standardized tests, building codes, insurance rates,
  clothing sizes, The Dow Jones – all these measurements are based around the
  concept of an “average.” The average person is a term that is thrown around
  quite a lot, and design is often created for people who are average in some
  way. But does the average person actually exist? Listen to this 99 Percent
  Invisible Podcast as they investigate.</p>

  <p><a href="http://99percentinvisible.org/episode/on-average/">On Average</a>
  ** (20:50 min)**</p>
