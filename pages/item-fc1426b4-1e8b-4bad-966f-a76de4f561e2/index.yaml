content: >-

  <p>Procedural textures are built from shader nodes rather than painted images,
  and they can be animated. This series pairs two videos for making a stylized,
  animated waterfall and turning it into a video. Part 1 is a tutorial by <a
  href="https://www.youtube.com/@crzyzhaa">Zha Art</a> on making stylized
  animated water. Part 2 renders the finished animation from Blender as a
  sequence of PNG images, sets it to 24 frames per second in After Effects with
  Interpret Footage, and exports an H.264 MP4 with Media Encoder.</p>

  <p>You'll need Blender, After Effects and Media Encoder. Part 2 uses Blender
  4.2 and After Effects 2025, so some menus may look a little different in newer
  versions.</p>

