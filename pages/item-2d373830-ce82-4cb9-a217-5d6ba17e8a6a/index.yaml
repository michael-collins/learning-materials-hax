content: >-
  <p>Two modeling attitudes: parametric CAD (Fusion 360) and mesh/sculptural
  (Blender); parameters, constraints, families of objects; scanning as input
  (photogrammetry).</p><h2>Ideas</h2><p>Parametric design and the object as a
  family (Carpo: variable, identical, differential); form + code; scanning and
  the digital copy.</p><h2>In class</h2><ul><li>Lecture (30
  min)</li><li>parametric tutorial (60 min)</li><li>scan demo (30
  min)</li><li>work (60 min)</li></ul>
