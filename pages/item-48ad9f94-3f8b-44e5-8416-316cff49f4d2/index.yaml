content: >
  <p>For this project, you will produce 3D rendered images of products and other
  objects you experience every day, but with one slight difference. You will
  augment the object in such a way to inhibit its utility, material qualities,
  or its system or environmental context.

  &lt;br&gt;&lt;br&gt;

  To explore these concepts, we delve into the philosophical realm of objects
  and their existence, considering how we interact with them in both a
  functional and perceptual sense. <strong><em><a
  href="https://www.merriam-webster.com/dictionary/ontology">Ontology</a></em></strong>,
  the study of being, invites us to question not just what objects <em>are</em>
  but <em>how</em> they are—how they exist independently of human utility and
  purpose. By distorting or modifying the object, you are encouraged to explore
  the essence of its being outside of the roles assigned to it by human need or
  desire.

  &lt;br&gt;&lt;br&gt;

  We will also touch on the concept of hyper-objects—entities that transcend our
  immediate comprehension and experience, such as climate change or the
  internet. These phenomena challenge our usual boundaries of time, space, and
  perception. As you alter your chosen object, consider whether it can become
  something more than a mere item of daily use. Can its altered form push it
  into a new realm of being, perhaps even taking on characteristics of a
  hyper-object that defies easy understanding?

  &lt;br&gt;&lt;br&gt;

  <strong>Further reading:</strong>

  &lt;br&gt;&lt;br&gt;</p>

  <ol>

  <li><strong><a
  href="http://ezaccess.libraries.psu.edu/login?url=https://search.ebscohost.com/login.aspx?direct=true&amp;db=nlebk&amp;AN=672907&amp;site=ehost-live&amp;scope=site&amp;ebv=EB&amp;ppid=pp_Cover">Anthony
  Dunne &amp; Fiona Raby - <em>Speculative Everything: Design, Fiction, and
  Social Dreaming</em></a> (2013):</strong> Dunne and Raby explore the use of
  speculative design as a tool for reimagining objects and systems. This book
  will help you think critically about how design can question the status quo
  and offer alternative realities, which aligns with the idea of augmenting
  objects to alter their utility and context.</li>

  <li><strong><a
  href="http://ezaccess.libraries.psu.edu/login?url=https://search.ebscohost.com/login.aspx?direct=true&amp;db=nlebk&amp;AN=2332813&amp;site=ehost-live&amp;scope=site&amp;ebv=EB&amp;ppid=pp_15">Joseph
  Bedford - Is There an Object Oriented Architecture? : Engaging Graham
  Harman</a> (2020):</strong> Harman's work is central to Object-Oriented
  Ontology (OOO), a branch of metaphysics that explores the independence of
  objects from human perception. This book provides a foundational understanding
  of how objects interact with one another outside of human intervention.</li>

  <li><strong><a
  href="https://ebookcentral.proquest.com/lib/pensu/detail.action?docID=1477347">Timothy
  Morton - <em>Hyperobjects: Philosophy and Ecology after the End of the
  World</em></a> (2013):</strong> Morton introduces the concept of
  hyper-objects, entities that are massively distributed in time and space. His
  work helps us understand how objects might exist beyond immediate human
  comprehension, providing insight into the philosophical underpinnings of your
  project.</li>

  <li><strong><a
  href="https://www-jstor-org.ezaccess.libraries.psu.edu/stable/j.ctv111jh6w.2">Jane
  Bennett - <em>Vibrant Matter: A Political Ecology of Things</em></a>
  (2010):</strong> Bennett’s work on new materialism discusses the vitality of
  objects and their ability to act independently of human agency. This text
  expands on the idea that objects possess their own agency and liveliness.</li>

  <li><strong><a href="https://carbonfarm.us/555/bogost-ontography.pdf">Ian
  Bogost - <em>Alien Phenomenology, or What It’s Like to Be a Thing</em></a>
  (2012):</strong> This book explores the speculative philosophy of objects and
  offers a more accessible take on object-oriented thought, pushing you to think
  about objects beyond human-centered perspectives.</li>

  </ol>

  <h2>Learning Objectives</h2>

  <ol>

  <li>Demonstrate understanding of modeling, texturing, lighting and rendering
  using 3D software.</li>

  <li>Practice creative problem solving and visual storytelling skills.</li>

  <li>Explore ideas of material, form, and ontology through creative image
  production.</li>

  <li>Engage with conceptual questions related to the 'object' through a short
  work statement. (Your writing should be specific to your work, and not be
  generated via AI tools)</li>

  </ol>

  <h2>Requirements</h2>

  <p><strong>Pre-viz:</strong>&nbsp;</p>

  <ol>

  <li><strong>Sketches (.jpg or .png):</strong> label, and write ideas in
  physical/digital sketchbook.

  <ul>

  <li>Fill 3 to 5 pages of your sketchbook with project ideas. You may also work
  digitally if you prefer an all digital workflow, in which case, sketch the
  equivalent of 3 to 5 pages of a paper sketchbook.</li>

  <li>Upload&nbsp;<code>jpg</code>&nbsp;or&nbsp;<code>png</code>&nbsp;images of
  sketchbook pages.</li>

  <li>Must be clearly scanned or photographed. This should look professional, do
  not upload blurry, rotated, poorly cropped images.</li>

  </ul>

  </li>

  <li><strong>Reference sheet (.jpg or .png):</strong>&nbsp;Find reference
  images and put them into a large image canvas.&nbsp;<a
  href="https://3.bp.blogspot.com/-4Yut0Kf3RvM/VsMZtsN8XaI/AAAAAAAABLs/vHE3iQ7FtLw/s1600/Roman_Times_Moodboard_.jpg">See
  example</a>&nbsp;of mood board. Save as a single image.

  <ul>

  <li>You can use <a href="https://www.pureref.com/">PureRef</a>,
  Photoshop,&nbsp;<a href="https://www.mural.co/">Mural.co</a>, or similar
  tools.</li>

  <li>Submit references as a combined image as
  a&nbsp;<code>png</code>&nbsp;or&nbsp;<code>jpg</code></li>

  </ul>

  </li>

  <li><strong>Work intent (.doc):</strong>&nbsp;Describe what you will be doing.

  <ul>

  <li>Include name and date</li>

  <li>Short one sentence description of what you intend to make.</li>

  <li>Upload this in an MS Word&nbsp;<code>doc</code>&nbsp;format.

  &lt;br&gt;&lt;br&gt;</li>

  </ul>

  </li>

  </ol>

  <p><strong>Production (.jpg or .png):</strong></p>

  <ol>

  <li>Submit screenshots from Blender showing significant progress.</li>

  <li>Post your screenshots to the&nbsp;<strong>Project
  updates</strong>&nbsp;discussion thread.</li>

  <li>Meet with instructor if needed.

  &lt;br&gt;&lt;br&gt;</li>

  </ol>

  <p><strong>Work Statement (.doc):</strong></p>

  <p>A work statement is a clear articulation about what you’ve made. This is
  not a journal entry, where you might feel compelled to complain about problems
  you’ve had with software, or that it didn’t turn out how you wanted. Instead,
  imagine this is being printed in a magazine, or put on the side of a gallery.
  What do you want your viewers to come away with?

  &lt;br&gt;&lt;br&gt;</p>

  <p><strong>Include the following to create a clear work
  statement:</strong></p>

  <ol>

  <li>Your name and date</li>

  <li>Title of your work</li>

  <li>What did you create?

  <ul>

  <li>IE - “In this work, entitled&nbsp;<em>name-of-work</em>, I created images
  that depict …”</li>

  </ul>

  </li>

  <li>Why did you make it?

  <ul>

  <li>IE - “I created this work because I am interested in exploring …”</li>

  <li>IE - “This project is a response to the idea that …”</li>

  </ul>

  </li>

  <li>What is the work about?

  <ul>

  <li>IE - “This work is primarily focused on …”</li>

  </ul>

  </li>

  <li>How is what you’ve said the work is about demonstrated in the work you
  made?

  <ul>

  <li>Include examples. Try to avoid generalized statements, show specific
  links.</li>

  <li>IE - “You can see an example of this in the work where I have used … to
  reference …”</li>

  </ul>

  </li>

  <li>Were there any unexpected, interesting, or strange outcomes?

  <ul>

  <li><strong>Note:</strong>&nbsp;This is not a question/answer assignment, skip
  this if you aren’t sure what to write.</li>

  </ul>

  </li>

  <li>Did you have any interesting moments where the projects theme helped you
  understand something new or from a new perspective?

  <ul>

  <li><strong>Note:</strong>&nbsp;This is not a question/answer assignment, skip
  this if you aren’t sure what to write.</li>

  </ul>

  </li>

  </ol>

  <p>&lt;br&gt;&lt;br&gt;

  <strong>Upload work (.zip):</strong></p>

  <ol>

  <li>Images should be: 1920px by 1080px minimum.</li>

  <li>Upload final materials as
  a&nbsp;<code>LASTNAME-project1-files.zip</code>&nbsp;file

  <ol>

  <li>Include final work statement

  <ul>

  <li>MS Word .doc format</li>

  <li>150 words minimum</li>

  </ul>

  </li>

  <li>file name:&nbsp;<code>LASTNAME-project1-statement.doc</code></li>

  <li>Include the media you created</li>

  </ol>

  </li>

  <li>Post your render(s) to the&nbsp;<strong>Project
  discussion</strong>&nbsp;discussion thread.</li>

  <li>Participate in work critique with peers.</li>

  </ol>

  <h2>Instructions</h2>

  <ol>

  <li><strong>Read</strong> the project description and identify at least one of
  the listed readings to aid in the pre-viz research.</li>

  <li>Review the project <strong>requirements.</strong></li>

  <li><strong>Review links</strong> in Associated Material to see how artists
  and designers engage with related themes to the project.</li>

  <li>Go through the <strong>project development process</strong> (<em>See
  downloads for diagram image</em>):

  <ol>

  <li>Pre-viz (references, sketch, research)</li>

  <li>Intention Statement</li>

  <li>Production (model, texture, light, render) and post-production (color
  grade, export)</li>

  <li>Work Statement</li>

  </ol>

  </li>

  <li>You will engage in an online critique discussion of your work and that of
  your peers.</li>

  </ol>

