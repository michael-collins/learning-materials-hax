content: >

  <p>Digital Fabrication Studio explores how a diverse range of technologies can
  translate digital designs and data into the physical world. Through hands-on
  experience, we will work with laser cutting, CNC routing, 3D modeling, and 3D
  printing in a range of materials, to realize creative projects. An
  understanding of the tools, workflows, materials, and interdisciplinary
  possibilities surrounding computer-aided design and manufacturing will emerge
  throughout the course. We will become skilled in the appropriate hardware and
  2D/3D software through in-class exercises, one-on-one instruction, and video
  tutorials. Students are encouraged to consider a hybrid, analog-digital art
  practice that embraces both traditional craft and emerging technologies.
  Frequent in-progress critiques will encourage iterative processes and guide
  making. Assigned readings and class discussions will ask questions about the
  role these technologies play in the present, while prompting us to imagine
  their future potential.</p>

  <h2>By the end of the course you will be able to</h2>

  <ul><li>Distinguish 2D cutting, additive, and subtractive processes (and their
  formative and hybrid extensions) by what each can and cannot make, and select
  a process for a given form, material, and quantity with a stated
  rationale.</li><li>Operate the studio's laser cutter and 3D printers
  independently after certification, and the CNC router at the level of access
  the shop permits, following the shop's safety, material, and booking
  rules.</li><li>Prepare production-ready files — clean vectors with correct
  cut/score/engrave conventions, manifold meshes at correct scale and
  orientation, slicer and toolpath settings — and diagnose file problems before
  they reach a machine.</li><li>Measure and apply kerf, fit tolerance,
  orientation, and material constraints, and revise an object through at least
  three documented iterations, evaluating each against the last.</li><li>Model
  objects using both direct/sculptural and parametric methods, and generate a
  family of variants from a single definition.</li><li>Analyze digital
  fabrication through the histories of craft, industrial production, and the
  maker movement, and articulate — in writing and in critique — a position on
  what a machine-made object means in their own practice.</li><li>Document
  process and outcome — files, settings, tests, failures, finished work — in a
  portfolio another maker could reproduce from, and present that work
  publicly.</li><li>Give and receive critique that addresses concept, craft, and
  process, and revise work in response.</li></ul>
