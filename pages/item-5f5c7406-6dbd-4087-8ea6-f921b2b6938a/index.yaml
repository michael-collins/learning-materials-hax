title: Introduction to animation
description: >-
  Learn keyframe animation in Blender by animating a cube, a sphere that circles
  it and a camera that follows it: keyframes, parenting, curves in the Graph
  Editor, linear interpolation and a Track To constraint, then save the
  animation as a video.
