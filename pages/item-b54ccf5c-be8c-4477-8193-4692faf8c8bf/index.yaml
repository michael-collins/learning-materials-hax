content: >-
  <ol>

  <li>Please find a time on my calendar to meet via zoom: <a
  href="https://calendly.com/msc227">https://calendly.com/msc227</a>

  </li>

  <li>You can access the following Zoom room for the meeting: <a
  href="https://psu.zoom.us/my/michaelcollins">https://psu.zoom.us/my/michaelcollins</a>

  <ul>

  <li>Always take written or typed notes during meetings. You will likely not
  remember every detail of the discussion, particularly after a week or
  two.</li>

  <li>If you set a meeting less than 24 hours from when you are setting the
  meeting, send me an email confirmation. If you have to miss the meeting that
  you set, please cancel it, and send me an email notification. I may have a
  conflict not noted on my calendar, and I may choose to reschedule meetings as
  needed.</li>

  </ul>

  </li>

  <li>Submit a word document of your notes taken during our discussion. If we
  require a followup discussion, you can wait until after that second discussion
  to upload your notes.</li>

  </ol>
