  <h2>Project overview</h2>

  <p><strong>The project will consist of five phases:</strong></p>

  <ul>

  <li>Phase 1: Gather and organize (one week)</li>

  <li>Phase 2: Develop a design sprint (one week)</li>

  <li>Phase 3: Pitch (one week)</li>

  <li>Phase 4: Sprint! (three weeks)</li>

  <li>Phase 5: Document (concludes the Sprint)</li>

  </ul>

  <h2>Team Dynamics</h2>

  <p>Collaborating with a team is an essential skill for designers to practice.
  Synthesizing various people's ideas, articulating your intentions and
  critiques, and participating in a shared workflow are all invaluable to
  professional work.</p>

  <p>Finding a team that meshes immediately and is good at resolving internal
  conflict makes for a very productive and gratifying project experience.
  Unfortunately, when this doesn't happen, team dynamics can be
  counterproductive. If you run into any issues with your team members that
  cannot be resolved, please communicate with them with your instructor so they
  may step in and help mediate the situation.</p>

  <p>This project will move fast (it's a <em>sprint</em>, right?), so try not to
  spend too long discussing ideas and struggling to make everyone happy. Just
  find an idea and run with it. Think about how you can help your teammates, and
  look for opportunities to utilize your strengths and interests.</p>

  <h2>Assessment</h2>

  <p>This project is assessed as a team, meaning that <strong>each person in a
  group will receive the same grade</strong> — except for a <strong>10%
  Participation grade</strong>, which will be determined by input from your
  partners, your own self-grade, and your instructor.</p>

  <p>If a student has clearly not participated equally and not spent the
  requisite amount of time on the project, the instructor may further reduce
  your overall grade below that of your teammates.</p>

  <p>Each person's weekly activity reports are graded individually.</p>

  <p>All project deliverables must be met for the project to be graded. A
  non-submission or non-completion for any project phase is considered an
  incomplete project.</p>

  <h3>Rubric</h3>

  <p>More details available in Canvas.</p>

  <ul>

  <li>All deliverables and steps completed to appropriate degree: 30%</li>

  <li>Project concept: 20%</li>

  <li>Technical craft and aesthetics: 20%</li>

  <li>Research and design process: 20%</li>

  <li>Participation grade: 10%</li>

  </ul>
