  <h2>Description</h2>

  <p>In this project, you will work in small team to produce a design process,
  digital media, and documentation. Your team will build its own project by
  setting meeting agendas, creating a concept pitch, develop and use a design
  process/sprint structure, track and document progress using a project blog,
  and produce project documentation. The project outcomes can take the form of
  any combination of digital media formats including 2D, 3D, video and motion
  design, interactive and web, UX/UI app design, and product design. The
  projects could emphasize a wide range of approaches including tool building,
  product or service, marketing or awareness campaigns, calls to action,
  open-source tools, traditional or experimental digital story telling,
  speculative design, wayfinding, identity systems, toolkits, educational
  materials, etc.</p>

  <p>Avoid basing your project around existing intellectual properties (movies,
  comics, games, etc.) unless you do something conceptually sophisticated like a
  parody, deconstruction, etc.</p>

  <p>Please read through <a href="/articles/dmd300-project-categories">project
  categories</a> to learn more about the types of projects possible to produce
  and their production needs. While the media and form of your project is up to
  you, the following focus word should be used as a jumping off point for your
  project's concept.</p>

  <h2>Objectives</h2>

  <p><strong>The purpose of this project is to help you:</strong></p>

  <ul>

  <li>Gain experience working in a design team, including use of collaboration
  software and timely communication</li>

  <li>Practice developing a design process</li>

  <li>Practice evaluating and reflecting on the effectiveness of a design
  process</li>

  <li>Select and test design methods, techniques, and tools to produce digitally
  designed, critically engaged, and systemically considered creative
  explorations and outcomes</li>

  <li>Produce a detailed project document</li>

  <li>Practice publishing skills by keeping a <a
  href="http://sites.psu.edu/">team project blog</a></li>

  <li>Strengthen connections with peers for long term networking and
  support</li>

  </ul>

  <h3>The conceptual focus word for this project is: “Inclusive”</h3>

  <blockquote>

  <p>Inclusive Design is a methodology, born out of digital environments, that
  enables and draws on the full range of human diversity. Most importantly, this
  means including and learning from people with a range of perspectives.</p>

  </blockquote>

  <p>— <a href="https://www.microsoft.com/design/inclusive/">Microsoft Inclusive
  Design Toolkit</a></p>

  <blockquote>

  <p>Inclusive design doesn’t mean you’re designing one thing for all people.
  You’re designing a diversity of ways to participate so that everyone has a
  sense of belonging.</p>

  </blockquote>

  <p>— Kat Holmes for <a
  href="https://www.fastcompany.com/90243282/the-no-1-thing-youre-getting-wrong-about-inclusive-design">FastCompany</a></p>

  <p>"Inclusive design" is a specific methodology related to accessability (an
  attribute of any design) and <a
  href="http://universaldesign.ie/What-is-Universal-Design/">univeral design
  </a>(one-size-fits all); the FastCompany article above addresses the
  differences between these terms.</p>

  <p><strong>For this project, you can interpret the theme of "inclusive"
  however you see fit.</strong> You don't have to follow existing guidelines for
  inclusive design, but may wish to read about them. Think about unique
  perspectives, diverse audiences, and edge cases. Products like the <a
  href="https://gearjunkie.com/swiss-army-knife-history">Swiss Army Knife</a>
  and the <a
  href="https://americanhistory.si.edu/collections/search/object/nmah_1417719">OXO
  Good Grips peeler</a> were developed for specific users, but proved desireable
  for larger audiences.</p>

