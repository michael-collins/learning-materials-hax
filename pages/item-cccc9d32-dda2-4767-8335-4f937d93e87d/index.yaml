content: >
  <p><img src="files/dd-process-develop-1200px@2x.png" alt="Double Diamond
  Develop Phase graphic"></p>

  <p>Review your notes from the user test and make adjustments, clarifications,
  and revisions to improve your kit and instructions. Whether your users have
  given you general feedback or specific feedback, it is your job to interpret
  what they are telling you. In an ideal product development scenario, there
  would be plenty of time to perform as many iterations as needed. If time
  allows, try testing another one or two participants to see if you can further
  improve the instructions.</p>

  <h2>Instructions</h2>

  <ol>

  <li>Make changes and improvements to your kit and instructions based on your
  feedback in the user test.</li>

  </ol>

  <h2>Post work</h2>

  <p>Use the indicated file format. You must obtain prior approval to deviate
  from these upload requirements.</p>

  <ol>

  <li>Upload a <code>changelog.doc</code> file.</li>

  <li>Upload a <code>yourname-instructions-2.pdf</code> document. This should be
  a new and revised PDF document. Unrevised documents will not be graded.</li>

  </ol>
