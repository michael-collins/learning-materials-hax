content: >
  <p>In this exercise, level 1 students will practice keyframe animation to
  animate a bouncing ball</p>

  <oer-iframe
  src="https://youtube.com/embed/videoseries?list=PL-V2nChTadrVJwkuJN1Ht3GcuzXpue29M"
  title="Animating a bouncing ball Tutorial"></oer-iframe>

  <h2>Learning Objectives</h2>

  <ol>

  <li>Practice keyframe animation of translation, rotation, and scale
  properties.</li>

  <li>Become familiarized with keyframe animation.</li>

  <li>Apply principles of animation</li>

  </ol>

  <h2>Instructions</h2>

  <ol>

  <li>Watch linked tutorials in Learning Resources to get acquainted with
  animation tools.</li>

  <li>Create a project folder on your computer and save a new
  <code>.blend</code> file called <code>LASTNAME-ball-bounce.blend</code>.</li>

  <li>Follow the video demonstrations to animate a bouncing ball.

  <ul>

  <li>The duration of the animation should be at least 31 frames.</li>

  <li>Download and use the provided ball bounce reference image.</li>

  <li>Create a 9" sphere and apply the scale (<strong>CTRL</strong>+<strong>A ⟶
  Apply Scale</strong>).</li>

  <li>Following the reference, create an animation either by keyframing each
  frame or by using a motion path. Either technique will be accepted.</li>

  <li>Add squash and stretch to the sphere.</li>

  </ul>

  </li>

  <li>Export a rendered video.

  <ul>

  <li>To create a video file, save the file and set the render settings output
  folder to the project folder.</li>

  <li>Under <strong>File Format</strong>, choose <strong>FFMpeg Video</strong>,
  change the encoding format to <strong>MPEG-4</strong></li>

  <li>Under <strong>Codec,</strong> choose <strong>H.264</strong>.</li>

  <li>Choose <strong>Render</strong> ⟶ <strong>Render Animation</strong> to
  create the animation file.</li>

  </ul>

  </li>

  <li>Compress the project folder once you’ve completed the tutorial and rename
  it <code>LASTNAME-</code>ball-bounce<code>.zip</code>.</li>

  <li>Upload the .zip file to the assignment dropbox.</li>

  <li>Double check that you’ve included all files and that your .zip file can be
  downloaded and opened.</li>

  </ol>

  <h2>Grading Rubric</h2>

