content: >
  <oer-pathway layout="matrix"></oer-pathway>

  <p>This streamlined pathway focuses specifically on digital compositing
  skills, providing students with the technical and artistic abilities needed to
  work in post-production facilities. Students will learn to combine multiple
  elements into final, polished images for film, television, and digital
  media.</p>

  <h2>Who This Is For</h2>

  <p>This pathway is ideal for students interested in:</p>

  <ul>

  <li>Post-production and finishing</li>

  <li>Visual effects compositing</li>

  <li>Color grading and correction</li>

  <li>Motion graphics integration</li>

  <li>Commercial production</li>

  </ul>

  <h2>Career Outcomes</h2>

  <p>Graduates will be prepared for roles including:</p>

  <ul>

  <li>Digital Compositor</li>

  <li>Compositing Artist</li>

  <li>VFX Compositor</li>

  <li>Finishing Artist</li>

  <li>Color Grading Technician</li>

  <li>Junior Compositor</li>

  </ul>
