content: >-
  <p>The side of the Airline Chair is one continuous bent piece: the arm along
  the top, the front leg, and the runner along the floor. In this part you'll
  model it from a single plane over the reference image: first the overall
  proportions, then edge loops to follow its curves, then thickness and a
  <em>Subdivision Surface</em> modifier to smooth it, with supporting edges to
  keep its corners crisp. You'll need the reference image set up in Part 1, in
  the <em>Right Orthographic</em> view. The video uses Blender 2.83.</p>


  <oer-video id="video-vAu-gv560vI"
  src="https://www.youtube.com/watch?v=vAu-gv560vI" title="Modeling the Airline
  Chair – Part 2: Side" credit="Michael Collins"
  credit-url="https://www.youtube.com/channel/UCp1cLW7rry_NKRhcH8bPfGg"></oer-video>


  <h2>Block out the proportions</h2>

  <ol>
    <li>
      <p><strong>Add a plane and stand it up.</strong> <page-anchor target="#video-vAu-gv560vI" value="0">0:00</page-anchor> In Object Mode, add a plane. It comes in lying flat, which is the wrong way round for the side view, so rotate it 90 degrees on Y: press <kbd>R</kbd>, <kbd>Y</kbd>, type 90 and press <kbd>Enter</kbd>. Get the overall proportions down before adding any detail: in Edit Mode, stretch the plane to cover the full length of the arm, from the front of the chair to the back <page-anchor target="#video-vAu-gv560vI" value="22">0:22</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Extrude the leg and the runner.</strong> <page-anchor target="#video-vAu-gv560vI" value="31">0:31</page-anchor> The front leg comes straight down from the arm, so you need geometry there: add an edge loop with <kbd>Ctrl</kbd>+<kbd>R</kbd>, or use the <em>Loop Cut</em> tool in the toolbar on the left <page-anchor target="#video-vAu-gv560vI" value="44">0:44</page-anchor>. Press <kbd>2</kbd> for edge select mode, select the edge at the front, then press <kbd>E</kbd> to extrude it rather than move it. Pressing the middle mouse button while you drag constrains the movement to one axis <page-anchor target="#video-vAu-gv560vI" value="52">0:52</page-anchor>. Do the same for the back of the arm, which drops down at the end, and then add another loop at the foot of the leg and extrude its bottom edge back along the floor to make the runner <page-anchor target="#video-vAu-gv560vI" value="62">1:02</page-anchor>.</p>
      <figure><img src="files/modeling-the-side-t0082.0.jpg" alt="Edit Mode in the Right Orthographic view over the reference photo: a flat grey shape of a few large faces follows the arm along the top, the front leg down the left and the runner along the bottom, with a short drop at the back end of the arm. The extruded runner edge is still selected, with the move gizmo on it."><figcaption><p>The basic shape: a few big faces for the arm, leg, runner and the arm's back end.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Leave a notch for the brace.</strong> <page-anchor target="#video-vAu-gv560vI" value="91">1:31</page-anchor> At the back end of the arm, the wood has a notch cut out of it so that the next piece (the side brace, a separate object) fits into place. Add a loop where the notch starts, behind the metal bracket (its exact place doesn't matter, because you won't see it), then extrude the edge beyond it further down <page-anchor target="#video-vAu-gv560vI" value="112">1:52</page-anchor>. That step in the shape is the notch.</p>
    </li>
    <li>
      <p><strong>Straighten the reference if it's tilted.</strong> <page-anchor target="#video-vAu-gv560vI" value="130">2:10</page-anchor> The image came in straight, but the photo itself is slightly rotated. Press <kbd>Tab</kbd> to leave Edit Mode <page-anchor target="#video-vAu-gv560vI" value="159">2:39</page-anchor>, make the reference selectable again in the Outliner and select it. If you've locked its rotation, unlock it in the sidebar (<kbd>N</kbd>), rotate the image very slightly with <kbd>R</kbd> so the chair sits level, then lock it and make it unselectable again <page-anchor target="#video-vAu-gv560vI" value="173">2:53</page-anchor>. Press <kbd>Tab</kbd> to go back into Edit Mode on the side.</p>
    </li>
  </ol>


  <h2>Follow the outline with edge loops</h2>

  <ol>
    <li>
      <p><strong>Add several loops at once.</strong> <page-anchor target="#video-vAu-gv560vI" value="196">3:16</page-anchor> Press <kbd>Ctrl</kbd>+<kbd>R</kbd>, hover over the leg, and scroll the mouse wheel up to add more loops at once. Click, then press <kbd>Esc</kbd> to leave them evenly spaced where they are.</p>
      <figure><img src="files/modeling-the-side-t0199.8.jpg" alt="Loop Cut and Slide previewing yellow loops across the front leg of the blocked-out side, over the reference photo. The status bar reads Number of Cuts: 4. The sidebar is open on the right of the viewport."><figcaption><p>Scroll while loop cutting for more loops: here 4.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Make room to work.</strong> <page-anchor target="#video-vAu-gv560vI" value="207">3:27</page-anchor> Press <kbd>N</kbd> to hide or show the sidebar, and <kbd>T</kbd> for the toolbar. <kbd>Ctrl</kbd>+<kbd>Space</kbd> fills the window with the area under the mouse, and does the same again to go back <page-anchor target="#video-vAu-gv560vI" value="217">3:37</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Move the vertices onto the outline.</strong> <page-anchor target="#video-vAu-gv560vI" value="224">3:44</page-anchor> Press <kbd>1</kbd> for vertex select mode. Select vertices and press <kbd>G</kbd> to move them (the grab tool), and <kbd>Z</kbd> to constrain the move straight up and down, or use the move tool on the left <page-anchor target="#video-vAu-gv560vI" value="232">3:52</page-anchor>. With the move tool, drag the small square between the Y and Z arrows to move in both directions at once <page-anchor target="#video-vAu-gv560vI" value="339">5:39</page-anchor>. It doesn't have to be exact: get it close <page-anchor target="#video-vAu-gv560vI" value="246">4:06</page-anchor>.</p>
      <figure><img src="files/modeling-the-side-t0280.8.jpg" alt="The viewport filled to the whole window (Back to Previous at the top). The side's front leg now has several loops, and its vertices have been moved to follow the curved front edge of the leg in the photo; the bottom front corner is being shaped, with one vertex selected."><figcaption><p>Vertices moved onto the curve of the front leg.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Add supporting edges at corners.</strong> <page-anchor target="#video-vAu-gv560vI" value="267">4:27</page-anchor> Where the shape turns a tight corner, add a loop close to it: a supporting edge. Later, when a modifier smooths the shape by subdividing it, supporting edges hold the corners. Don't follow the photo's every curve: the bottom of the runner should be flat, and the photo probably has some lens distortion, so use your judgement, with just a slight curve up at the front <page-anchor target="#video-vAu-gv560vI" value="309">5:09</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Keep it low resolution.</strong> <page-anchor target="#video-vAu-gv560vI" value="414">6:54</page-anchor> Add a few more loops where the shape needs them to turn, but not too many: fewer vertices, edges and faces are easier to work with.</p>
    </li>
  </ol>


  <h2>Give it thickness and smooth it</h2>

  <ol>
    <li>
      <p><strong>Extrude the thickness.</strong> <page-anchor target="#video-vAu-gv560vI" value="428">7:08</page-anchor> Orbit out into the 3D view. On the reference, the wood looks about an inch thick, maybe a bit more <page-anchor target="#video-vAu-gv560vI" value="440">7:20</page-anchor>. Press <kbd>3</kbd> for face select mode, <kbd>A</kbd> to select everything, and <kbd>E</kbd> to extrude it <page-anchor target="#video-vAu-gv560vI" value="453">7:33</page-anchor>.</p>
      <figure><img src="files/modeling-the-side-t0465.8.jpg" alt="Object Mode, User Perspective: the side piece with thickness, an orange-outlined C shape of the arm, front leg, runner and the arm's dropped back end, still blocky with flat faces."><figcaption><p>The side with thickness, before smoothing.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Add a Subdivision Surface modifier.</strong> <page-anchor target="#video-vAu-gv560vI" value="459">7:39</page-anchor> Go to the <em>Modifier Properties</em> (the wrench icon) and add a <em>Subdivision Surface</em> modifier. It subdivides the geometry with the Catmull-Clark algorithm <page-anchor target="#video-vAu-gv560vI" value="477">7:57</page-anchor>. <em>Viewport</em> is the number of subdivisions you see while you work, and <em>Render</em> (2 here) is for rendering; as you raise Viewport, each quad is split into more faces <page-anchor target="#video-vAu-gv560vI" value="498">8:18</page-anchor>. Applying it would make those faces real geometry, so undo if you try it <page-anchor target="#video-vAu-gv560vI" value="510">8:30</page-anchor>: keep it as a modifier you can turn off and on.</p>
      <figure><img src="files/modeling-the-side-t0485.8.jpg" alt="The side piece now smooth and rounded, with the Subdivision Surface modifier in the Modifier Properties: Catmull-Clark selected, Render 2, Viewport 1, Quality 3, with Optimal Display and Use Creases ticked."><figcaption><p>The Subdivision Surface modifier at Viewport 1, Render 2.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Hold the bevelled edges with supporting loops.</strong> <page-anchor target="#video-vAu-gv560vI" value="515">8:35</page-anchor> The smoothing helps the curves, but it rounds off the crisp bevel along the wood's edges, especially on the outside. Press <kbd>Ctrl</kbd>+<kbd>R</kbd> on the piece and scroll up once for two loops running all the way round it. Instead of sliding them, scale them apart along X: press <kbd>S</kbd>, then <kbd>X</kbd>, and bring them close to the existing outside edges <page-anchor target="#video-vAu-gv560vI" value="550">9:10</page-anchor>.</p>
      <figure><img src="files/modeling-the-side-t0560.0.jpg" alt="A close-up of the side piece seen edge-on in Edit Mode. Two new orange edge loops run its length, and the header reads Scale: 0.6229 along global X; an X key press shows at the bottom."><figcaption><p>Two loops scaled apart along X, close to the outside edges.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Check the result smoothly shaded.</strong> <page-anchor target="#video-vAu-gv560vI" value="562">9:22</page-anchor> Turn off the wireframe overlay and choose <em>Shade Smooth</em>: the curve is smooth and the bevel stays crisp. Turn the viewport subdivisions up to 3 to see a production level of smoothness, the kind you'd render an animation or product model with <page-anchor target="#video-vAu-gv560vI" value="587">9:47</page-anchor>. Don't apply it: that's a tremendous amount of geometry. Leave it as a modifier you can turn off and on.</p>
      <figure><img src="files/modeling-the-side-t0600.8.jpg" alt="Object Mode, close on the smooth side piece at Viewport 3: the arm curves into the front leg with an even, rounded bend and crisp edges along its sides."><figcaption><p>At 3 subdivisions: smooth curves with crisp edges.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Refine the curves</h2>

  <ol>
    <li>
      <p><strong>Tighten the sharp corner, round the soft one.</strong> <page-anchor target="#video-vAu-gv560vI" value="616">10:16</page-anchor> The inside corner where the leg meets the runner should be fairly sharp: <kbd>Ctrl</kbd>+<kbd>R</kbd>, hover over an edge there and slide the new loop in close to the corner, which tightens the curve <page-anchor target="#video-vAu-gv560vI" value="624">10:24</page-anchor>. The outside corner should be fully curved, so it doesn't need a supporting edge <page-anchor target="#video-vAu-gv560vI" value="641">10:41</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Use X-ray to select through the model.</strong> <page-anchor target="#video-vAu-gv560vI" value="645">10:45</page-anchor> Now the piece has thickness, there are vertices behind the ones you see. Turn on X-ray, then press <kbd>1</kbd> and select the vertices, so you get the ones at the back too and not just the front <page-anchor target="#video-vAu-gv560vI" value="653">10:53</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Correct the reference's angle.</strong> <page-anchor target="#video-vAu-gv560vI" value="660">11:00</page-anchor> In the video, the first rotation of the reference was a little too much, so it's set to about 0.4 degrees in the sidebar (<kbd>N</kbd>).</p>
      <figure><img src="files/modeling-the-side-t0676.8.jpg" alt="The reference image selected, with the sidebar's Transform open: Rotation X 90 degrees, Y 0.407 degrees, Z 90 degrees, all with their padlocks. The smoothed side piece sits over the chair's photo, nearly matching the arm, leg and runner."><figcaption><p>The reference's rotation corrected to about 0.4°.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Move along the normal.</strong> <page-anchor target="#video-vAu-gv560vI" value="690">11:30</page-anchor> The tip of the runner loses its shape when it's smoothed, so add another supporting loop there. Its top should be a little more rounded, so change the <em>Transform Orientation</em> in the header from <em>Global</em> to <em>Normal</em>: the move arrow now points along the surface's normal, and moving the vertex along it opens up the distance between the two edges for a smoother result <page-anchor target="#video-vAu-gv560vI" value="705">11:45</page-anchor>. Switch back to <em>Global</em> afterwards <page-anchor target="#video-vAu-gv560vI" value="721">12:01</page-anchor>.</p>
      <figure><img src="files/modeling-the-side-t0710.0.jpg" alt="The runner's back tip in the Right Orthographic view, Edit Mode, with the header's Transform Orientation set to Normal. One vertex on the top of the tip is selected, and the move gizmo's arrows are tilted to match the surface."><figcaption><p>Transform Orientation set to Normal for the runner's tip.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Watch the edge flow.</strong> <page-anchor target="#video-vAu-gv560vI" value="727">12:07</page-anchor> Keep the curvature of the edges consistent. If you can't match a curve, that's usually a sign you need another edge <page-anchor target="#video-vAu-gv560vI" value="743">12:23</page-anchor>. It doesn't have to be pixel perfect. Add loops where the curves of the arm's end and the leg need them <page-anchor target="#video-vAu-gv560vI" value="770">12:50</page-anchor>, and space them as evenly as you can: even spacing gives the best edge flow <page-anchor target="#video-vAu-gv560vI" value="827">13:47</page-anchor>.</p>
      <figure><img src="files/modeling-the-side-t0840.8.jpg" alt="The rounded back end of the arm over the photo, in Edit Mode, with a grid of loops following its curve and a new loop being slid into place (Edge Slide in the header). The notch for the brace shows at the bottom beside the metal bracket."><figcaption><p>Evenly spaced loops around the end of the arm.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Use the Transform tool and avoid thin faces.</strong> <page-anchor target="#video-vAu-gv560vI" value="921">15:21</page-anchor> The <em>Transform</em> tool gives you move, rotate and scale at once, which helps for scaling loops apart. Try not to make really thin polygons: keep the faces roughly the same size <page-anchor target="#video-vAu-gv560vI" value="1011">16:51</page-anchor>.</p>
    </li>
  </ol>


  <h2>Round over the inner edges</h2>

  <ol>
    <li>
      <p><strong>Soften the inside edges.</strong> <page-anchor target="#video-vAu-gv560vI" value="1045">17:25</page-anchor> The inside edges of the piece should be rounded, not crisp. Select the supporting edges there and move them apart so they no longer hold a tight corner <page-anchor target="#video-vAu-gv560vI" value="1062">17:42</page-anchor>. Press <kbd>3</kbd> for faces, select the inner faces and scale them in along X (<kbd>S</kbd>, <kbd>X</kbd>) a little at a time, checking against the reference, until the inside curves over <page-anchor target="#video-vAu-gv560vI" value="1085">18:05</page-anchor>. Don't go too far. Because the model doesn't have much geometry, changes like this are easy.</p>
      <figure><img src="files/modeling-the-side-t1070.0.jpg" alt="A close-up in the 3D view of the inside of the front leg in Edit Mode, with the Transform tool active: its gizmo combines move arrows, rotation rings and scale handles. The edge of the leg is softly rounded."><figcaption><p>Rounding the inside of the leg with the Transform tool.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Orbit around what you're working on.</strong> <page-anchor target="#video-vAu-gv560vI" value="1132">18:52</page-anchor> If the view doesn't orbit around the part you have selected, choose <em>View → Frame Selected</em> with something selected, and the view resets around it.</p>
    </li>
    <li>
      <p><strong>Finish the back end.</strong> <page-anchor target="#video-vAu-gv560vI" value="1150">19:10</page-anchor> Round the inside of the arm's back end the same way, scaling its faces in along X, and check it against the reference <page-anchor target="#video-vAu-gv560vI" value="1180">19:40</page-anchor>.</p>
      <figure><img src="files/modeling-the-side-t1240.8.jpg" alt="The finished side piece in Object Mode, User Perspective: a smooth, continuous C shape with the arm across the top, rounded at the back end with the small notch at its bottom, the front leg, and the runner tapering to a point."><figcaption><p>The finished side, ready for the other pieces.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Wrap-up</h2>

  <p>You've modeled the chair's side from a single plane: blocked out with
  extruded edges, shaped with a small number of evenly spaced edge loops, given
  thickness, and smoothed with a Subdivision Surface modifier that supporting
  edges keep crisp where the wood is crisp. Next you'll model the side brace
  that fits into the notch.</p>

