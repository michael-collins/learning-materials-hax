  <p>Giorgio Vasari and the Permutations of Design (p. 85-87) in Design and
  Truth by Robert Grudin</p>

  <h2>Writing prompt</h2>

  <p>In this chapter, Grudin explores implications resulting from Vasari helping
  to establish the Accademia del Disegno in 1563. What were the results of this
  university's approach to design?</p>

  <p>Do you think the approach might have impacted the world into the 21st
  century? If not, why? If so, what are current examples of the impact or
  parallels to Vasari's conception of art and design?</p>

