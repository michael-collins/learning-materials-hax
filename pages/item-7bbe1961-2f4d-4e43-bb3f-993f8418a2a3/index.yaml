content: >
  <p>In this exercise, you will model an environment for your creature from the
  previous exercises. You will also set up NPR shaders, Freestyle lines, and use
  the compositor to achieve a comic visual style.</p>

  <oer-iframe
  src="https://youtube.com/embed/videoseries?list=PL-V2nChTadrWh22nK2hfnGbeEaxMp3s_e"
  title="Sea creature: Non-photorealistic rendering Tutorial"></oer-iframe>

  <h2>Learning Objectives</h2>

  <ol>

  <li>Become familiarized rendering workflows for non-photorealistic rendering
  (NPR)</li>

  <li>Gain understanding of lighting and materials for NPR</li>

  </ol>

  <h2>Instructions</h2>

  <ol>

  <li>Continue using your creature from the previous exercise. Model an indoor
  or outdoor environment and props.</li>

  <li>Follow the tutorials to add NPR shaders to your creature and the
  environment.</li>

  <li>Create shaders, materials, and freestyle lines to create a manga or comic
  book visual style.</li>

  <li>Choose an interesting composition.</li>

  <li>Use the compositing system in Blender to use blending modes and
  post-effects to enhance the visual quality as seen in the tutorials.</li>

  <li>Save a 1920x1080 render as LASTNAME-npr-creature.png in the project
  folder.</li>

  <li>Save your file as <code>LASTNAME-npr-creature.blend</code> in the project
  folder.</li>

  <li>Compress the project folder once you’ve completed the tutorial and rename
  it <code>LASTNAME-npr-creature.zip</code>.</li>

  <li>Upload the .zip file to the assignment dropbox.</li>

  <li>Double check that you’ve included all files and that your .zip file can be
  downloaded and opened.</li>

  </ol>

  <h2>Grading Rubric</h2>

  <oer-rubric rubric-id="exercise"></oer-rubric>
