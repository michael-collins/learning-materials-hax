content: >
  <ol>

  <li><strong>Team communications</strong>

  <ol>

  <li>Video conferencing

  <ul>

  <li>Zoom (<a href="https://psu.zoom.us">psu.zoom.us</a>)</li>

  <li>Skype</li>

  <li>Google Hangouts / Meet</li>

  <li>Slack (<a
  href="http://dmd-program.slack.com">dmd-program.slack.com</a>)</li>

  <li>Discord</li>

  <li><a href="https://www.loom.com">Loom</a> — record short video feedback on
  designs</li>

  </ul>

  </li>

  </ol>

  </li>

  <li><strong>Team management and tasks</strong>

  <ul>

  <li>Canvas group's page</li>

  <li>Mural: <a
  href="https://app.mural.co/invitation/team/dmd3007494?code=6c9320b6e2fe40b2b5f7bd0efed6a871&amp;sender=msc2278195">Member
  invite link</a>

  <ul>

  <li>For group/team projects, one person from each group should join Mural.co
  via this link, create the murals, and invite the rest of the team as guests.
  This account is limited to 10 members, and we cannot add everyone as members
  unfortunately.</li>

  <li>For individual student projects, you may create your own mural.com
  education account, and invite your instructor as a member.</li>

  </ul>

  </li>

  <li><a href="https://trello.com">Trello</a></li>

  <li><a href="https://basecamp.com/">Basecamp</a></li>

  <li><a href="http://asana.com">Asana</a></li>

  <li><a href="https://notion.so/">Notion</a></li>

  </ul>

  </li>

  <li><strong>Collaborative writing tools</strong>

  <ol>

  <li>Google Docs

  <ul>

  <li>Features include track changes, comments, chat, export as pdf, etc.</li>

  </ul>

  </li>

  <li><a href="https://office365.psu.edu">Office365</a> docs

  <ul>

  <li>Features include track changes, comments, chat, export as pdf, etc.</li>

  </ul>

  </li>

  <li><a href="https://www.gitbook.com">Gitbook.com</a> and Github.com

  <ul>

  <li>Developer centric writing and collaboration.</li>

  <li>Can write in markdown and publish to HTML very easily.</li>

  </ul>

  </li>

  </ol>

  </li>

  <li><strong>Collaborative Design Tools</strong>

  <ul>

  <li><a href="https://www.invisionapp.com/">InVision</a> collaborative image
  "Boards" and "Freehand" whiteboards.</li>

  <li>[Google Slides]

  <ul>

  <li>Simple way to share images and comments.</li>

  </ul>

  </li>

  <li><a href="https://www.figma.com/">Figma</a>

  <ul>

  <li>Design app for UI design, featuring online collaborative projects.</li>

  </ul>

  </li>

  </ul>

  </li>

  </ol>
