content: >
  <p>In this exercise, you will apply Image textures to a Chess board and
  pieces</p>

  <oer-iframe
  src="https://youtube.com/embed/videoseries?list=PLcAjW37cz5QlIH4xCkx3q86mJu84QpGOJ"
  title="Applying Textures to 3 Unique Chess Sets Tutorial"></oer-iframe>

  <h2>Learning Objectives</h2>

  <ol>

  <li>Practice using texture images and the UV editor</li>

  <li>Short introduction to material nodes</li>

  <li>Practice appending objects and importing containers into different blender
  files</li>

  </ol>

  <h2>Instructions</h2>

  <p><strong>This week we will begin adding textures and potentially materials
  to our chess sets</strong>

  &lt;br&gt;

  &lt;br&gt;<br>

  The following videos use a texture image found freely linked on this page.

  Additional. Texture images can be acquired for free from various online
  sources. Here is a possible source:&nbsp;<a
  href="https://freepbr.com/">https://freepbr.com/&nbsp;(Links to an external
  site.)</a>

  &lt;br&gt;

  &lt;br&gt;<br>

  <strong>The playlist videos for this week demonstrate:</strong>

  &lt;br&gt;

  • How to append / combine objects to a common blender file

  &lt;br&gt;

  • How to apply and manipulate textures on objects. I have included older
  videos that go over how to apply textures to some individual objects. These
  are considered additional viewing, in case they are helpful.

  &lt;br&gt;

  • Blender nodes are introduced in a practical manner, to demonstrate how
  textures can be used alongside materials.

  &lt;br&gt;

  &lt;br&gt;<br>

  <strong>For this assignment,&nbsp;you will submit 9 total images.</strong>

  &lt;br&gt;<br>

  Create three unique chess sets based on the steps in Demonstrations 1, 2 and
  tutorials.

  &lt;br&gt;<br>

  <strong>Submit three renders of each set to both <em>Canvas</em> <em>and the
  corresponding discussion thread for review</em>.</strong>&nbsp;

  &lt;br&gt;  Make sure that your assignment is titled in the following format:

  <strong>Last name, First name,</strong>&nbsp;the
  word&nbsp;<strong>"Lesson"</strong>&nbsp;followed by the&nbsp;<strong>Lesson
  number,</strong>&nbsp;and the&nbsp;<strong>word
  "Assignment"</strong>&nbsp;followed by the&nbsp;<strong>Assignment
  number.</strong>

  &lt;br&gt;<br>

  <strong>Example:</strong>&nbsp;Brill Ian Lesson x Assignment x</p>

