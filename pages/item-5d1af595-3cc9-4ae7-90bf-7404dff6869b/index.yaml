content: >-
  <p>Edge flow is the way a mesh's edge loops run over its surface. When they
  follow the shape of the body, the mesh bends cleanly once it's rigged. In this
  long part you'll keep working on the mirrored base mesh: adding edge loops and
  moving vertices to round off the head and give it a nose, shape the neck,
  shoulders and chest, slim the ankles, rough in the feet, and shape the arms
  and wrists. At the end you'll apply the Mirror modifier. This isn't a
  character modeling exercise, so the aim is a reasonable shape, not a perfect
  one. Watch how the mesh is structured, and use anatomy references if you want
  to go further. The video uses Blender 2.90.</p>


  <oer-video id="video-HtbduCFqVrs"
  src="https://www.youtube.com/watch?v=HtbduCFqVrs" title="Rigging Part 04 -
  Creating Edge Flow for Character Deformation" credit="Michael Collins"
  credit-url="https://www.youtube.com/channel/UCp1cLW7rry_NKRhcH8bPfGg"></oer-video>


  <h2>Round off the head</h2>

  <ol>
    <li>
      <p><strong>Add loops to the head.</strong> <page-anchor target="#video-HtbduCFqVrs" value="0">0:00</page-anchor> The head is blocky. Add a few edge loops to it with <kbd>Ctrl</kbd> <kbd>R</kbd>, so there are vertices to model it into a rounder shape. Turn X-ray off to get a clearer picture while you shape it <page-anchor target="#video-HtbduCFqVrs" value="25">0:25</page-anchor>.</p>
      <figure><img src="files/creating-edge-flow-for-deformation-t0014.4.jpg" alt="The character's head and shoulders in Edit Mode, with yellow loop-cut previews running down the head and the torso, and an existing loop selected in orange around the head. The status bar explains that the mouse wheel sets the number of cuts."><figcaption><p>More loops on the head give you vertices to round it off.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Make zooming easier with Frame Selected.</strong> <page-anchor target="#video-HtbduCFqVrs" value="33">0:33</page-anchor> If zooming is too fast or goes to the wrong place, select something and use <em>View → Frame Selected</em>. To keep it handy, right-click it in the menu and choose <em>Add to Quick Favorites</em>; then <kbd>Q</kbd> opens it <page-anchor target="#video-HtbduCFqVrs" value="57">0:57</page-anchor>. After framing, zooming in and out around that point is much more reasonable.</p>
      <figure><img src="files/creating-edge-flow-for-deformation-t0052.4.jpg" alt="The View menu open in Edit Mode, with Frame Selected highlighted and its right-click menu showing Remove from Quick Favorites (it's already been added), Change Shortcut, Remove Shortcut and Online Manual."><figcaption><p>Frame Selected in the View menu, already in Quick Favorites here.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Keep the middle vertices on the mirror line.</strong> <page-anchor target="#video-HtbduCFqVrs" value="77">1:17</page-anchor> In the side view, move the vertices that sit on the middle of the character with the move tool's plane handle that moves in Y and Z but not X. They have to stay exactly on the mirror line. And because of the Mirror modifier, you only ever select the vertices on one side <page-anchor target="#video-HtbduCFqVrs" value="110">1:50</page-anchor>.</p>
      <figure><img src="files/creating-edge-flow-for-deformation-t0088.0.jpg" alt="A corner of the blocky head in Edit Mode with one vertex selected and the move gizmo on it. The sidebar shows the vertex's X as 0 m, so it lies on the mirror line, and the gizmo's small plane handles are visible beside its arrows."><figcaption><p>A vertex on the middle line (X 0 m): move it in Y and Z only.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Aim for natural edge flow and square-ish faces.</strong> <page-anchor target="#video-HtbduCFqVrs" value="117">1:57</page-anchor> From here on, everything is about making the edge flow look correct and natural. Keep the polygons fairly square <page-anchor target="#video-HtbduCFqVrs" value="179">2:59</page-anchor>; avoid badly deformed ones, like a vertex pulled into a peak <page-anchor target="#video-HtbduCFqVrs" value="193">3:13</page-anchor>.</p>
      <figure><img src="files/creating-edge-flow-for-deformation-t0200.0.jpg" alt="The head in Edit Mode with one corner vertex pulled up and out into a sharp peak, stretching the faces around it into long thin shapes."><figcaption><p>A badly deformed shape: avoid pulling faces this far out of square.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Add a nose</h2>

  <ol>
    <li>
      <p><strong>Add a loop down the middle of the face.</strong> <page-anchor target="#video-HtbduCFqVrs" value="260">4:20</page-anchor> A nose needs more edges. Add one edge loop (the mirror makes the other side) and press <kbd>Esc</kbd> to leave it right in the middle <page-anchor target="#video-HtbduCFqVrs" value="272">4:32</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Curve it outward.</strong> <page-anchor target="#video-HtbduCFqVrs" value="289">4:49</page-anchor> The new loop is perfectly straight. Go to edge select mode and <kbd>Alt</kbd>-click it (<kbd>Option</kbd>-click on a Mac) to select the whole loop, then in the side view scale it a little along Y so it starts to follow the face's curve <page-anchor target="#video-HtbduCFqVrs" value="297">4:57</page-anchor>. In vertex mode, move its vertices a bit closer along X <page-anchor target="#video-HtbduCFqVrs" value="319">5:19</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Extrude the nose without an inside face.</strong> <page-anchor target="#video-HtbduCFqVrs" value="339">5:39</page-anchor> In face mode, select the face where the nose goes and extrude it. Watch out: a plain extrude here leaves an extra face inside the mesh on the mirror line, and moves off the axis. Undo, then press <kbd>E</kbd> and <kbd>Esc</kbd> (the extrude stays, without the movement) and move it straight out with the Y handle <page-anchor target="#video-HtbduCFqVrs" value="366">6:06</page-anchor>. With X-ray on, select the face that was created inside, press <kbd>X</kbd> and choose <em>Faces</em>, so there's no non-manifold geometry inside the mesh <page-anchor target="#video-HtbduCFqVrs" value="387">6:27</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Shape the nose.</strong> <page-anchor target="#video-HtbduCFqVrs" value="398">6:38</page-anchor> In the side view, press <kbd>1</kbd> for vertex mode and move the vertices roughly into a nose shape, then adjust them in the front view.</p>
      <figure><img src="files/creating-edge-flow-for-deformation-t0388.0.jpg" alt="The Right Orthographic side view, zoomed in on the face. The extruded nose points out to the left as a wedge, with its edges selected in orange as they're moved."><figcaption><p>The nose roughed in from the side.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Shape the head and neck</h2>

  <ol>
    <li>
      <p><strong>Move freely, but check several views.</strong> <page-anchor target="#video-HtbduCFqVrs" value="446">7:26</page-anchor> Bring the top of the head down to round it off. To move in all directions at once, drag the middle of the move tool: it moves in the plane of the view, so always check the result from more than one view <page-anchor target="#video-HtbduCFqVrs" value="458">7:38</page-anchor>.</p>
      <figure><img src="files/creating-edge-flow-for-deformation-t0465.0.jpg" alt="The head, now much rounder, in perspective in Edit Mode. A vertex on the top of the head is selected with the move gizmo's center circle, and the faces around it are close to square."><figcaption><p>A rounder head, with fairly square faces.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Fix stretched or folded faces.</strong> <page-anchor target="#video-HtbduCFqVrs" value="550">9:10</page-anchor> A face that's very stretched, or folded in half, deforms badly: move its vertices until it's closer to square. Soften any sharp peaks, like the one at the back of the head, and pull down a flat top <page-anchor target="#video-HtbduCFqVrs" value="605">10:05</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Shape the neck's profile.</strong> <page-anchor target="#video-HtbduCFqVrs" value="641">10:41</page-anchor> Add an edge loop in the neck, move it up slightly and bring the vertices in, so the profile from the jaw into the neck isn't so straight up and down.</p>
      <figure><img src="files/creating-edge-flow-for-deformation-t0675.8.jpg" alt="The head and neck from the front in Edit Mode, with the nose visible on the face. A vertex where the jaw meets the neck is being moved in, giving the neck a narrower profile under the head."><figcaption><p>Bringing the neck in under the jaw.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Shape the shoulders, chest and sides</h2>

  <ol>
    <li>
      <p><strong>Curve the shoulder into the neck.</strong> <page-anchor target="#video-HtbduCFqVrs" value="704">11:44</page-anchor> The transition from the shoulder to the trapezius muscle needs work. Try to make a curve between the shoulder and the neck; how it should look depends on the character.</p>
    </li>
    <li>
      <p><strong>Add a shelf for the chest.</strong> <page-anchor target="#video-HtbduCFqVrs" value="782">13:02</page-anchor> Add an edge loop below the shoulder edges and pull the vertices out a little to make a shelf where the pectoral muscles would be. Bring the shoulder blade out too <page-anchor target="#video-HtbduCFqVrs" value="801">13:21</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Add a loop around the side.</strong> <page-anchor target="#video-HtbduCFqVrs" value="821">13:41</page-anchor> Add an edge loop that runs around the side of the body, around the arm and up into the neck and head, and press <kbd>Esc</kbd> so it's exactly in the middle. Before scaling it, deselect the vertices at its ends that sit on the mirror line <page-anchor target="#video-HtbduCFqVrs" value="846">14:06</page-anchor>, otherwise they'd be pulled off the line and leave a hole. Then scale it slightly along X <page-anchor target="#video-HtbduCFqVrs" value="872">14:32</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Round off the body.</strong> <page-anchor target="#video-HtbduCFqVrs" value="936">15:36</page-anchor> Bring the vertices around the edges and sides of the character in a little to make a rounder shape. Topology like this is tricky, and a reference is really handy <page-anchor target="#video-HtbduCFqVrs" value="969">16:09</page-anchor>.</p>
    </li>
  </ol>


  <h2>Shape the legs and feet</h2>

  <ol>
    <li>
      <p><strong>Slim the ankles.</strong> <page-anchor target="#video-HtbduCFqVrs" value="1076">17:56</page-anchor> Ankles are fairly small. Select an ankle loop and scale it in along X.</p>
      <figure><img src="files/creating-edge-flow-for-deformation-t1095.8.jpg" alt="The lower legs and blocky feet in Edit Mode. A loop at one ankle is selected and being scaled, with the header reading Scale: 0.5886 along global X."><figcaption><p>Scaling an ankle in along X.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Rough in the foot.</strong> <page-anchor target="#video-HtbduCFqVrs" value="1141">19:01</page-anchor> Add an edge loop to the foot and shape it into something like a foot without a shoe. It's very hard without a reference, so use one if you want to do it accurately <page-anchor target="#video-HtbduCFqVrs" value="1210">20:10</page-anchor>. Then adjust the legs around the knees <page-anchor target="#video-HtbduCFqVrs" value="1238">20:38</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Add a loop in the middle of the torso.</strong> <page-anchor target="#video-HtbduCFqVrs" value="1298">21:38</page-anchor> Add one more edge loop around the middle of the torso and move it in.</p>
    </li>
    <li>
      <p><strong>Adjust the proportions if you want.</strong> <page-anchor target="#video-HtbduCFqVrs" value="1368">22:48</page-anchor> This character has short legs and a long torso; you could lengthen the legs, kick them out a little and bring the hips out. The video stops adjusting proportions here and moves on to the arms <page-anchor target="#video-HtbduCFqVrs" value="1410">23:30</page-anchor>.</p>
    </li>
  </ol>


  <h2>Shape the arms and wrists</h2>

  <ol>
    <li>
      <p><strong>Add a loop along the arm.</strong> <page-anchor target="#video-HtbduCFqVrs" value="1427">23:47</page-anchor> In the top view, add an edge loop running along the arm's profile and press <kbd>Esc</kbd>. Scale it along Y: that doesn't pull vertices off the mirror line, so there's nothing to deselect <page-anchor target="#video-HtbduCFqVrs" value="1453">24:13</page-anchor>. Scale the arm in where it's too thick.</p>
      <figure><img src="files/creating-edge-flow-for-deformation-t1458.8.jpg" alt="The character in perspective in Edit Mode, with a new edge loop running the length of one arm and around the hand selected in orange. The header reads Scale: 1.0876 along global Y."><figcaption><p>A loop along the arm, scaled along Y.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Shape the shoulder.</strong> <page-anchor target="#video-HtbduCFqVrs" value="1472">24:32</page-anchor> Add some geometry around the shoulder so it holds its shape, pull its vertices out and in, and push some up to make a curve <page-anchor target="#video-HtbduCFqVrs" value="1536">25:36</page-anchor>. In reality the chest's edge flow curves up to the top of the arm; there aren't enough edges to model that here, so just rough out the shoulder, with a slight dip where it meets the trapezius and the neck <page-anchor target="#video-HtbduCFqVrs" value="1587">26:27</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Make the wrist.</strong> <page-anchor target="#video-HtbduCFqVrs" value="1612">26:52</page-anchor> Scale the end of the arm along Z and move it up. Add an edge loop at the wrist <page-anchor target="#video-HtbduCFqVrs" value="1642">27:22</page-anchor>. To straighten it, start with the mouse pointer to one side of the loop, press <kbd>S</kbd> <kbd>X</kbd> and move toward it without crossing over <page-anchor target="#video-HtbduCFqVrs" value="1650">27:30</page-anchor>. Then scale along Y for a thinner wrist <page-anchor target="#video-HtbduCFqVrs" value="1668">27:48</page-anchor>. You could extrude a thumb, but the hand is left as a rough placeholder <page-anchor target="#video-HtbduCFqVrs" value="1694">28:14</page-anchor>.</p>
      <figure><img src="files/creating-edge-flow-for-deformation-t1658.4.jpg" alt="The forearm and hand in Edit Mode. A loop near the wrist is selected in orange and being flattened, with the header reading Scale: 0.3226 along global X."><figcaption><p>Straightening the wrist loop by scaling along X.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Shape the forearm.</strong> <page-anchor target="#video-HtbduCFqVrs" value="1710">28:30</page-anchor> Scale and move the forearm's vertices into shape, and move part of the arm back a little to give it a slight curve <page-anchor target="#video-HtbduCFqVrs" value="1770">29:30</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Check the arm's length.</strong> <page-anchor target="#video-HtbduCFqVrs" value="1819">30:19</page-anchor> The arms should reach about mid-thigh when lowered. In the video they're a little short, so the arms and then the hands are pulled out <page-anchor target="#video-HtbduCFqVrs" value="1838">30:38</page-anchor>.</p>
      <figure><img src="files/creating-edge-flow-for-deformation-t1877.0.jpg" alt="The finished low-poly character in Object Mode, selected in orange, standing in a T-pose with a rounded head and nose, shaped shoulders, slim wrists and ankles, and feet. The sidebar shows Rotation X 90 degrees, Scale 1 and Dimensions 12.4, 12.6 and 1.83 meters."><figcaption><p>The reshaped mesh: not perfect, but its edge flow follows the body.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Apply the Mirror modifier</h2>

  <ol>
    <li>
      <p><strong>Apply the mirror.</strong> <page-anchor target="#video-HtbduCFqVrs" value="1873">31:13</page-anchor> Go back to <em>Object Mode</em>, open the modifiers, and choose <em>Apply</em> from the Mirror modifier's dropdown. The mirrored character is now one solid mesh.</p>
    </li>
    <li>
      <p><strong>Add a Subdivision Surface, if you like.</strong> <page-anchor target="#video-HtbduCFqVrs" value="1888">31:28</page-anchor> You can also add a <em>Subdivision Surface</em> modifier and leave it on: it smooths everything out. With smooth shading, the character will deform smoothly too <page-anchor target="#video-HtbduCFqVrs" value="1916">31:56</page-anchor>. <em>Shade Flat</em> shows the model's facets if you want to see them <page-anchor target="#video-HtbduCFqVrs" value="1901">31:41</page-anchor>.</p>
      <figure><img src="files/creating-edge-flow-for-deformation-t1930.0.jpg" alt="The character smooth-shaded in Object Mode with a Subdivision Surface modifier, now soft and rounded. The modifier panel shows Catmull-Clark, Levels Viewport 1, Render 2 and Optimal Display on, and the Mirror modifier is gone."><figcaption><p>Mirror applied, with a Subdivision Surface modifier smoothing the result.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Wrap-up</h2>

  <p>The character now has edge loops where it needs to bend and edge flow that
  follows its shape, and it's one mesh, with the mirror applied. If it doesn't
  deform well once it's rigged, you can come back and change the geometry. Next
  you'll build the armature that will bend it.</p>

