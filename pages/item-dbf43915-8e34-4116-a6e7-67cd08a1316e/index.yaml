content: >
  <p>In this exercise, you will practice polygonal modeling fundamentals and
  will use 3D software to build a polygonal model of an interior space.</p>

  <oer-iframe
  src="https://youtube.com/embed/videoseries?list=PL-V2nChTadrVP_vzYSEfaSkkPDhMdPfrK"
  title="Modeling a room Tutorial"></oer-iframe>

  <h2>Learning Objectives</h2>

  <ol>

  <li>Become familiarized with 3D software terminology</li>

  <li>Practice polygonal modeling workflows</li>

  <li>Perform fundamental polygonal modeling operations including extrude,
  merge, bridge, and bevel.</li>

  </ol>

  <h2>Instructions</h2>

  <p><strong>Note:</strong> There are no step-by-step tutorials for this
  intermediate level exercise. See beginner level exercises if you need guided
  instruction.</p>

  <ol>

  <li>Watch the video playlist for relevant workflows and techniques to adapt
  for this exercise.</li>

  <li>Create a project folder. Save all assets to the project folder.</li>

  <li>Model a room in your home as a diorama.

  <ul>

  <li>The room should have only two walls to make it easier to render.</li>

  <li>Model a minimum of 5 unique objects or features in the room. The models
  can be simple and can have relatively low poly counts.</li>

  <li>Focus ONLY on modeling, you will add textures in a later exercise.</li>

  </ul>

  </li>

  <li>If you are unsure about how to proceed with modeling any of the objects,
  try searching tutorial resources. Reach out to your instructor with any
  workflow questions.

  <ul>

  <li>Focus on maintaining quads and good <a
  href="https://www.youtube.com/watch?v=Lip59doQQRk">edgeflow</a>.</li>

  </ul>

  </li>

  <li>Compress the project folder once you’ve completed the tutorial and rename
  it <code>YOURNAME-modeling-room.zip</code>.</li>

  <li>Upload the .zip file to the assignment dropbox.</li>

  <li>Ensure you’ve completed and included everything according to the
  instructions.</li>

  </ol>

  <h2>Grading Rubric</h2>

  <oer-rubric rubric-id="exercise"></oer-rubric>
