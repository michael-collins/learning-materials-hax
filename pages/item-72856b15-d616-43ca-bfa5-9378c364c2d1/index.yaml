content: >
  <p>Before you start CGI Foundations: can you answer these? Your answers aren't
  recorded.</p>

  <self-check title="Are you ready?">
    <p slot="question">Can you describe the main stages of a CGI project, from concept to final image?</p>
    <p>Concept and reference, modeling, UV mapping and texturing (shading), lighting, camera and layout, rendering, and compositing or output. Animation joins the pipeline when things move.</p>
  </self-check>

  <self-check title="Are you ready?">
    <p slot="question">What is the difference between modeling, texturing and lighting, and how does each affect the final render?</p>
    <p>Modeling defines the shape, texturing and shading define what surfaces are made of and how they react to light, and lighting reveals the form, sets the mood and directs the viewer's eye.</p>
  </self-check>
