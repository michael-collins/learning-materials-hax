content: >
  <p>In this exercise, you will create a final render of the KEM Weber Airline
  Chair. You will practice setting up 3-point lighting, adding cameras, creating
  a backdrop, optionally adding additional textures to the materials,
  configuring render settings, and doing some post-production cleanup in
  Photoshop.</p>

  <oer-iframe
  src="https://youtube.com/embed/videoseries?list=PL-V2nChTadrVabQ0miYe-Oy-PZe6Jab7Q"
  title="Lighting and Rendering the Airline Chair Tutorial"></oer-iframe>

  <h2>Learning Objectives</h2>

  <ol>

  <li>Become familiarized with the rendering process.</li>

  <li>Become familiarized with setting up and configuring lights and a
  backdrop.</li>

  <li>Practice color grading in Photoshop</li>

  </ol>

  <h2>Instructions</h2>

  <p><strong>Note:</strong> You should have a basic understanding of Blender's
  interface before completing this exercise. You should also complete the
  exercise called <strong>Modeling the Airline Chair</strong> prior to
  completing this exercise.</p>

  <ol>

  <li>Duplicate the texturing folder on your computer. <strong>This will be your
  project folder.</strong> Save all files to this folder.</li>

  <li>Follow the video demonstrations to light and render the <a
  href="https://collection.cooperhewitt.org/objects/404536651/images/">KEM Weber
  Airline Chair</a>.</li>

  <li>Enable <strong>Cycles</strong> rendering mode.</li>

  <li>Add a backdrop and three point lighting setup.</li>

  <li>Configure your render camera with a pleasing focal length and compose your
  layout.</li>

  <li>Configure the render settings <strong>sampling</strong> to be high enough
  to reduce noise. Somewhere between 250 and 750 should give good results.</li>

  <li>Render and import the image into Photoshop to adjust saturation,
  contrast.</li>

  <li>Save the render as <strong><em>LASTNAME</em>-rendering-chair.png</strong>,
  etc. in the project folder. Name the files in an organized in a logical
  way.</li>

  <li>Remove large Photoshop files that you may have in the project folder
  before compressing for upload.</li>

  <li>Save the 3D scene file as
  <strong><em>LASTNAME</em>-rendering-chair</strong> in the project folder.</li>

  <li>Compress the project folder once you’ve completed the tutorial and rename
  it <strong><em>LASTNAME</em>-rendering-chair.zip.</strong></li>

  <li>Upload the .zip file to the assignment dropbox.</li>

  <li>Double check that you’ve included all files and that your .zip file can be
  downloaded and opened.</li>

  </ol>

