content: >-
  <p>In this part you'll give the side of the Airline Chair a real wood texture,
  taken from a photo of the chair itself. You'll cut the side out of the photo,
  paste it into the UV layout in Photoshop, warp and patch it until it fits the
  UVs, and bring it into Blender, then give the edge banding a wood texture of
  its own. You'll need the UV layout file and the material from Part 4, and a
  photo of the chair or any wood texture you like. The video uses Blender 2.83
  and Photoshop 2020.</p>


  <oer-video id="video-gFglq5aaW1w"
  src="https://www.youtube.com/watch?v=gFglq5aaW1w" title="Texturing the Airline
  Chair — Part 5: Chair Side Texture" credit="Michael Collins"
  credit-url="https://www.youtube.com/channel/UCp1cLW7rry_NKRhcH8bPfGg"></oer-video>


  <h2>Bring the photo into the UV layout</h2>

  <ol>
    <li>
      <p><strong>Choose a texture.</strong> <page-anchor target="#video-gFglq5aaW1w" value="0">0:00</page-anchor> The video uses the chair's reference photos, opened in Photoshop, to be faithful to the original design <page-anchor target="#video-gFglq5aaW1w" value="30">0:30</page-anchor>. You don't have to: you can use any texture you want, for example one from a texture website. There's no prescribed or recommended texture.</p>
    </li>
    <li>
      <p><strong>Cut out the side.</strong> <page-anchor target="#video-gFglq5aaW1w" value="37">0:37</page-anchor> With the <em>Lasso</em> tool, select the side of the chair in the photo and copy it (<kbd>Cmd</kbd>+<kbd>C</kbd>).</p>
      <figure><img src="files/texturing-the-side-from-a-photo-t0058.8.jpg" alt="Photoshop with a side-on photo of the Airline Chair: a loose lasso selection, shown as marching ants, runs around the wooden side, from the arm's rounded front end down to the end of the leg."><figcaption><p>The side selected with the <em>Lasso</em> tool.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Paste it into the UV layout.</strong> <page-anchor target="#video-gFglq5aaW1w" value="57">0:57</page-anchor> In your UV layout file, delete the test layers you no longer need, turn the uv layer back on <page-anchor target="#video-gFglq5aaW1w" value="64">1:04</page-anchor> and paste (<kbd>Cmd</kbd>+<kbd>V</kbd>).</p>
    </li>
    <li>
      <p><strong>Scale it up and line it up.</strong> <page-anchor target="#video-gFglq5aaW1w" value="73">1:13</page-anchor> The photo is fairly low resolution, and you should always work with the highest-resolution textures you can get, but scaled up it's good enough here. Line it up with the side's UVs as closely as you can <page-anchor target="#video-gFglq5aaW1w" value="84">1:24</page-anchor>.</p>
      <figure><img src="files/texturing-the-side-from-a-photo-t0090.0.jpg" alt="The UV layout in Photoshop with the pasted photo of the side being scaled up in a Free Transform box. The photo's side is starting to cover the C-shaped wireframe of the side's UVs."><figcaption><p>Scaling the photo up over the side's UVs.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Fit it to the UVs</h2>

  <ol>
    <li>
      <p><strong>Fade and lock the UV layer.</strong> <page-anchor target="#video-gFglq5aaW1w" value="93">1:33</page-anchor> To make it easier to adjust the edges, lower the uv layer's opacity <page-anchor target="#video-gFglq5aaW1w" value="104">1:44</page-anchor> and lock the layer with the lock icon in the <em>Layers</em> panel <page-anchor target="#video-gFglq5aaW1w" value="111">1:51</page-anchor>.</p>
      <figure><img src="files/texturing-the-side-from-a-photo-t0115.8.jpg" alt="Close-up of the top corner of the side in Photoshop: the photo's wood shows through a faint wireframe of the UVs. In the Layers panel, the uv layer has a lock icon and its opacity is lowered."><figcaption><p>The uv layer, faded and locked, over the photo.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Warp the edges into place.</strong> <page-anchor target="#video-gFglq5aaW1w" value="127">2:07</page-anchor> Select the photo's layer, press <kbd>Cmd</kbd>+<kbd>T</kbd> for Free Transform and choose <em>Edit → Transform → Warp</em> <page-anchor target="#video-gFglq5aaW1w" value="133">2:13</page-anchor>. To work on just one area, such as the top corner, click a <em>Split</em> button in the options bar and click to split the warp there <page-anchor target="#video-gFglq5aaW1w" value="146">2:26</page-anchor>; then drag inside that region to move it <page-anchor target="#video-gFglq5aaW1w" value="149">2:29</page-anchor>. Look around for other areas that aren't quite staying inside the lines <page-anchor target="#video-gFglq5aaW1w" value="168">2:48</page-anchor>.</p>
      <figure><img src="files/texturing-the-side-from-a-photo-t0153.8.jpg" alt="The top corner of the side in Photoshop with a warp grid over the photo: split lines cross at the inside of the corner, and the options bar shows Split buttons and Warp: Custom."><figcaption><p>A split warp grid, to move just the top corner.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Clean it up with the Patch tool.</strong> <page-anchor target="#video-gFglq5aaW1w" value="235">3:55</page-anchor> Duplicate the layer and hide the copy first <page-anchor target="#video-gFglq5aaW1w" value="244">4:04</page-anchor>. Then turn off the uv layer and use the <em>Clone Stamp</em> or <em>Patch</em> tool (the video uses Patch) to get rid of extra information, such as the parts of the photo that cross in front of the side <page-anchor target="#video-gFglq5aaW1w" value="249">4:09</page-anchor>. It doesn't need to be perfect, as long as it looks right where the UVs are <page-anchor target="#video-gFglq5aaW1w" value="291">4:51</page-anchor>.</p>
      <figure><img src="files/texturing-the-side-from-a-photo-t0270.4.jpg" alt="Close-up of the side's front leg in Photoshop with the Patch tool active: two wavy selections on the wood, one dragged below the other, cover the place where the brace crossed the leg. The Layers panel shows a hidden Layer 3 copy."><figcaption><p>Patching out the brace where it crosses the side.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Line up the joints.</strong> <page-anchor target="#video-gFglq5aaW1w" value="337">5:37</page-anchor> Check that joins in the wood land where they should on the UVs. In the video, the joint where the leg meets the upright sits too low, so the leg is selected in the texture and moved up until the joint lines up with the inside corner of the UVs <page-anchor target="#video-gFglq5aaW1w" value="372">6:12</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Remove the bracket.</strong> <page-anchor target="#video-gFglq5aaW1w" value="388">6:28</page-anchor> Patch out the metal bracket at the back end of the arm too. If the patch comes out too bright, undo and try again <page-anchor target="#video-gFglq5aaW1w" value="426">7:06</page-anchor>.</p>
      <figure><img src="files/texturing-the-side-from-a-photo-t0400.8.jpg" alt="Close-up of the rounded back end of the arm in Photoshop, with a patch selection drawn around the small grey metal bracket where the brace meets the wood."><figcaption><p>Selecting the bracket to patch it out.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Put it on the model</h2>

  <ol>
    <li>
      <p><strong>Export and reload.</strong> <page-anchor target="#video-gFglq5aaW1w" value="445">7:25</page-anchor> Save, then export a PNG with the uv layer hidden, overwriting your color.png <page-anchor target="#video-gFglq5aaW1w" value="454">7:34</page-anchor>. In Blender's <em>Shading</em> workspace, reload the image by picking it again on the <em>Image Texture</em> node <page-anchor target="#video-gFglq5aaW1w" value="466">7:46</page-anchor>. The texture shows on the side in the viewport; the parts you haven't textured yet still use the white material <page-anchor target="#video-gFglq5aaW1w" value="480">8:00</page-anchor>.</p>
      <figure><img src="files/texturing-the-side-from-a-photo-t0476.4.jpg" alt="The Shading workspace: the side in the viewport now has the photo's warm, orange-brown wood on its face, with pale, untextured edges. Below, the color.png Image Texture node feeds the Principled BSDF's Base Color."><figcaption><p>The photo's wood on the side, through the same <em>Image Texture</em> node.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Texture the edge banding</h2>

  <ol>
    <li>
      <p><strong>Repeat it for the strips.</strong> <page-anchor target="#video-gFglq5aaW1w" value="492">8:12</page-anchor> Repeat the process to texture the rest of the side <page-anchor target="#video-gFglq5aaW1w" value="499">8:19</page-anchor>. The video gives the edge banding, including the inside corner, a more general wood texture so it contrasts with the side's wood <page-anchor target="#video-gFglq5aaW1w" value="508">8:28</page-anchor>. Hide the uv layer, export the PNG over color.png again <page-anchor target="#video-gFglq5aaW1w" value="522">8:42</page-anchor> and reload it in Blender <page-anchor target="#video-gFglq5aaW1w" value="534">8:54</page-anchor>.</p>
      <figure><img src="files/texturing-the-side-from-a-photo-t0510.4.jpg" alt="The UV layout in Photoshop with all of the side's islands filled: the photo's wood on the C shape, and a darker, even wood texture across the strips at the top and on the small piece in the middle. The Layers panel adds Layer 4 and a Hue/Saturation adjustment."><figcaption><p>A separate wood texture for the edge banding.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Check the result.</strong> <page-anchor target="#video-gFglq5aaW1w" value="541">9:01</page-anchor> The wood texture now covers the banding too. Some highlights from the original photo are baked into the texture, so you might clean those up so the seam isn't as jarring <page-anchor target="#video-gFglq5aaW1w" value="547">9:07</page-anchor>.</p>
      <figure><img src="files/texturing-the-side-from-a-photo-t0562.4.jpg" alt="Both of the chair's sides in the Shading workspace's viewport, fully textured: warm wood on the faces and slightly different wood on the edges."><figcaption><p>Both sides, with wood on the faces and the banding.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Wrap-up</h2>

  <p>That's the basic workflow: take the UVs into Photoshop, fit a texture to
  them, and bring it back into Blender to preview on the mesh <page-anchor
  target="#video-gFglq5aaW1w" value="553">9:13</page-anchor>. Follow the same
  process to unwrap and texture each of the chair's other parts.</p>

