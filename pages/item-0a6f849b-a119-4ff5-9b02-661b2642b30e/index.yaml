  arcing motions and you can notice that as it goes from left to right it has
  descending energy which means each time it bounces it loses energy so it
  doesn't bounce quite as high and it doesn't go quite as far on each bounce
  until finally it comes to close to a resting place here on the last
  frame.</p><p><page-anchor target="#video-rNkxPfMUuKo"
