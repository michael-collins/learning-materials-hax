content: >-
  <p>You'll animate a ball bouncing from left to right, losing height and
  distance with each bounce, by placing it by hand on every frame against a
  reference drawing, the way a hand-drawn animator would. Then you'll add squash
  and stretch, give the ball a drawn outline, and render it two ways: straight
  to a video file, and as an image sequence you put together in After Effects.
  You'll need Blender (the video uses Blender 4.2 LTS) and a reference drawing
  of a bouncing ball with its frames numbered; the last part also uses After
  Effects and Media Encoder.</p>


  <oer-video id="video-rNkxPfMUuKo"
  src="https://www.youtube.com/watch?v=rNkxPfMUuKo" title="Animating a bouncing
  ball – Part 1" credit="Michael Collins"
  credit-url="https://www.youtube.com/channel/UCp1cLW7rry_NKRhcH8bPfGg"></oer-video>


  <h2>Set up the reference and the ball</h2>

  <ol>
    <li>
      <p><strong>Study the reference.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="22">0:22</page-anchor> Each circle in the drawing is the ball on one frame, numbered from 1 to 31, and the red line is its motion path: a series of arcs. The ball has descending energy: each bounce is a little lower and shorter than the last, until it comes to rest on the last frame.</p>
      <figure><img src="files/keyframing-and-rendering-a-bouncing-ball-t0040.4.jpg" alt="A reference drawing of a ball bouncing from left to right: numbered circles from frame 1 to 31 follow a red motion path in three shrinking arcs. The ball touches the ground at frames 7, 17, 25 and 31, and is stretched into ovals on the frames either side of the first contacts."><figcaption><p>The reference: one circle per frame, each bounce lower and shorter than the one before.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Look from the side and bring the reference in.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="58">0:58</page-anchor> Click the <em>X</em> circle on the navigation gizmo at the top right of the viewport to switch to <em>Right Orthographic</em>. (If you leave this view by accident later, click the <em>X</em> again <page-anchor target="#video-rNkxPfMUuKo" value="358">5:58</page-anchor>.) Drag the image file into the viewport: Blender adds it as an empty with the image attached. Delete the default cube, then move the image so the ground line in the drawing sits on the viewport's green Y axis line.</p>
      <figure><img src="files/keyframing-and-rendering-a-bouncing-ball-t0090.0.jpg" alt="Blender's viewport in Right Orthographic view with the reference drawing placed in the scene; the drawing's black ground line lies on the viewport's green Y axis line. The Outliner lists Camera, Empty and Light, with no cube."><figcaption><p>The reference lined up with the ground, seen from the side.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Add a ball the right size.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="99">1:39</page-anchor> Press <kbd>Shift</kbd>+<kbd>A</kbd> and add a <em>UV Sphere</em>, then turn on <em>X-ray</em> so you can see the reference through it. A soccer ball is about 9 inches across, so type <kbd>9"</kbd> (with the inch mark) into the sphere's <em>Dimensions</em> in the sidebar: Blender converts it to 0.229 m, which matches the reference. Move the ball over the first circle, where it sits on frame 1.</p>
    </li>
    <li>
      <p><strong>Set up the timeline.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="173">2:53</page-anchor> Drag the top edge of the <em>Timeline</em> up to give it more room. Drag the playhead to move through the frames, or type a frame number into the current frame field to jump to it. Set <em>End</em> to <kbd>31</kbd> so the timeline covers only the animation.</p>
    </li>
  </ol>


  <h2>Key the ball on every frame</h2>

  <ol>
    <li>
      <p><strong>Turn on auto keying.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="222">3:42</page-anchor> Click the auto keying button (the circle to the left of the playback buttons in the <em>Timeline</em>). Now whenever you move, rotate or scale the ball, Blender adds a keyframe for what you changed on the current frame. Only leave it on while you want that to happen.</p>
      <figure><img src="files/keyframing-and-rendering-a-bouncing-ball-t0235.8.jpg" alt="Close-up of the ball on frame 1 over the first circle of the reference. The sidebar shows the sphere's dimensions as 0.229 m on each axis, with a scale of 0.114. In the Timeline, End is 31 and the auto keying button is on, shown in blue."><figcaption><p>Ready to animate: a 9-inch ball on frame 1, a 31-frame timeline, and auto keying on.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Move to the next frame, then move the ball.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="271">4:31</page-anchor> Move the playhead forward one frame first, then press <kbd>G</kbd> and move the ball into that frame's circle. Do it in that order: if you move the ball before changing frames, it keys the ball in the wrong place on the frame you're still on, and you'll have to move it back. Put the ball in the middle of each circle and keep it round for now; the stretched shapes are squash and stretch, which comes later.</p>
    </li>
    <li>
      <p><strong>Keep going to frame 31.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="342">5:42</page-anchor> Repeat frame by frame. Keying every frame like this is a very manual process, close to hand-drawn animation. Notice the spacing as you go <page-anchor target="#video-rNkxPfMUuKo" value="455">7:35</page-anchor>: where the ball moves faster, there's more distance between one frame and the next, and near the end it barely moves from frame to frame.</p>
      <p>At 24 frames per second, frame 24 is where the first second ends <page-anchor target="#video-rNkxPfMUuKo" value="487">8:07</page-anchor>. Hand-drawn animation is often 12 frames per second and some work is closer to 30, but 24 is the film standard and what's used here.</p>
      <figure><img src="files/keyframing-and-rendering-a-bouncing-ball-t0502.8.jpg" alt="The ball on frame 24, on the way down to the third contact. The Timeline shows the playhead at frame 24 and a keyframe on every frame from 1 to 31."><figcaption><p>Every frame keyed, one at a time.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Play it back.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="538">8:58</page-anchor> Hide the empty so the reference is out of the way, and play the animation to check the motion.</p>
    </li>
  </ol>


  <h2>Add squash and stretch</h2>

  <p>Squash and stretch is one of the 12 principles of animation: changing an
  object's shape to show its speed and weight. Here the ball flattens when it
  hits the ground and stretches as it moves fast.</p>

  <ol>
    <li>
      <p><strong>Key the scale on frame 1 first.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="560">9:20</page-anchor> Pick the <em>Scale</em> tool from the toolbar on the left (press <kbd>T</kbd> if you can't see the tools); its on-screen handles are quicker here than the shortcut. If you scale the ball on frame 7 before the scale has any keyframes, the new scale shows on every frame. Undo, go to frame 1, hover over the <em>Scale</em> values and press <kbd>I</kbd> to insert a keyframe.</p>
    </li>
    <li>
      <p><strong>Squash the ball where it hits the ground.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="621">10:21</page-anchor> On frame 7, scale the ball wider and flatter to match the reference. The flattening shows weight, and that the ball can deform a little. Auto keying only keys the values you changed, so hover over <em>Scale</em> and press <kbd>I</kbd> to key all three together.</p>
      <figure><img src="files/keyframing-and-rendering-a-bouncing-ball-t0645.4.jpg" alt="Frame 7: the ball flattened into a wide oval on the ground line, inside the reference's black contact shape, with the Scale tool's handles on it. The sidebar shows Scale X 0.114, Y 0.177 and Z 0.093."><figcaption><p>The squash on contact: wider and flatter.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Rotate and stretch the ball just before contact.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="665">11:05</page-anchor> Hover over <em>Rotation</em> and press <kbd>I</kbd> to key it too. On frame 6, rotate the ball to line up with the path. The scale handles don't follow the rotated ball until you change the transform orientation in the header from <em>Global</em> to <em>Local</em> <page-anchor target="#video-rNkxPfMUuKo" value="687">11:27</page-anchor>. Then stretch the ball along the path and make it thinner. An object keeps its volume, so if you only stretched it, it would look like it was getting bigger <page-anchor target="#video-rNkxPfMUuKo" value="692">11:32</page-anchor>.</p>
      <figure><img src="files/keyframing-and-rendering-a-bouncing-ball-t0695.4.jpg" alt="Frame 6: the ball rotated about minus 74 degrees on X and stretched into a long, thin oval along the red path just above the ground. The transform orientation in the header is set to Local, and the sidebar shows Scale X 0.114, Y 0.190 and Z 0.095."><figcaption><p>The stretch: rotated along the path, longer and thinner so the ball keeps its volume.</p></figcaption></figure>
      <oer-callout type="warning" title="Apply the scale before you animate">
        <p><page-anchor target="#video-rNkxPfMUuKo" value="770">12:50</page-anchor> The sphere was scaled down without applying the scale, so its normal scale is 0.114 rather than 1, which makes it harder to get the ball back to round. Apply the scale (<kbd>Ctrl</kbd>+<kbd>A</kbd> → <em>Scale</em>) before you start animating. Doing it once the scale is keyed throws the keyed values off.</p>
      </oer-callout>
    </li>
    <li>
      <p><strong>Work through the rest of the frames.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="819">13:39</page-anchor> Follow the arc, rotating with <kbd>R</kbd> <page-anchor target="#video-rNkxPfMUuKo" value="893">14:53</page-anchor> and scaling with the handles. Dragging the square handle between two scale axes scales both at once <page-anchor target="#video-rNkxPfMUuKo" value="864">14:24</page-anchor>. Key rotation and scale on each frame you change.</p>
    </li>
    <li>
      <p><strong>Put the round shape back where it drifts.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="926">15:26</page-anchor> Unless you key every value on every frame in order, Blender fills in the values between keyframes for you. In the sidebar, a yellow field has a keyframe on this frame; a green one is being filled in from the keyframes either side, which is how the ball can lose its round shape in the air. Copy the scale from a frame where the ball is the right size, paste it, and key it on the frames where the ball should be round (here frame 9 and frame 15), so everything between them stays unchanged.</p>
      <figure><img src="files/keyframing-and-rendering-a-bouncing-ball-t0945.0.jpg" alt="Frame 11, near the top of the second bounce. In the sidebar, Location Y and Z are yellow while the Rotation and Scale fields are green, and Scale reads 0.114, 0.110 and 0.115 instead of an even 0.114."><figcaption><p>Green fields are filled in between keyframes: here the scale has drifted from round.</p></figcaption></figure>
      <p>Because every frame is keyed here, which way you rotate the ball doesn't matter <page-anchor target="#video-rNkxPfMUuKo" value="1001">16:41</page-anchor>. It would if Blender were filling in the frames between keyframes.</p>
    </li>
    <li>
      <p><strong>Play it back full size.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="1160">19:20</page-anchor> Hide the empty, go to the side view, hide the sidebar, and press <kbd>Ctrl</kbd>+<kbd>Space</kbd> to make the viewport fill the window. Then play it. The result in the video is a little over-squashed on the ground, but it feels like a natural bounce. Perfecting the timing and spacing frame by frame takes a lot of work, which is why the next part lets Blender fill in frames for you.</p>
    </li>
  </ol>


  <h2>Frame it with an orthographic camera</h2>

  <ol>
    <li>
      <p><strong>Turn off auto keying, then aim the camera.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="1351">22:31</page-anchor> Turn auto keying off first: with it on, moving the camera keys it too <page-anchor target="#video-rNkxPfMUuKo" value="1375">22:55</page-anchor>. Select the camera and set its <em>Rotation</em> to 90, 0, 90 (X, Y, Z) so it looks at the ball from the side, and position it so the whole bounce is in view. In the camera's properties, set <em>Type</em> to <em>Orthographic</em> for a flat side view with no perspective <page-anchor target="#video-rNkxPfMUuKo" value="1404">23:24</page-anchor>.</p>
      <figure><img src="files/keyframing-and-rendering-a-bouncing-ball-t1410.0.jpg" alt="Camera Orthographic view: the ball on frame 1 at the top left, and the ball's path, a line with orange frame numbers 2 to 31, running across the view in shrinking arcs. The sidebar shows the camera's rotation as 90, 0 and 90 degrees, the camera properties show Type set to Orthographic, and auto keying is off."><figcaption><p>The camera from the side, set to Orthographic. The numbered line is a motion path, covered in Part 2.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Save a still.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="1415">23:35</page-anchor> On frame 1, choose <em>View → Viewport Render Image</em>. In the render window, choose <em>Image → Save As</em> and save it (here as viewport-render.png).</p>
    </li>
  </ol>


  <h2>Give the ball a drawn outline</h2>

  <ol>
    <li>
      <p><strong>Start a new material.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="1449">24:09</page-anchor> Go to the <em>Shading</em> workspace and drag the <em>Shader Editor</em> up to give it room. If the ball already has a material, remove it; then click <em>New</em> in the <em>Shader Editor</em>'s header. A new material starts with a <em>Principled BSDF</em>: delete it.</p>
    </li>
    <li>
      <p><strong>Add a Fresnel and an Emission shader.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="1499">24:59</page-anchor> Press <kbd>Shift</kbd>+<kbd>A</kbd> and add a <em>Fresnel</em> node. It works out reflection around the sides of the object, which is what draws the outline. Add an <em>Emission</em> shader <page-anchor target="#video-rNkxPfMUuKo" value="1526">25:26</page-anchor> and connect it to the <em>Material Output</em>'s <em>Surface</em>. Switch the viewport to <em>Rendered</em> shading to see the result; in EEVEE it renders quickly.</p>
    </li>
    <li>
      <p><strong>Put a Color Ramp between them.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="1566">26:06</page-anchor> Add a <em>Color Ramp</em>, connect the Fresnel's <em>Fac</em> to the ramp's <em>Fac</em>, and the ramp's <em>Color</em> to the Emission's <em>Color</em>. Change the ramp's interpolation from <em>Linear</em> to <em>Constant</em> so it jumps from one color to the other with no gradient. Swap the two stops so white is on the left and black on the right <page-anchor target="#video-rNkxPfMUuKo" value="1606">26:46</page-anchor>, then drag the stop toward the left until the black shrinks to a thin outline. The Fresnel's <em>IOR</em> also changes the line's thickness <page-anchor target="#video-rNkxPfMUuKo" value="1644">27:24</page-anchor>.</p>
      <figure><img src="files/keyframing-and-rendering-a-bouncing-ball-t1640.4.jpg" alt="The Shading workspace. In the viewport the ball renders light grey with a thin black outline. In the Shader Editor, a Fresnel node with IOR 1.2 feeds the Fac of a Color Ramp set to Constant, with white at the far left and black for the rest; the ramp's Color goes into an Emission shader, which goes into the Material Output's Surface."><figcaption><p>The outline material: the ramp turns Fresnel's soft edge into a hard black line.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Render a video file</h2>

  <ol>
    <li>
      <p><strong>Save, then choose where the render goes.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="1683">28:03</page-anchor> Save the .blend file. In the <em>Output Properties</em> tab (the icon that looks like a printer), click the folder next to the output path, pick the folder, give the file a name (here video-render.mp4) and click <em>Accept</em>.</p>
    </li>
    <li>
      <p><strong>Set the format to H.264 video.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="1733">28:53</page-anchor> Change <em>File Format</em> from <em>PNG</em> to <em>FFmpeg Video</em>. Open <em>Encoding</em> and set <em>Container</em> to <em>MPEG-4</em> and <em>Video Codec</em> to <em>H.264</em>, a widely used format with decent quality for its file size. <em>Output Quality</em> set to <em>Perceptually Lossless</em> gives better quality and a bigger file. Compressed video like this is fine for a preview, but not as the master copy of a final animation <page-anchor target="#video-rNkxPfMUuKo" value="1797">29:57</page-anchor>.</p>
    </li>
    <li>
      <p><strong>Render the animation.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="1819">30:19</page-anchor> Choose <em>Render → Render Animation</em>. Blender renders frames 1 to 31 into the one file; open it to check. The frame rate is in the <em>Format</em> panel above, with the resolution (1920 by 1080 by default) <page-anchor target="#video-rNkxPfMUuKo" value="1861">31:01</page-anchor>: <em>Frame Rate</em> is 24 fps by default. Change it only if you need to match other footage, such as video from a camera.</p>
      <figure><img src="files/keyframing-and-rendering-a-bouncing-ball-t1835.8.jpg" alt="Blender's render window part way through the animation, showing the grey ball on a dark background. The Output Properties on the right show the output path ending in video-render.mp4, File Format FFmpeg Video, Container MPEG-4, Video Codec H.264 and Output Quality Perceptually Lossless, with Frame Rate 24 fps and frames 1 to 31."><figcaption><p>Render Animation writes all 31 frames into one MP4 file with these settings.</p></figcaption></figure>
    </li>
  </ol>


  <h2>Render an image sequence and finish it in After Effects</h2>

  <ol>
    <li>
      <p><strong>Render the frames as numbered images.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="1909">31:49</page-anchor> Make a new folder in your project folder (here image-sequence) and choose it as the output, with no file name. Set <em>File Format</em> to <em>PNG</em>, which is fine for a preview; in a production workflow where you need control over quality, you'd use something like <em>OpenEXR</em> <page-anchor target="#video-rNkxPfMUuKo" value="1947">32:27</page-anchor>. Choose <em>Render → Render Animation</em> (<em>Render Image</em> renders only the current frame) <page-anchor target="#video-rNkxPfMUuKo" value="1985">33:05</page-anchor>. Blender saves one numbered image per frame: 0001.png, 0002.png and so on, which you can turn into video later.</p>
      <figure><img src="files/keyframing-and-rendering-a-bouncing-ball-t2000.8.jpg" alt="A Finder window showing the image-sequence folder filling with numbered files from 0001.png to 0015.png and counting, beside the project's ball-bounce.blend, video-render.mp4 and viewport-render.png. Behind it, Blender's Output Properties show the image-sequence folder as the output and File Format set to PNG."><figcaption><p>An image sequence: one numbered PNG per frame.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Bring the sequence into After Effects at 24 fps.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="2014">33:34</page-anchor> In a new After Effects project, drag the whole image-sequence folder into the <em>Project</em> panel: it comes in as one piece of footage. It's read at 30 frames per second, so right-click it, choose <em>Interpret Footage → Main</em>, set <em>Assume this frame rate</em> to 24 and click <em>OK</em> <page-anchor target="#video-rNkxPfMUuKo" value="2043">34:03</page-anchor>.</p>
      <figure><img src="files/keyframing-and-rendering-a-bouncing-ball-t2055.8.jpg" alt="After Effects' Interpret Footage dialog for the footage [0001-0031].png, with Assume this frame rate set to 24 frames per second. The Project panel behind it lists the PNG sequence at a frame rate of 30."><figcaption><p>After Effects reads the sequence at 30 fps; set it to 24 so it plays at the speed you animated.</p></figcaption></figure>
    </li>
    <li>
      <p><strong>Make a composition and play it.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="2056">34:16</page-anchor> Drag the footage into the composition area: After Effects makes a new composition for it. Press <kbd>Space</kbd> to play the frames back as video. This is where you could add text, change color or add effects.</p>
    </li>
    <li>
      <p><strong>Export it with Media Encoder.</strong> <page-anchor target="#video-rNkxPfMUuKo" value="2116">35:16</page-anchor> Choose <em>File → Export → Add to Adobe Media Encoder Queue</em>. In Media Encoder, click the output file to choose where it goes and name it (here AE-video.mp4). The format is already <em>H.264</em>; you can keep the default preset or pick one made for a site, such as <em>Vimeo 1080p Full HD</em> <page-anchor target="#video-rNkxPfMUuKo" value="2174">36:14</page-anchor>. Click the green start button to render. The result looks the same as the MP4 rendered from Blender: two ways to get the same animation out.</p>
    </li>
  </ol>


  <h2>What's next</h2>

  <p>You've keyed a bounce by hand on every frame, added squash and stretch,
  given the ball a drawn outline, and rendered it to a video file and to an
  image sequence. Keying every frame gives you full control but takes a long
  time. This part also takes a first look at motion paths <page-anchor
  target="#video-rNkxPfMUuKo" value="1239">20:39</page-anchor>, which draw the
  ball's path with its frame numbers so you can spot frames that break the arc.
  Part 2 covers motion paths and Bounce interpolation, so Blender can fill in
  the frames between fewer keyframes.</p>

