title: Keyframing and rendering a bouncing ball
description: >-
  Animate a ball bouncing across the screen in Blender by placing it on every
  frame against a reference, then add squash and stretch. Give it a drawn
  outline and render it as a video file or as an image sequence you put together
  in After Effects.
